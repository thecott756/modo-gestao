// ── BARCODE ────────────────────────────────────────────────────────────────
function encodeCode128(text){
  const P={103:"11010000100",104:"11010010000",105:"11010011100",
    0:"11011001100",1:"11001101100",2:"11001100110",3:"10010011000",4:"10010001100",
    5:"10001001100",6:"10011001000",7:"10011000100",8:"10001100100",9:"11001001000",
    10:"11001000100",11:"11000100100",12:"10110011100",13:"10011011100",14:"10011001110",
    15:"10111001100",16:"10011101100",17:"10011100110",18:"11001110010",19:"11001011100",
    20:"11001001110",21:"11011100100",22:"11001110100",23:"11101101110",24:"11101001100",
    25:"11100101100",26:"11100100110",27:"11101100100",28:"11100110100",29:"11100110010",
    30:"11011011000",31:"11011000110",32:"11000110110",33:"10100011000",34:"10001011000",
    35:"10001000110",36:"10110001000",37:"10001101000",38:"10001100010",39:"11010001000",
    40:"11000101000",41:"11000100010",42:"10110111000",43:"10110001110",44:"10001101110",
    45:"10111011000",46:"10111000110",47:"10001110110",48:"11101110110",49:"11010001110",
    50:"11000101110",51:"11011101000",52:"11011100010",53:"11011101110",54:"11101011000",
    55:"11101000110",56:"11100010110",57:"11101101000",58:"11101100010",59:"11100011010",
    60:"11101111010",61:"11001000010",62:"11110001010",63:"10100110000",64:"10100001100",
    65:"10010110000",66:"10010000110",67:"10000101100",68:"10000100110",69:"10110010000",
    70:"10110000100",71:"10011010000",72:"10011000010",73:"10000110100",74:"10000110010",
    75:"11000010010",76:"11001010000",77:"11110111010",78:"11000010100",79:"10001111010",
    80:"10100111100",81:"10010111100",82:"10010011110",83:"10111100100",84:"10011110100",
    85:"10011110010",86:"11110100100",87:"11110010100",88:"11110010010",89:"11011011110",
    90:"11011110110",91:"11110110110",92:"10101111000",93:"10100011110",94:"10001011110",
    95:"10111101000",96:"10111100010",97:"11110101000",98:"11110100010",99:"10111011110",
    100:"10111101110",101:"11101011110",102:"11110101110",106:"1100011101011"};
  const START_B=104;
  const data=[START_B,...text.split("").map(c=>c.charCodeAt(0)-32)];
  let check=START_B;
  for(let i=1;i<data.length;i++)check=(check+data[i]*i)%103;
  data.push(check,106);
  return data.map(v=>P[v]||"").join("");
}
function Barcode({value,width=220,height=52}){
  const ref=useRef();
  useEffect(()=>{
    const c=ref.current;if(!c)return;
    const bars=encodeCode128(value);
    const bw=Math.max(1,Math.floor(width/bars.length));
    c.width=bw*bars.length;c.height=height+16;
    const ctx=c.getContext("2d");
    ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
    for(let i=0;i<bars.length;i++){ctx.fillStyle=bars[i]==="1"?"#000":"#fff";ctx.fillRect(i*bw,0,bw,height);}
    ctx.fillStyle="#000";ctx.font="10px monospace";ctx.textAlign="center";
    ctx.fillText(value,c.width/2,height+13);
  },[value,width,height]);
  return <canvas ref={ref} style={{display:"block",maxWidth:"100%"}}/>;
}

        position:"fixed",top:0,left:0,bottom:0,zIndex:100,display:"flex",flexDirection:"column",overflowY:"auto"}}>
        <div style={{padding:"22px 20px 12px"}}>
          <div className="cor" style={{fontSize:28,fontWeight:500,color:C.ink,letterSpacing:1}}>MODO</div>
          <div style={{fontSize:9,color:C.inkFt,fontWeight:600,letterSpacing:3,marginTop:1}}>GESTÃO FASHION</div>
        </div>
        <HR m="0 14px 8px"/>
        <nav style={{flex:1,padding:"0 8px"}}>
          {NAV.map(n=>(
            <button key={n.id} onClick={()=>setTab(n.id)} style={{
              width:"100%",textAlign:"left",padding:"9px 12px",borderRadius:7,border:"none",
              background:tab===n.id?C.hover:"transparent",color:tab===n.id?C.ink:C.inkMd,
              cursor:"pointer",fontSize:13,fontWeight:tab===n.id?600:400,
              display:"flex",alignItems:"center",gap:10,marginBottom:1,transition:"all .12s",
              borderLeft:tab===n.id?`3px solid ${C.gold}`:"3px solid transparent",
            }}>
              <span style={{fontSize:11,opacity:.6}}>{n.icon}</span>{n.label}
            </button>
          ))}
        </nav>
        <div style={{padding:"12px 16px",borderTop:`1px solid ${C.border}`}}>
          <div style={{fontSize:12,fontWeight:600,color:C.ink}}>{user.name}</div>
          <div style={{fontSize:11,color:C.inkLt,marginBottom:8,textTransform:"capitalize"}}>{user.role}</div>
          <button onClick={handleLogout} style={{background:"none",border:"none",color:C.inkLt,fontSize:12,cursor:"pointer"}}>Sair →</button>
        </div>
      </aside>

      {/* MAIN */}
      <main className="main-content" style={{marginLeft:200,flex:1,padding:"32px 36px 80px",minHeight:"100vh"}}>
        {loading?<Loading/>:<>
          {tab==="pdv"       &&<PDV stkL={stkL} setStkL={setStkL} products={products} clients={clients} setClients={setClients} setSales={setSales} addMov={addMov} showToast={showToast} user={user} emitirNFe={emitirNFe} nfeConfig={nfeConfig} logActivity={logActivity}/>}
          {tab==="clientes"  &&<Clients clients={clients} setClients={setClients} sales={sales} showToast={showToast} logActivity={logActivity}/>}
          {tab==="galpao"    &&<StockPage title="Galpão" loc="galpao" stock={stkG} setStock={setStkG} products={products} addMov={addMov} showToast={showToast} table="stock_galpao" logActivity={logActivity}/>}
          {tab==="loja"      &&<StockPage title="Loja" loc="loja" stock={stkL} setStock={setStkL} products={products} addMov={addMov} showToast={showToast} table="stock_loja" logActivity={logActivity}/>}
          {tab==="transfer"  &&<Transfer stkG={stkG} setStkG={setStkG} stkL={stkL} setStkL={setStkL} products={products} addMov={addMov} showToast={showToast} logActivity={logActivity}/>}
          {tab==="produtos"  &&<Products products={products} setProducts={setProducts} setStkG={setStkG} setStkL={setStkL} sales={sales} showToast={showToast} logActivity={logActivity}/>}
          {tab==="vendas"    &&<Sales sales={sales} issuedNFe={issuedNFe}/>}
          {tab==="etiquetas" &&<Labels products={products}/>}
          {tab==="nfe"       &&<NFe sales={sales} clients={clients} issuedNFe={issuedNFe} nfeConfig={nfeConfig} saveNfeConfig={saveNfeConfig} showToast={showToast} emitirNFe={emitirNFe} logActivity={logActivity}/>}
          {tab==="atividades"&&<Atividades activities={activities}/>}
          {tab==="dashboard" &&<Dashboard products={products} stkG={stkG} stkL={stkL} movements={movements} sales={sales}/>}
        </>}
      </main>
      <Toast msg={toast.msg} type={toast.type}/>
    </div>
  );
}

// ── LOGIN ──────────────────────────────────────────────────────────────────
function Login({onLogin}){
  const [login,setLogin]=useState("");const [pw,setPw]=useState("");const [err,setErr]=useState("");
  const go=()=>{const u=USERS.find(u=>u.login===login&&u.pw===pw);if(u)onLogin(u);else setErr("Usuário ou senha incorretos.");};
  return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex"}}>
      <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:32}}>
        <div style={{maxWidth:360,width:"100%"}} className="fu">
          <div className="cor" style={{fontSize:52,fontWeight:300,color:C.ink,marginBottom:2,letterSpacing:2}}>MODO</div>
          <div style={{fontSize:11,color:C.inkLt,letterSpacing:3,marginBottom:40,textTransform:"uppercase"}}>Gestão Fashion</div>
          <Fld label="Usuário" value={login} onChange={setLogin} placeholder="usuario" onKeyDown={e=>e.key==="Enter"&&go()}/>
          <Fld label="Senha" value={pw} onChange={setPw} type="password" placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&go()}/>
          {err&&<div style={{color:C.red,fontSize:13,marginBottom:12,padding:"8px 12px",background:C.redLt,borderRadius:6}}>{err}</div>}
          <button onClick={go} style={{width:"100%",background:"#1A1714",color:"#FFFFFF",border:"none",
            padding:"14px",borderRadius:7,fontWeight:600,fontSize:15,cursor:"pointer",letterSpacing:.5,marginBottom:20}}>
            Entrar
          </button>
        </div>
      </div>
      <div style={{width:"40%",background:`linear-gradient(155deg,${C.goldLt} 0%,#EDE8E2 55%,#E0D8D0 100%)`,
        display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:20,padding:40}}>
        <div className="cor" style={{fontSize:72,opacity:.08,lineHeight:1}}>✦</div>
        <div className="cor" style={{fontSize:18,color:C.inkMd,textAlign:"center",lineHeight:2,fontStyle:"italic"}}>
          "Gestão elegante para<br/>marcas que prezam<br/>pela excelência."
        </div>
      </div>
    </div>
  );
}

// ── VALID PROMO CODES ──────────────────────────────────────────────────────
const PROMO_CODES={
  "MODO10":{pct:10,label:"Cupom MODO10 — 10% off"},
  "MODO15":{pct:15,label:"Cupom MODO15 — 15% off"},
  "LIQUIDACAO":{pct:20,label:"Liquidação — 20% off"},
  "VIP":{pct:10,label:"Cliente VIP — 10% off"},
};

// ── PDV ────────────────────────────────────────────────────────────────────
function PDV({stkL,setStkL,products,clients,setClients,setSales,addMov,showToast,user,logActivity}){
  const [step,setStep]=useState("client");
  const [saleMode,setSaleMode]=useState("balcao");
  const [clientMode,setClientMode]=useState(null);
  const [selClient,setSelClient]=useState(null);
  const [cSearch,setCSearch]=useState("");
  const blankC={name:"",cpfCnpj:"",docType:"cpf",phone:"",email:"",address:"",type:"retail"};
  const [newClient,setNewClient]=useState(blankC);
  const [cart,setCart]=useState([]);
  const [selProd,setSelProd]=useState("");
  const [selSz,setSelSz]=useState("");
  const [barcodeInput,setBarcodeInput]=useState("");
  const [promoCode,setPromoCode]=useState("");
  const [appliedPromo,setAppliedPromo]=useState(null);
  const [payMethod,setPayMethod]=useState("dinheiro");
  const [paid,setPaid]=useState(0);
  const [receipt,setReceipt]=useState(null);
  const [wpPhone,setWpPhone]=useState("");
  const [freight,setFreight]=useState({cep:"",service:"pac",price:0,calc:false});
  const [saving,setSaving]=useState(false);
  const [pickerProd,setPickerProd]=useState(null);
  const [pickerSz,setPickerSz]=useState(null);
  const [pickerQty,setPickerQty]=useState(1);
  const [prodSearch,setProdSearch]=useState("");

  const isWholesale=selClient&&selClient.type==="wholesale";
  const prod=products.find(p=>p.id===Number(selProd));
  const getPrice=p=>isWholesale?(p.wholesalePrice||p.retailPrice):p.retailPrice;
  const getStk=(pId,sz)=>stkL.find(s=>s.pId===pId&&s.sz===sz)?.qty||0;
  const subtotal=cart.reduce((a,b)=>a+b.price*b.qty,0);
  const autoDisc=(payMethod==="dinheiro"||payMethod==="pix")&&!isWholesale?10:0;
  const promoDisc=appliedPromo?.pct||0;
  const extraDisc=Math.max(autoDisc,promoDisc);
  const discAmt=subtotal*extraDisc/100;
  const freightPrice=saleMode==="online"?freight.price:0;
  const total=Math.max(0,subtotal-discAmt+freightPrice);
  const change=payMethod==="dinheiro"?Math.max(0,paid-total):0;

  const applyPromo=()=>{
    const code=promoCode.trim().toUpperCase();
    if(PROMO_CODES[code]){setAppliedPromo({...PROMO_CODES[code],code});showToast(PROMO_CODES[code].label);}
    else{showToast("Código inválido","error");}
  };

  const addItem=()=>{
    if(!selProd||!selSz){showToast("Selecione produto e tamanho","error");return;}
    const av=getStk(Number(selProd),selSz);
    if(av<1){showToast("Sem estoque na loja!","error");return;}
    const p=prod;
    const idx=cart.findIndex(c=>c.pId===Number(selProd)&&c.sz===selSz);
    if(idx>=0){if(cart[idx].qty>=av){showToast("Estoque insuficiente","error");return;}
      setCart(prev=>prev.map((c,i)=>i===idx?{...c,qty:c.qty+1}:c));
    }else{
      setCart(prev=>[...prev,{pId:Number(selProd),name:p.name,sz:selSz,price:getPrice(p),qty:1,cat:p.cat,sku:p.sku}]);
    }
    setSelProd("");setSelSz("");
  };

  const addByBarcode=()=>{
    if(!barcodeInput.trim())return;
    const[sku,sz]=barcodeInput.trim().split("|");
    const p=products.find(x=>x.sku===sku);
    if(!p){showToast("Produto não encontrado","error");setBarcodeInput("");return;}
    const size=sz||p.sizes[0];
    const av=getStk(p.id,size);
    if(av<1){showToast("Sem estoque","error");setBarcodeInput("");return;}
    const idx=cart.findIndex(c=>c.pId===p.id&&c.sz===size);
    if(idx>=0)setCart(prev=>prev.map((c,i)=>i===idx?{...c,qty:c.qty+1}:c));
    else setCart(prev=>[...prev,{pId:p.id,name:p.name,sz:size,price:getPrice(p),qty:1,cat:p.cat,sku:p.sku}]);
    setBarcodeInput("");showToast(`${p.name} (${size}) adicionado`);
  };

  const calcFreight=()=>{
    if(freight.cep.replace(/\D/g,"").length<8){showToast("CEP inválido","error");return;}
    const prices={pac:18.50,sedex:32.80,sedex10:45.20};
    setFreight(f=>({...f,price:prices[f.service]||18.50,calc:true}));
  };

  const finalize=async()=>{
    if(cart.length===0){showToast("Carrinho vazio!","error");return;}
    if(payMethod==="dinheiro"&&paid<total){showToast("Valor pago insuficiente!","error");return;}
    setSaving(true);
    try{
      const now=new Date().toISOString();
      const sale={
        id:uid(),date:now,items:cart,subtotal,
        discount_pct:extraDisc,discount_amt:discAmt,
        freight_price:freightPrice,total,
        payment_method:payMethod,
        paid_amount:payMethod==="dinheiro"?paid:total,
        change_amount:change,
        client_id:selClient?.id||null,
        client_name:selClient?.name||"Avulso",
        client_phone:selClient?.phone||"",
        seller:user.name,is_wholesale:!!isWholesale,
        trade_deadline:add7(now).toISOString(),
        with_nfe:false,nfe_num:"",nfe_chave:"",
        promo_code:appliedPromo?.code||"",
        sale_mode:saleMode,
      };
      await sb.from("sales").insert(sale);
      for(const item of cart){
        const s=stkL.find(s=>s.pId===item.pId&&s.sz===item.sz);
        if(s?._id)await sb.from("stock_loja").update({qty:Math.max(0,s.qty-item.qty)}).eq("id",s._id);
      }
      setStkL(prev=>{const u=[...prev];cart.forEach(item=>{const idx=u.findIndex(s=>s.pId===item.pId&&s.sz===item.sz);if(idx>=0)u[idx]={...u[idx],qty:u[idx].qty-item.qty};});return u;});
      const displaySale={...sale,clientName:sale.client_name,discountAmt:discAmt,discountPct:extraDisc,freightPrice,isWholesale:!!isWholesale,withNFe:false,tradeDeadline:add7(now).toISOString(),paymentMethod:payMethod,paidAmount:payMethod==="dinheiro"?paid:total,change};
      setSales(prev=>[displaySale,...prev]);
      await addMov({type:"venda",loc:"loja",desc:`Venda ${saleMode==="online"?"Online":"Balcão"} – ${cart.length} item(s) – ${fmt(total)}`});
      await logActivity("venda",`${selClient?.name||"Avulso"} — ${fmt(total)}${appliedPromo?` · ${appliedPromo.code}`:""}`);
      setReceipt(displaySale);
      setCart([]);setSelProd("");setSelSz("");setPaid(0);
      setAppliedPromo(null);setPromoCode("");
      setFreight({cep:"",service:"pac",price:0,calc:false});
      showToast("Venda finalizada!");
    }catch(e){showToast("Erro ao salvar venda","error");console.error(e);}
    setSaving(false);
  };

  const sendWA=(sale)=>{
    const phone=(wpPhone||sale.client_phone||"").replace(/\D/g,"");
    const items=sale.items.map(i=>`• ${i.name} (${i.sz}) ×${i.qty} — ${fmt(i.price*i.qty)}`).join("\n");
    const msg=encodeURIComponent(`*COMPROVANTE — MODO*\n${fmtD(sale.date)}\n\n${items}`+
      (sale.discountAmt>0?`\nDesconto ${sale.discountPct}%: -${fmt(sale.discountAmt)}`:"")+(sale.freightPrice>0?`\nFrete: ${fmt(sale.freightPrice)}`:"")+
      `\n\n*TOTAL: ${fmt(sale.total)}*\nPagamento: ${sale.paymentMethod}`+
      `\n\n📅 Troca até: ${fmtDS(sale.tradeDeadline)} (7 dias)\n\nObrigado! 🛍️`);
    window.open(`https://wa.me/55${phone}?text=${msg}`,"_blank");
  };

  const filteredClients=clients.filter(c=>
    c.name.toLowerCase().includes(cSearch.toLowerCase())||
    (c.cpf_cnpj&&c.cpf_cnpj.includes(cSearch))||(c.phone&&c.phone.includes(cSearch))
  );

  const saveNewClient=async()=>{
    if(!newClient.name){showToast("Nome obrigatório","error");return;}
    const c={...newClient,id:uid(),cpf_cnpj:newClient.cpfCnpj,created_at:new Date().toISOString()};
    await sb.from("clients").insert({id:c.id,name:c.name,cpf_cnpj:c.cpfCnpj,doc_type:c.docType,phone:c.phone,email:c.email,address:c.address,type:c.type,created_at:c.created_at});
    setClients(p=>[...p,{...c,cpf_cnpj:c.cpfCnpj}]);setSelClient(c);setStep("sale");showToast("Cliente cadastrado!");
  };

  const resetSale=()=>{setStep("client");setClientMode(null);setSelClient(null);setCart([]);setNewClient(blankC);setAppliedPromo(null);setPromoCode("");setSaleMode("balcao");};

  // ── STEP 1 — CLIENT ──
  if(step==="client")return(
    <div className="fu">
      <PageHeader title="Nova Venda" sub="Passo 1 de 2 — Identificar cliente"/>
      {/* sale mode selector */}
      <div style={{display:"flex",gap:10,marginBottom:24,maxWidth:360}}>
        {[{id:"balcao",icon:"🏪",label:"Balcão"},{id:"online",icon:"📦",label:"Online / Entrega"}].map(o=>(
          <button key={o.id} onClick={()=>setSaleMode(o.id)} style={{flex:1,padding:"12px",borderRadius:9,border:`1.5px solid ${saleMode===o.id?C.gold:C.border}`,background:saleMode===o.id?C.goldLt:"transparent",color:saleMode===o.id?C.gold:C.inkMd,cursor:"pointer",fontWeight:saleMode===o.id?600:400,fontSize:14}}>
            {o.icon} {o.label}
          </button>
        ))}
      </div>
      {!clientMode&&(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:14,maxWidth:560}}>
          {[{id:"existing",icon:"🔍",label:"Cliente cadastrado",desc:"Buscar na base"},
            {id:"new",icon:"➕",label:"Novo cadastro",desc:"Registrar cliente"},
            {id:"anonymous",icon:"🛒",label:"Venda avulsa",desc:"Sem cadastro"}].map(o=>(
            <button key={o.id} onClick={()=>{setClientMode(o.id);if(o.id==="anonymous"){setSelClient(null);setStep("sale");}}}
              style={{padding:"24px 16px",borderRadius:12,border:`1.5px solid ${C.border}`,background:C.surface,cursor:"pointer",textAlign:"center",transition:"all .18s"}}>
              <div style={{fontSize:32,marginBottom:10}}>{o.icon}</div>
              <div style={{fontWeight:600,fontSize:14,marginBottom:3}}>{o.label}</div>
              <div style={{fontSize:12,color:C.inkLt}}>{o.desc}</div>
            </button>
          ))}
        </div>
      )}
      {clientMode==="existing"&&(
        <div style={{maxWidth:520}}>
          <div style={{display:"flex",gap:10,marginBottom:16}}>
            <input value={cSearch} onChange={e=>setCSearch(e.target.value)} placeholder="Nome, CPF, CNPJ ou telefone..."
              style={{flex:1,background:C.surface,border:`1px solid ${C.border}`,borderRadius:7,color:C.ink,padding:"10px 13px",fontSize:14,outline:"none"}}/>
            <Btn v="ghost" onClick={()=>setClientMode(null)}>← Voltar</Btn>
          </div>
          <div style={{display:"grid",gap:8,maxHeight:340,overflowY:"auto"}}>
            {filteredClients.map(c=>(
              <button key={c.id} onClick={()=>{setSelClient(c);setStep("sale");}} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",borderRadius:10,border:`1.5px solid ${C.border}`,background:C.surface,cursor:"pointer",textAlign:"left",width:"100%"}}>
                <div style={{width:38,height:38,borderRadius:"50%",background:C.goldLt,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,color:C.gold,fontSize:15,flexShrink:0}}>{(c.name.replace(/^[\d.\s]+/,""))[0]}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:500,fontSize:13.5}}>{c.name.replace(/^[\d.\s]+/,"")}</div>
                  <div style={{fontSize:12,color:C.inkLt}}>{c.phone}{c.type==="wholesale"?" · Atacado":""}</div>
                </div>
                {c.type==="wholesale"&&<Badge color={C.purple}>Atacado</Badge>}
              </button>
            ))}
            {filteredClients.length===0&&<div style={{color:C.inkFt,fontSize:13,textAlign:"center",padding:24}}>Nenhum resultado.</div>}
          </div>
        </div>
      )}
      {clientMode==="new"&&(
        <div style={{maxWidth:480}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <span style={{fontSize:15,fontWeight:600}}>Novo cliente</span>
            <Btn v="ghost" sz="sm" onClick={()=>setClientMode(null)}>← Voltar</Btn>
          </div>
          <Card>
            <Fld label="Nome completo" value={newClient.name} onChange={v=>setNewClient(f=>({...f,name:v}))} required/>
            <div style={{display:"grid",gridTemplateColumns:"120px 1fr",gap:10}}>
              <Fld label="Tipo doc." value={newClient.docType} onChange={v=>setNewClient(f=>({...f,docType:v}))}
                options={[{value:"cpf",label:"CPF"},{value:"cnpj",label:"CNPJ"}]}/>
              <Fld label={newClient.docType==="cnpj"?"CNPJ":"CPF"} value={newClient.cpfCnpj} onChange={v=>setNewClient(f=>({...f,cpfCnpj:v}))}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <Fld label="Telefone" value={newClient.phone} onChange={v=>setNewClient(f=>({...f,phone:v}))} placeholder="(11) 99999-9999"/>
              <Fld label="E-mail" value={newClient.email} onChange={v=>setNewClient(f=>({...f,email:v}))} type="email"/>
            </div>
            <Fld label="Tipo cliente" value={newClient.type} onChange={v=>setNewClient(f=>({...f,type:v}))}
              options={[{value:"retail",label:"Varejo"},{value:"wholesale",label:"Atacado"}]}/>
            <Btn onClick={saveNewClient} full>Salvar e continuar →</Btn>
          </Card>
        </div>
      )}
    </div>
  );

  const filteredProds=products.filter(p=>
    p.name.toLowerCase().includes(prodSearch.toLowerCase())||
    (p.sku||"").toLowerCase().includes(prodSearch.toLowerCase())
  );

  const confirmPickerAdd=()=>{
    if(!pickerProd||!pickerSz)return;
    const av=getStk(pickerProd.id,pickerSz);
    if(av<1){showToast("Sem estoque","error");return;}
    const qty=Math.min(pickerQty,av);
    const idx=cart.findIndex(c=>c.pId===pickerProd.id&&c.sz===pickerSz);
    if(idx>=0){
      setCart(prev=>prev.map((c,i)=>i===idx?{...c,qty:Math.min(c.qty+qty,av)}:c));
    }else{
      setCart(prev=>[...prev,{pId:pickerProd.id,name:pickerProd.name,sz:pickerSz,price:getPrice(pickerProd),qty,cat:pickerProd.cat,sku:pickerProd.sku}]);
    }
    showToast(pickerProd.name+" ("+pickerSz+") ×"+qty+" adicionado");
    setPickerProd(null);setPickerSz(null);setPickerQty(1);
  };

  return(
    <div className="fu">
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div className="cor" style={{fontSize:28,fontWeight:400}}>Nova Venda</div>
            <Badge color={saleMode==="online"?C.blue:C.green}>{saleMode==="online"?"📦 Online":"🏪 Balcão"}</Badge>
          </div>
          <div style={{fontSize:13,color:C.inkLt,marginTop:2}}>
            {selClient
              ?<><strong style={{color:C.ink}}>{selClient.name.replace(/^[\d.\s]+/,"")}</strong>{isWholesale&&<span style={{marginLeft:8,color:C.purple,fontWeight:600}}>· Atacado</span>}</>
              :"Venda avulsa"}
          </div>
        </div>
        <Btn v="ghost" sz="sm" onClick={resetSale}>← Trocar cliente</Btn>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 300px",gap:16,alignItems:"start"}}>

        {/* ── LEFT: PRODUCT PICKER + CART ── */}
        <div style={{display:"flex",flexDirection:"column",gap:12}}>

          {/* Barcode (hidden input, auto-triggered by scanner) */}
          <input value={barcodeInput} onChange={e=>setBarcodeInput(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&addByBarcode()}
            style={{position:"absolute",opacity:0,pointerEvents:"none",width:1,height:1}}
            aria-hidden="true"/>

          {/* Product picker */}
          <Card>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <SectionTitle style={{marginBottom:0}}>Produtos</SectionTitle>
              <input value={prodSearch} onChange={e=>setProdSearch(e.target.value)}
                placeholder="Buscar..." autoFocus
                style={{background:C.hover,border:`1px solid ${C.border}`,borderRadius:6,color:C.ink,padding:"6px 11px",fontSize:13,outline:"none",width:160}}/>
            </div>

            {/* Product grid */}
            {!pickerProd&&(
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:8,maxHeight:320,overflowY:"auto"}}>
                {filteredProds.map(p=>{
                  const totalStk=p.sizes?.reduce((a,sz)=>a+getStk(p.id,sz),0)||0;
                  const cc=CAT_COLOR[p.cat]||"#C8C0B4";
                  return(
                    <button key={p.id} onClick={()=>{setPickerProd(p);setPickerSz(null);setPickerQty(1);}}
                      style={{padding:"12px 10px",borderRadius:10,border:`1.5px solid ${C.border}`,background:C.surface,cursor:totalStk>0?"pointer":"not-allowed",textAlign:"center",opacity:totalStk>0?1:.45,transition:"all .12s",position:"relative"}}
                      onMouseEnter={e=>{if(totalStk>0)e.currentTarget.style.borderColor=cc;}}
                      onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}
                      disabled={totalStk===0}>
                      <div style={{fontSize:26,marginBottom:5}}>{CAT_ICON[p.cat]||"👕"}</div>
                      <div style={{fontSize:12,fontWeight:600,lineHeight:1.3,marginBottom:4}}>{p.name}</div>
                      <div style={{fontSize:10.5,color:C.inkLt}}>{p.sku}</div>
                      <div style={{fontSize:11,color:totalStk>3?C.green:C.red,fontWeight:600,marginTop:3}}>{totalStk} peças</div>
                    </button>
                  );
                })}
                {filteredProds.length===0&&<div style={{gridColumn:"1/-1",textAlign:"center",padding:24,color:C.inkFt,fontSize:13}}>Nenhum produto encontrado.</div>}
              </div>
            )}

            {/* Size picker — shown after product selected */}
            {pickerProd&&(
              <div>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,padding:"10px 14px",background:C.hover,borderRadius:8}}>
                  <span style={{fontSize:22}}>{CAT_ICON[pickerProd.cat]||"👕"}</span>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:14}}>{pickerProd.name}</div>
                    <div style={{fontSize:12,color:C.inkLt}}>{fmt(getPrice(pickerProd))}</div>
                  </div>
                  <button onClick={()=>{setPickerProd(null);setPickerSz(null);}} style={{background:"none",border:"none",cursor:"pointer",color:C.inkLt,fontSize:18}}>←</button>
                </div>

                <div style={{fontSize:11,fontWeight:700,color:C.inkMd,letterSpacing:.6,marginBottom:8,textTransform:"uppercase"}}>Selecione o tamanho</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:16}}>
                  {pickerProd.sizes?.map(sz=>{
                    const stk=getStk(pickerProd.id,sz);
                    const sel=pickerSz===sz;
                    return(
                      <button key={sz} onClick={()=>{if(stk>0){setPickerSz(sz);setPickerQty(1);}}}
                        style={{padding:"12px 18px",borderRadius:9,border:`2px solid ${sel?C.gold:stk>0?C.border:"#ddd"}`,
                          background:sel?C.goldLt:stk>0?C.surface:"#f9f9f9",
                          color:sel?C.gold:stk>0?C.ink:C.inkFt,
                          cursor:stk>0?"pointer":"not-allowed",
                          fontWeight:sel?700:500,fontSize:16,minWidth:56,textAlign:"center",
                          opacity:stk>0?1:.4,transition:"all .1s",position:"relative"}}>
                        {sz}
                        <div style={{fontSize:9,color:sel?C.gold:stk>2?C.green:C.red,marginTop:2,fontWeight:600}}>{stk} un</div>
                      </button>
                    );
                  })}
                </div>

                {pickerSz&&(
                  <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",background:C.goldLt,borderRadius:9,border:`1.5px solid ${C.gold}`}}>
                    <div style={{flex:1,fontSize:14}}>
                      <strong>{pickerProd.name}</strong> — Tam <strong>{pickerSz}</strong>
                      <div style={{fontSize:12,color:C.inkMd,marginTop:2}}>{fmt(getPrice(pickerProd))} × {pickerQty} = <strong style={{color:C.green}}>{fmt(getPrice(pickerProd)*pickerQty)}</strong></div>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <button onClick={()=>setPickerQty(q=>Math.max(1,q-1))} style={{width:32,height:32,borderRadius:6,border:`1px solid ${C.border}`,background:"#fff",cursor:"pointer",fontSize:18,fontWeight:700}}>−</button>
                      <input type="number" value={pickerQty} min={1} max={getStk(pickerProd.id,pickerSz)}
                        onChange={e=>setPickerQty(Math.max(1,Math.min(Number(e.target.value),getStk(pickerProd.id,pickerSz))))}
                        onKeyDown={e=>e.key==="Enter"&&confirmPickerAdd()}
                        style={{width:48,textAlign:"center",border:`1px solid ${C.border}`,borderRadius:6,padding:"6px",fontSize:16,fontWeight:700,outline:"none"}}/>
                      <button onClick={()=>setPickerQty(q=>Math.min(q+1,getStk(pickerProd.id,pickerSz)))} style={{width:32,height:32,borderRadius:6,border:`1px solid ${C.border}`,background:"#fff",cursor:"pointer",fontSize:18,fontWeight:700}}>+</button>
                    </div>
                    <Btn v="success" onClick={confirmPickerAdd}>✓ Add</Btn>
                  </div>
                )}
              </div>
            )}
          </Card>

          {/* Cart */}
          <Card>
            <SectionTitle>Carrinho {cart.length>0&&<Badge color={C.green}>{cart.reduce((a,b)=>a+b.qty,0)} itens</Badge>}</SectionTitle>
            {cart.length===0
              ?<div style={{textAlign:"center",padding:"20px 0",color:C.inkFt,fontSize:13}}>Nenhum item adicionado.</div>
              :cart.map((item,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:11,padding:"9px 0",borderBottom:`1px solid ${C.border}`}}>
                  <Thumb p={{cat:item.cat}} size={36}/>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:500,fontSize:13.5}}>{item.name}</div>
                    <div style={{fontSize:12,color:C.inkLt}}>Tam: {item.sz} · {fmt(item.price)}{isWholesale&&<span style={{color:C.purple}}> · Atacado</span>}</div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:5}}>
                    <button onClick={()=>setCart(p=>p.map((c,j)=>j===i&&c.qty>1?{...c,qty:c.qty-1}:c))} style={{width:26,height:26,borderRadius:5,border:`1px solid ${C.border}`,background:C.hover,cursor:"pointer",fontSize:15}}>−</button>
                    <span style={{fontWeight:700,minWidth:22,textAlign:"center"}}>{item.qty}</span>
                    <button onClick={()=>setCart(p=>p.map((c,j)=>j===i?{...c,qty:c.qty+1}:c))} style={{width:26,height:26,borderRadius:5,border:`1px solid ${C.border}`,background:C.hover,cursor:"pointer",fontSize:15}}>+</button>
                    <span style={{color:C.green,fontWeight:600,fontSize:13.5,minWidth:72,textAlign:"right"}}>{fmt(item.price*item.qty)}</span>
                    <button onClick={()=>setCart(p=>p.filter((_,j)=>j!==i))} style={{background:C.redLt,border:"none",color:C.red,width:24,height:24,borderRadius:5,cursor:"pointer",fontSize:13}}>×</button>
                  </div>
                </div>
              ))
            }
            {cart.length>0&&<div style={{display:"flex",justifyContent:"flex-end",paddingTop:12}}>
              <div className="cor" style={{fontSize:22}}>Subtotal: <span style={{color:C.green}}>{fmt(subtotal)}</span></div>
            </div>}
          </Card>
        </div>

        {/* ── RIGHT: PAYMENT ── */}
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {isWholesale&&<div style={{background:C.purpleLt,borderRadius:8,padding:"10px 14px",fontSize:13,color:C.purple,fontWeight:500}}>✅ Preço atacado aplicado.</div>}

          {!isWholesale&&(
            <Card>
              <SectionTitle>Código Promocional</SectionTitle>
              {appliedPromo
                ?<div style={{background:C.greenLt,borderRadius:7,padding:"9px 13px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div><div style={{fontSize:12,fontWeight:700,color:C.green}}>{appliedPromo.code}</div>
                    <div style={{fontSize:11,color:C.green}}>{appliedPromo.label}</div></div>
                    <button onClick={()=>setAppliedPromo(null)} style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:18}}>×</button>
                  </div>
                :<div style={{display:"flex",gap:7}}>
                    <input value={promoCode} onChange={e=>setPromoCode(e.target.value.toUpperCase())}
                      onKeyDown={e=>e.key==="Enter"&&applyPromo()}
                      placeholder="Ex: MODO10"
                      style={{flex:1,background:C.hover,border:`1px solid ${C.border}`,borderRadius:6,color:C.ink,padding:"8px 11px",fontSize:13,outline:"none"}}/>
                    <Btn v="gold" sz="sm" onClick={applyPromo}>Aplicar</Btn>
                  </div>
              }
              {(payMethod==="dinheiro"||payMethod==="pix")&&!appliedPromo&&(
                <div style={{marginTop:8,fontSize:11.5,color:C.gold}}>💡 À vista = 10% de desconto automático.</div>
              )}
            </Card>
          )}

          {saleMode==="online"&&(
            <Card>
              <SectionTitle>Frete</SectionTitle>
              <div style={{display:"flex",gap:7,marginBottom:8}}>
                <input value={freight.cep} onChange={e=>setFreight(f=>({...f,cep:e.target.value,calc:false}))}
                  placeholder="CEP destino" maxLength={9}
                  style={{flex:1,background:C.hover,border:`1px solid ${C.border}`,borderRadius:6,color:C.ink,padding:"8px 10px",fontSize:13,outline:"none"}}/>
                <Btn v="ghost" sz="sm" onClick={calcFreight}>Calcular</Btn>
              </div>
              <select value={freight.service} onChange={e=>setFreight(f=>({...f,service:e.target.value,calc:false}))}
                style={{width:"100%",background:C.hover,border:`1px solid ${C.border}`,borderRadius:6,color:C.ink,padding:"8px 10px",fontSize:13,outline:"none"}}>
                <option value="pac">PAC</option><option value="sedex">SEDEX</option><option value="sedex10">SEDEX 10</option>
              </select>
              {freight.calc&&<div style={{fontSize:13,color:C.blue,fontWeight:500,marginTop:8}}>+ {fmt(freight.price)}</div>}
            </Card>
          )}

          <Card>
            <SectionTitle>Pagamento</SectionTitle>
            {[{id:"dinheiro",l:"💵 Dinheiro"},{id:"pix",l:"⚡ PIX"},{id:"cartao",l:"💳 Cartão"},{id:"boleto",l:"📄 Boleto"}].map(o=>(
              <button key={o.id} onClick={()=>setPayMethod(o.id)} style={{display:"block",width:"100%",textAlign:"left",padding:"9px 13px",borderRadius:7,border:`1.5px solid ${payMethod===o.id?C.gold:C.border}`,background:payMethod===o.id?C.goldLt:"transparent",color:payMethod===o.id?C.gold:C.inkMd,cursor:"pointer",fontSize:13.5,fontWeight:payMethod===o.id?600:400,marginBottom:6}}>{o.l}</button>
            ))}
            {payMethod==="dinheiro"&&(
              <div style={{marginTop:4}}>
                <Fld label="Valor recebido (R$)" value={paid} onChange={v=>setPaid(Number(v))} type="number"/>
                {paid>0&&<div style={{padding:"8px 12px",background:C.greenLt,borderRadius:6,color:C.green,fontWeight:600,fontSize:13}}>Troco: {fmt(change)}</div>}
              </div>
            )}
          </Card>

          <Card>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12.5,color:C.inkMd,marginBottom:5}}><span>Subtotal</span><span>{fmt(subtotal)}</span></div>
            {extraDisc>0&&<div style={{display:"flex",justifyContent:"space-between",fontSize:12.5,color:C.red,marginBottom:4}}>
              <span>{appliedPromo?appliedPromo.label:"À vista "+extraDisc+"%"}</span><span>− {fmt(discAmt)}</span>
            </div>}
            {freightPrice>0&&<div style={{display:"flex",justifyContent:"space-between",fontSize:12.5,color:C.blue,marginBottom:4}}><span>Frete</span><span>{fmt(freightPrice)}</span></div>}
            <HR m="8px 0 12px"/>
            <div className="cor" style={{fontSize:34,textAlign:"center",marginBottom:14}}><span style={{color:C.green}}>{fmt(total)}</span></div>
            <Btn v="success" onClick={finalize} full sz="lg" disabled={saving||cart.length===0}>{saving?"Salvando...":"✅ Finalizar Venda"}</Btn>
          </Card>
        </div>
      </div>

      {/* RECEIPT */}
      {receipt&&(
        <div style={{position:"fixed",top:0,left:0,width:"100vw",height:"100vh",background:"rgba(26,23,20,.65)",backdropFilter:"blur(4px)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",paddingLeft:"200px"}}>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:14,width:"90%",maxWidth:480,maxHeight:"90vh",overflowY:"auto",padding:28,boxShadow:"0 24px 80px rgba(0,0,0,.25)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <div className="cor" style={{fontSize:20}}>✅ Venda Concluída</div>
              <button onClick={()=>{setReceipt(null);resetSale();}} style={{background:"none",border:"none",color:C.inkFt,fontSize:28,cursor:"pointer"}}>×</button>
            </div>
            <div style={{background:C.hover,borderRadius:10,padding:18,marginBottom:16,fontFamily:"monospace",fontSize:12.5,lineHeight:2}}>
              <div className="cor" style={{textAlign:"center",fontSize:20,marginBottom:2}}>✦ THE COTT ✦</div>
              <div style={{textAlign:"center",fontSize:11,color:C.inkLt,marginBottom:10}}>{fmtD(receipt.date)}</div>
              <div>Cliente: {(receipt.clientName||"Avulso").replace(/^[\d.\s]+/,"")}</div>
              <div>Vendedor: {receipt.seller}</div>
              {receipt.isWholesale&&<div>Tipo: ATACADO</div>}
              {receipt.sale_mode==="online"&&<div>Modalidade: ONLINE/ENTREGA</div>}
              <HR/>
              {receipt.items?.map((item,i)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between"}}>
                  <span>{item.name} ({item.sz}) ×{item.qty}</span>
                  <span>{fmt(item.price*item.qty)}</span>
                </div>
              ))}
              <HR/>
              {receipt.discountAmt>0&&<div style={{display:"flex",justifyContent:"space-between",color:C.red}}>
                <span>{receipt.promo_code?"Cupom "+receipt.promo_code:"Desconto "+receipt.discountPct+"%"}</span>
                <span>-{fmt(receipt.discountAmt)}</span>
              </div>}
              {receipt.freightPrice>0&&<div style={{display:"flex",justifyContent:"space-between",color:C.blue}}><span>Frete</span><span>{fmt(receipt.freightPrice)}</span></div>}
              <div style={{display:"flex",justifyContent:"space-between",fontWeight:700,fontSize:14,marginTop:4}}><span>TOTAL</span><span>{fmt(receipt.total)}</span></div>
              <div>Pagamento: {receipt.paymentMethod}</div>
              {receipt.paymentMethod==="dinheiro"&&receipt.change>0&&<div>Troco: {fmt(receipt.change)}</div>}
              <HR/>
              <div style={{fontSize:11,color:C.inkMd}}>📅 Troca até: <strong>{fmtDS(receipt.tradeDeadline)}</strong> (7 dias)</div>
            </div>
            <Fld label="WhatsApp do cliente" value={wpPhone} onChange={setWpPhone} placeholder="(24) 99999-9999"/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:4}}>
              <Btn onClick={()=>sendWA(receipt)} v="success">📱 WhatsApp</Btn>
              <Btn onClick={()=>window.print()} v="secondary">🖨️ Imprimir</Btn>
            </div>
            <Btn onClick={()=>{setReceipt(null);resetSale();}} full v="ghost" style={{marginTop:8}}>🛒 Nova Venda</Btn>
          </div>
        </div>
      )}
    </div>
  );
}



// ── CLIENTS ────────────────────────────────────────────────────────────────
// ── CLIENTS ────────────────────────────────────────────────────────────────
function Clients({clients,setClients,sales,showToast,logActivity}){
  const [view,setView]=useState("list");
  const [clientTab,setClientTab]=useState("varejo"); // varejo | atacado
  const [selId,setSelId]=useState(null);
  const [search,setSearch]=useState("");
  const [cnpjLoading,setCnpjLoading]=useState(false);
  const [cepLoading,setCepLoading]=useState(false);
  const blank={name:"",tradeName:"",cpfCnpj:"",ie:"",docType:"cpf",phone:"",email:"",cep:"",address:"",number:"",city:"",state:"",type:"retail",cnpjStatus:""};
  const [form,setForm]=useState(blank);
  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));

  const fetchCEP=async(cep)=>{
    const clean=cep.replace(/\D/g,"");
    if(clean.length!==8)return;
    setCepLoading(true);
    try{
      const r=await fetch(`https://viacep.com.br/ws/${clean}/json/`);
      const d=await r.json();
      if(!d.erro){
        setForm(f=>({...f,address:d.logradouro||"",city:d.localidade||"",state:d.uf||""}));
        showToast("Endereço preenchido pelo CEP","info");
      }else showToast("CEP não encontrado","error");
    }catch(e){showToast("Erro ao buscar CEP","error");}
    setCepLoading(false);
  };

  const fetchCNPJ=async(cnpj)=>{
    const clean=cnpj.replace(/\D/g,"");
    if(clean.length!==14){showToast("CNPJ deve ter 14 dígitos","error");return;}
    setCnpjLoading(true);
    try{
      const r=await fetch(`https://brasilapi.com.br/api/cnpj/v1/${clean}`);
      if(!r.ok){showToast("CNPJ não encontrado","error");setCnpjLoading(false);return;}
      const d=await r.json();
      setForm(f=>({...f,
        name:d.razao_social||f.name,
        tradeName:d.nome_fantasia||f.tradeName,
        address:d.logradouro||f.address,
        number:d.numero||f.number,
        city:d.municipio||f.city,
        state:d.uf||f.state,
        cep:d.cep?.replace(/\D/g,"")||f.cep,
        cnpjStatus:d.descricao_situacao_cadastral||"",
        type:"wholesale",
      }));
      showToast(`CNPJ: ${d.descricao_situacao_cadastral}`,"info");
    }catch(e){showToast("Erro ao consultar CNPJ","error");}
    setCnpjLoading(false);
  };

  const save=async()=>{
    if(!form.name){showToast("Nome obrigatório","error");return;}
    if(form.cpfCnpj){
      const cpfClean=form.cpfCnpj.replace(/\D/g,"");
      const dup=clients.find(c=>{
        const existing=(c.cpf_cnpj||c.cpf||"").replace(/\D/g,"");
        return existing&&existing===cpfClean;
      });
      if(dup){showToast("CPF/CNPJ já cadastrado: "+cleanName(dup.name),"error");return;}
    }
    const type=form.docType==="cnpj"?"wholesale":form.type;
    const fullAddress=`${form.address}${form.number?", "+form.number:""}`;
    const c={id:uid(),name:form.name,trade_name:form.tradeName,cpf_cnpj:form.cpfCnpj,
      ie:form.ie,doc_type:form.docType,phone:form.phone,email:form.email||"",
      cep:form.cep,address:fullAddress,city:form.city,state:form.state,
      type,cnpj_status:form.cnpjStatus,cashback_balance:0,created_at:new Date().toISOString()};
    const{error}=await sb.from("clients").insert(c);
    if(error){showToast("Erro: "+error.message,"error");return;}
    setClients(p=>[...p,c]);
    await logActivity("cliente_cadastrado",c.name);
    showToast("Cliente cadastrado!");
    setView("list");setForm(blank);
  };

  const selClient=clients.find(c=>c.id===selId);
  const clientSales=sales.filter(s=>s.client_id===selId||s.clientId===selId);
  const totalSpent=clientSales.reduce((a,s)=>a+(s.total||0),0);

  const cleanName=n=>(n||"").replace(/^[\d.\s]+/,"");
  const sortedClients=[...clients].sort((a,b)=>cleanName(a.name).localeCompare(cleanName(b.name),"pt-BR"));
  const varejo=sortedClients.filter(c=>c.type==="retail"||c.type!=="wholesale");
  const atacado=sortedClients.filter(c=>c.type==="wholesale");
  const listToShow=(clientTab==="varejo"?varejo:atacado).filter(c=>
    cleanName(c.name).toLowerCase().includes(search.toLowerCase())||
    (c.cpf_cnpj&&c.cpf_cnpj.includes(search))||(c.cpf&&c.cpf.includes(search))||(c.phone&&c.phone.includes(search))
  );

  // DETAIL
  if(view==="detail"&&selClient)return(
    <div className="fu">
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
        <button onClick={()=>setView("list")} style={{background:"none",border:"none",color:C.inkMd,cursor:"pointer",fontSize:22}}>←</button>
        <div style={{flex:1}}>
          <div className="cor" style={{fontSize:28,fontWeight:400}}>{selClient.name}</div>
          {selClient.trade_name&&<div style={{fontSize:12,color:C.inkLt}}>{selClient.trade_name}</div>}
        </div>
        <Badge color={selClient.type==="wholesale"?C.purple:C.green}>{selClient.type==="wholesale"?"Atacado":"Varejo"}</Badge>
        {selClient.cnpj_status&&<Badge color={selClient.cnpj_status.includes("ATIVA")?C.green:C.red}>{selClient.cnpj_status}</Badge>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:20}}>
        <Card>
          <SectionTitle>Dados</SectionTitle>
          <div style={{fontSize:13.5,lineHeight:2.2,color:C.inkMd}}>
            <div><strong style={{color:C.ink}}>{selClient.doc_type?.toUpperCase()}:</strong> {selClient.cpf_cnpj}</div>
            {selClient.ie&&<div><strong style={{color:C.ink}}>IE:</strong> {selClient.ie}</div>}
            {selClient.phone&&<div>📱 {selClient.phone}</div>}
            {selClient.email&&<div>✉️ {selClient.email}</div>}
            {selClient.address&&<div>📍 {selClient.address}{selClient.city?`, ${selClient.city}`:""}{selClient.state?`/${selClient.state}`:""}</div>}
          </div>
        </Card>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Card>
            <SectionTitle>Total Compras</SectionTitle>
            <div className="cor" style={{fontSize:26,color:C.green}}>{fmt(totalSpent)}</div>
            <div style={{fontSize:12,color:C.inkLt,marginTop:4}}>{clientSales.length} pedido(s)</div>
          </Card>
          <Card>
            <SectionTitle>Cashback</SectionTitle>
            <div className="cor" style={{fontSize:26,color:C.gold}}>{fmt(selClient.cashback_balance||0)}</div>
            <div style={{fontSize:11,color:C.inkLt,marginTop:4}}>Saldo disponível</div>
          </Card>
        </div>
      </div>
      <Card>
        <SectionTitle>Histórico de Compras</SectionTitle>
        {clientSales.length===0?<div style={{color:C.inkFt,fontSize:13,textAlign:"center",padding:20}}>Nenhuma compra registrada.</div>
          :clientSales.map(s=>(
            <div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:`1px solid ${C.border}`}}>
              <div>
                <div style={{fontWeight:500,fontSize:13.5}}>{fmtDS(s.date)} — {s.items?.length||0} item(s)</div>
                <div style={{fontSize:12,color:C.inkLt}}>{s.payment_method||s.paymentMethod}</div>
              </div>
              <div className="cor" style={{fontSize:18,color:C.green}}>{fmt(s.total)}</div>
            </div>
          ))}
      </Card>
    </div>
  );

  // NEW FORM
  if(view==="new")return(
    <div className="fu">
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
        <button onClick={()=>setView("list")} style={{background:"none",border:"none",color:C.inkMd,cursor:"pointer",fontSize:22}}>←</button>
        <div className="cor" style={{fontSize:28,fontWeight:400}}>Novo Cliente</div>
      </div>
      <Card style={{maxWidth:560}}>
        {/* Doc type */}
        <div style={{display:"grid",gridTemplateColumns:"120px 1fr",gap:10,marginBottom:4}}>
          <Fld label="Tipo doc." value={form.docType} onChange={v=>setF("docType",v)}
            options={[{value:"cpf",label:"CPF"},{value:"cnpj",label:"CNPJ"}]}/>
          <Fld label={form.docType==="cnpj"?"CNPJ":"CPF"} value={form.cpfCnpj}
            onChange={v=>setF("cpfCnpj",form.docType==="cnpj"?fmtCNPJ(v):fmtCPF(v))}
            placeholder={form.docType==="cnpj"?"00.000.000/0001-00":"000.000.000-00"}/>
        </div>
        {form.docType==="cnpj"&&(
          <div style={{marginBottom:14}}>
            <Btn v="blue" sz="sm" disabled={cnpjLoading} onClick={()=>fetchCNPJ(form.cpfCnpj)}>
              {cnpjLoading?"Consultando...":"🔍 Buscar CNPJ na Receita Federal"}
            </Btn>
            {form.cnpjStatus&&<div style={{marginTop:8,padding:"7px 12px",background:form.cnpjStatus.includes("ATIVA")?C.greenLt:C.redLt,borderRadius:6,fontSize:12.5,color:form.cnpjStatus.includes("ATIVA")?C.green:C.red,fontWeight:500}}>Situação: {form.cnpjStatus}</div>}
          </div>
        )}
        <Fld label="Nome / Razão Social" value={form.name} onChange={v=>setF("name",v)} required/>
        {form.docType==="cnpj"&&<Fld label="Nome Fantasia" value={form.tradeName} onChange={v=>setF("tradeName",v)}/>}
        {form.docType==="cnpj"&&<Fld label="Inscrição Estadual (IE)" value={form.ie} onChange={v=>setF("ie",v)} placeholder="Somente números"/>}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Fld label="Telefone" value={form.phone} onChange={v=>setF("phone",v)} placeholder="(24) 99999-9999"/>
          <Fld label="E-mail" value={form.email} onChange={v=>setF("email",v)} type="email"/>
        </div>
        <HR/>
        <div style={{fontSize:11,color:C.inkMd,marginBottom:10,fontWeight:600,letterSpacing:.6,textTransform:"uppercase"}}>Endereço</div>
        <div style={{display:"flex",gap:8,marginBottom:4}}>
          <Fld label="CEP" value={form.cep} onChange={v=>{setF("cep",v);if(v.replace(/\D/g,"").length===8)fetchCEP(v);}} placeholder="00000-000" style={{marginBottom:0,flex:1}}/>
          {cepLoading&&<div style={{fontSize:11,color:C.inkLt,paddingTop:28}}>Buscando...</div>}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 80px",gap:10}}>
          <Fld label="Rua / Logradouro" value={form.address} onChange={v=>setF("address",v)}/>
          <Fld label="Número" value={form.number} onChange={v=>setF("number",v)} placeholder="123"/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 60px",gap:10}}>
          <Fld label="Cidade" value={form.city} onChange={v=>setF("city",v)}/>
          <Fld label="UF" value={form.state} onChange={v=>setF("state",v)} placeholder="MG"/>
        </div>
        {form.docType==="cnpj"
          ?<div style={{padding:"9px 13px",background:C.purpleLt,borderRadius:7,fontSize:13,color:C.purple,fontWeight:500,marginBottom:14}}>🏢 CNPJ — classificado automaticamente como <strong>Atacado</strong></div>
          :<Fld label="Tipo cliente" value={form.type} onChange={v=>setF("type",v)} options={[{value:"retail",label:"Varejo"},{value:"wholesale",label:"Atacado"}]}/>
        }
        <Btn onClick={save} full sz="lg">Salvar Cliente</Btn>
      </Card>
    </div>
  );

  // LIST
  return(
    <div className="fu">
      <PageHeader title="Clientes" sub={`${varejo.length} varejo · ${atacado.length} atacado`}
        actions={[<Btn key="new" onClick={()=>setView("new")}>+ Novo Cliente</Btn>]}/>
      <InlineTabs tabs={[{id:"varejo",label:`🛒 Varejo (${varejo.length})`},{id:"atacado",label:`🏢 Atacado (${atacado.length})`}]} active={clientTab} onChange={setClientTab}/>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar por nome, CPF/CNPJ ou telefone..."
        style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:7,color:C.ink,padding:"9px 14px",fontSize:13.5,outline:"none",width:320,marginBottom:16}}/>
      {listToShow.length===0&&<Card style={{textAlign:"center",color:C.inkFt,padding:36}}>Nenhum cliente nesta categoria.</Card>}
      <div style={{display:"grid",gap:8}}>
        {listToShow.map(c=>(
          <div key={c.id} onClick={()=>{setSelId(c.id);setView("detail");}}
            style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"13px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10,cursor:"pointer",transition:"border-color .15s"}}
            onMouseEnter={e=>e.currentTarget.style.borderColor=C.gold}
            onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:38,height:38,borderRadius:"50%",background:c.type==="wholesale"?C.purpleLt:C.goldLt,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,color:c.type==="wholesale"?C.purple:C.gold,fontSize:15,flexShrink:0}}>{(c.name.replace(/^[\d.\s]+/,""))[0]}</div>
              <div>
                <div style={{fontWeight:500,fontSize:13.5}}>{c.name.replace(/^[\d.\s]+/,"")}</div>
                <div style={{fontSize:12,color:C.inkLt}}>{c.doc_type?.toUpperCase()}: {c.cpf_cnpj}{c.phone&&` · 📱 ${c.phone}`}{c.city&&` · ${c.city}`}</div>
              </div>
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              {(c.cashback_balance||0)>0&&<Badge color={C.gold}>💰 {fmt(c.cashback_balance)}</Badge>}
              {c.cnpj_status&&<Badge color={c.cnpj_status.includes("ATIVA")?C.green:C.red}>{c.cnpj_status}</Badge>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}


// ── PRODUCTS ───────────────────────────────────────────────────────────────
function Products({products,setProducts,setStkG,setStkL,sales,showToast,logActivity}){
  const [view,setView]=useState("list");
  const [selId,setSelId]=useState(null);
  const [activeTab,setActiveTab]=useState("dados");
  const [search,setSearch]=useState("");
  const [saving,setSaving]=useState(false);
  const blank={name:"",sku:"",cat:"",color:"",sizes:[]};
  const [form,setForm]=useState(blank);
  // variants: [{sz, retailPrice, wholesalePrice}]
  const [variants,setVariants]=useState([]);
  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));

  const genSKU=(name,cat)=>{
    const prefix=(name||cat||"OUT").replace(/\s+/g,"").toUpperCase().slice(0,3);
    const existing=products.filter(p=>p.sku&&p.sku.startsWith(prefix+"-"));
    const nums=existing.map(p=>parseInt((p.sku||"").split("-")[1])||0);
    const next=(nums.length?Math.max(...nums):0)+1;
    return `${prefix}-${String(next).padStart(3,"0")}`;
  };

  const startNew=(cat)=>{
    const sku=genSKU("",cat);
    setForm({...blank,cat,sku});
    setVariants([]);
    setView("new");
  };

  // When sizes string changes, sync variant rows
  const syncVariants=(sizesStr)=>{
    const szArr=sizesStr.split(",").map(s=>s.trim()).filter(Boolean);
    setVariants(prev=>{
      return szArr.map(sz=>{
        const existing=prev.find(v=>v.sz===sz);
        return existing||{sz,retailPrice:"",wholesalePrice:"",qty:0};
      });
    });
    setF("sizes",sizesStr);
  };

  const setVariant=(sz,key,val)=>{
    setVariants(prev=>prev.map(v=>v.sz===sz?{...v,[key]:val}:v));
  };

  const applyPriceToAll=(key,val)=>{
    setVariants(prev=>prev.map(v=>({...v,[key]:val})));
  };

  const save=async()=>{
    if(!form.name.trim()){showToast("Nome obrigatório","error");return;}
    if(variants.length===0){showToast("Adicione ao menos um tamanho","error");return;}
    setSaving(true);
    try{
      const sizes=variants.map(v=>v.sz);
      const sku=form.sku||genSKU(form.name,form.cat);
      // Use first variant price as default product price
      const retail=Number(variants[0]?.retailPrice)||0;
      const wholesale=Number(variants[0]?.wholesalePrice)||0;
      const row={sku,name:form.name.trim(),cat:form.cat,color:form.color,sizes,
        retail_price:retail,wholesale_price:wholesale,cost_price:0,image_url:"",promo:false};
      const{data,error}=await sb.from("products").insert(row).select().single();
      if(error){showToast("Erro: "+error.message,"error");setSaving(false);return;}
      if(data){
        const np={...data,imageUrl:"",retailPrice:data.retail_price,wholesalePrice:data.wholesale_price,costPrice:0};
        setProducts(p=>[...p,np]);
        for(const v of variants){
          await sb.from("stock_galpao").insert({product_id:data.id,size:v.sz,qty:Number(v.qty)||0});
          await sb.from("stock_loja").insert({product_id:data.id,size:v.sz,qty:0});
          setStkG(p=>[...p,{pId:data.id,sz:v.sz,qty:Number(v.qty)||0}]);
          setStkL(p=>[...p,{pId:data.id,sz:v.sz,qty:0}]);
        }
        await logActivity("produto_cadastrado",`${sku} — ${form.name}`);
        showToast("Produto cadastrado!");
        setView("list");setForm(blank);setVariants([]);
      }
    }catch(e){showToast("Erro: "+e.message,"error");}
    setSaving(false);
  };

  const duplicate=(p)=>{
    const sku=genSKU(p.name,p.cat);
    setForm({name:p.name+" (cópia)",sku,cat:p.cat,color:p.color,sizes:[]});
    const vs=p.sizes?.map(sz=>({sz,retailPrice:p.retailPrice,wholesalePrice:p.wholesalePrice,qty:0}))||[];
    setVariants(vs);
    setView("new");
    showToast("Produto duplicado — ajuste e salve.","info");
  };

  const selProd=products.find(p=>p.id===selId);
  const prodSales=sales.filter(s=>s.items?.some(i=>i.pId===selId));
  const filtered=products.filter(p=>
    p.name.toLowerCase().includes(search.toLowerCase())||
    (p.sku||"").toLowerCase().includes(search.toLowerCase())
  );

  // ── PICK CATEGORY ──
  if(view==="pickCat")return(
    <div className="fu">
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:28}}>
        <button onClick={()=>setView("list")} style={{background:"none",border:"none",color:C.inkMd,cursor:"pointer",fontSize:22}}>←</button>
        <div>
          <div className="cor" style={{fontSize:28,fontWeight:400}}>Novo Produto</div>
          <div style={{fontSize:13,color:C.inkLt}}>Selecione a categoria para começar</div>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:12,maxWidth:600}}>
        {CATS.map(cat=>{const cc=CAT_COLOR[cat]||"#C8C0B4";return(
          <button key={cat} onClick={()=>startNew(cat)} style={{padding:"22px 12px",borderRadius:12,border:`1.5px solid ${C.border}`,background:C.surface,cursor:"pointer",textAlign:"center",transition:"all .15s"}}
            onMouseEnter={e=>{e.currentTarget.style.borderColor=cc;e.currentTarget.style.background=`${cc}12`;}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.background=C.surface;}}>
            <div style={{fontSize:34,marginBottom:8}}>{CAT_ICON[cat]||"📦"}</div>
            <div style={{fontWeight:600,fontSize:13,color:C.ink}}>{cat}</div>
          </button>
        );})}
      </div>
    </div>
  );

  // ── NEW/EDIT FORM — SHOPIFY STYLE ──
  if(view==="new"||view==="edit")return(
    <div className="fu">
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
        <button onClick={()=>view==="new"?setView("pickCat"):setView("list")} style={{background:"none",border:"none",color:C.inkMd,cursor:"pointer",fontSize:22}}>←</button>
        <div>
          <div className="cor" style={{fontSize:28,fontWeight:400}}>{view==="edit"?"Editar Produto":"Novo Produto"}</div>
          {form.cat&&<div style={{fontSize:12,color:C.inkLt,marginTop:2}}>{CAT_ICON[form.cat]} {form.cat}</div>}
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 320px",gap:16,alignItems:"start"}}>
        {/* LEFT */}
        <div>
          <Card style={{marginBottom:14}}>
            <SectionTitle>Informações do Produto</SectionTitle>
            <Fld label="Nome do produto" value={form.name} onChange={v=>{
              setF("name",v);
              if(v.length>=3)setF("sku",genSKU(v,form.cat));
            }} required placeholder="Ex: Calça Jeans Wideleg"/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <Fld label="SKU" value={form.sku} onChange={v=>setF("sku",v.toUpperCase())} note="Gerado automaticamente"/>
              <Fld label="Cor / Referência" value={form.color} onChange={v=>setF("color",v)} placeholder="Ex: Azul"/>
            </div>
          </Card>

          {/* VARIANTS TABLE */}
          <Card>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <SectionTitle style={{marginBottom:0}}>Variantes — Tamanhos</SectionTitle>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>{
                  const szs=SIZES_NUM.split(",");
                  setVariants(szs.map(sz=>({sz,retailPrice:variants[0]?.retailPrice||"",wholesalePrice:variants[0]?.wholesalePrice||"",qty:0})));
                }} style={{padding:"4px 10px",borderRadius:5,border:`1px solid ${C.border}`,background:C.hover,cursor:"pointer",fontSize:11.5,color:C.inkMd}}>34-52</button>
                <button onClick={()=>{
                  const szs=SIZES_LET.split(",");
                  setVariants(szs.map(sz=>({sz,retailPrice:variants[0]?.retailPrice||"",wholesalePrice:variants[0]?.wholesalePrice||"",qty:0})));
                }} style={{padding:"4px 10px",borderRadius:5,border:`1px solid ${C.border}`,background:C.hover,cursor:"pointer",fontSize:11.5,color:C.inkMd}}>PP-XGG</button>
                <button onClick={()=>{
                  const sz=prompt("Tamanho:");
                  if(sz&&!variants.find(v=>v.sz===sz.trim())){
                    setVariants(p=>[...p,{sz:sz.trim(),retailPrice:"",wholesalePrice:"",qty:0}]);
                  }
                }} style={{padding:"4px 10px",borderRadius:5,border:`1px solid ${C.border}`,background:C.hover,cursor:"pointer",fontSize:11.5,color:C.inkMd}}>+ Tamanho</button>
              </div>
            </div>

            {variants.length===0&&(
              <div style={{textAlign:"center",padding:"28px 0",color:C.inkFt,fontSize:13,border:`2px dashed ${C.border}`,borderRadius:8}}>
                Selecione os tamanhos acima para começar
              </div>
            )}

            {variants.length>0&&(
              <>
                {/* Apply all row */}
                <div style={{display:"grid",gridTemplateColumns:"80px 1fr 1fr 90px 32px",gap:8,marginBottom:8,padding:"6px 10px",background:C.hover,borderRadius:7,alignItems:"center"}}>
                  <div style={{fontSize:10.5,color:C.inkLt,fontWeight:700,letterSpacing:.5}}>TAMANHO</div>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={{fontSize:10.5,color:C.inkLt,fontWeight:700,letterSpacing:.5}}>VAREJO R$</span>
                    <button title="Aplicar a todos" onClick={()=>{const v=prompt("Preço varejo para todos:");if(v)applyPriceToAll("retailPrice",v);}} style={{fontSize:10,background:"none",border:"none",cursor:"pointer",color:C.gold}}>↓ todos</button>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={{fontSize:10.5,color:C.inkLt,fontWeight:700,letterSpacing:.5}}>ATACADO R$</span>
                    <button title="Aplicar a todos" onClick={()=>{const v=prompt("Preço atacado para todos:");if(v)applyPriceToAll("wholesalePrice",v);}} style={{fontSize:10,background:"none",border:"none",cursor:"pointer",color:C.purple}}>↓ todos</button>
                  </div>
                  <div style={{fontSize:10.5,color:C.inkLt,fontWeight:700,letterSpacing:.5}}>GALPÃO</div>
                  <div/>
                </div>

                {variants.map((v,i)=>(
                  <div key={v.sz} style={{display:"grid",gridTemplateColumns:"80px 1fr 1fr 90px 32px",gap:8,alignItems:"center",padding:"4px 10px",borderBottom:`1px solid ${C.border}`}}>
                    <div style={{fontWeight:600,fontSize:14,color:C.ink}}>{v.sz}</div>
                    <input type="number" value={v.retailPrice} onChange={e=>setVariant(v.sz,"retailPrice",e.target.value)}
                      placeholder="0,00" style={{width:"100%",background:C.surface,border:`1px solid ${C.border}`,borderRadius:5,color:C.ink,padding:"7px 9px",fontSize:13.5,outline:"none"}}/>
                    <input type="number" value={v.wholesalePrice} onChange={e=>setVariant(v.sz,"wholesalePrice",e.target.value)}
                      placeholder="0,00" style={{width:"100%",background:C.surface,border:`1px solid ${C.border}`,borderRadius:5,color:C.purple,padding:"7px 9px",fontSize:13.5,outline:"none"}}/>
                    <input type="number" value={v.qty} onChange={e=>setVariant(v.sz,"qty",e.target.value)}
                      placeholder="0" style={{width:"100%",background:C.surface,border:`1px solid ${C.border}`,borderRadius:5,color:C.ink,padding:"7px 9px",fontSize:13.5,outline:"none"}}/>
                    <button onClick={()=>setVariants(prev=>prev.filter((_,j)=>j!==i))} style={{background:C.redLt,border:"none",color:C.red,width:28,height:28,borderRadius:5,cursor:"pointer",fontSize:14}}>×</button>
                  </div>
                ))}

                <div style={{marginTop:10,padding:"8px 12px",background:C.hover,borderRadius:6,fontSize:12.5,color:C.inkMd,display:"flex",justifyContent:"space-between"}}>
                  <span>Total galpão:</span>
                  <strong>{variants.reduce((a,v)=>a+(Number(v.qty)||0),0)} peças</strong>
                </div>
              </>
            )}
          </Card>
        </div>

        {/* RIGHT */}
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Card>
            <SectionTitle>Resumo</SectionTitle>
            <div style={{fontSize:13,color:C.inkMd,lineHeight:2.2}}>
              <div><strong>Nome:</strong> {form.name||"—"}</div>
              <div><strong>SKU:</strong> {form.sku||"—"}</div>
              <div><strong>Categoria:</strong> {form.cat}</div>
              <div><strong>Cor:</strong> {form.color||"—"}</div>
              <div><strong>Tamanhos:</strong> {variants.length>0?variants.map(v=>v.sz).join(", "):"—"}</div>
            </div>
          </Card>
          <Btn onClick={save} full sz="lg" disabled={saving} v="success">
            {saving?"Salvando...":"✅ Cadastrar Produto"}
          </Btn>
        </div>
      </div>
    </div>
  );

  // ── DETAIL ──
  if(view==="detail"&&selProd)return(
    <div className="fu">
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
        <button onClick={()=>setView("list")} style={{background:"none",border:"none",color:C.inkMd,cursor:"pointer",fontSize:22}}>←</button>
        <div style={{flex:1}}>
          <div className="cor" style={{fontSize:28,fontWeight:400}}>{selProd.name}</div>
          <div style={{fontSize:12,color:C.inkLt}}>{selProd.sku} · {selProd.color} · {CAT_ICON[selProd.cat]} {selProd.cat}</div>
        </div>
        <Btn v="ghost" sz="sm" onClick={()=>duplicate(selProd)}>⧉ Duplicar</Btn>
      </div>
      <InlineTabs tabs={[{id:"dados",label:"Dados"},{id:"historico_vendas",label:"Histórico de Vendas"},{id:"historico_compras",label:"Compras"}]} active={activeTab} onChange={setActiveTab}/>
      {activeTab==="dados"&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
          <Card>
            <SectionTitle>Informações</SectionTitle>
            <div style={{fontSize:13.5,lineHeight:2.4,color:C.inkMd}}>
              <div><strong style={{color:C.ink}}>Categoria:</strong> {selProd.cat}</div>
              <div><strong style={{color:C.ink}}>Cor:</strong> {selProd.color}</div>
              <div><strong style={{color:C.ink}}>Varejo:</strong> <span style={{color:C.green,fontWeight:600}}>{fmt(selProd.retailPrice)}</span></div>
              <div><strong style={{color:C.ink}}>Atacado:</strong> <span style={{color:C.purple,fontWeight:600}}>{fmt(selProd.wholesalePrice)}</span></div>
            </div>
          </Card>
          <Card>
            <SectionTitle>Tamanhos cadastrados</SectionTitle>
            <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:4}}>
              {selProd.sizes?.map(s=><span key={s} style={{background:C.hover,border:`1px solid ${C.border}`,borderRadius:6,padding:"4px 12px",fontWeight:600,fontSize:14}}>{s}</span>)}
            </div>
          </Card>
        </div>
      )}
      {activeTab==="historico_vendas"&&(
        <Card>
          <SectionTitle>Vendas com este produto</SectionTitle>
          {prodSales.length===0?<div style={{color:C.inkFt,fontSize:13,textAlign:"center",padding:20}}>Nenhuma venda.</div>
            :prodSales.map(s=>{const item=s.items?.find(i=>i.pId===selId);return(

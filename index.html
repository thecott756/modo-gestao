                </div>
              </div>

              <Fld label="Observação (opcional)" value={obs} onChange={setObs} placeholder="Ex: NF 1234, fornecedor..."/>
              <Btn onClick={handleSubmit} v={type==="entrada"?"success":"danger"} full sz="lg" disabled={saving}>
                {saving?"Salvando...":(type==="entrada"?"✅ Confirmar Entrada":"📤 Confirmar Saída")}
              </Btn>
            </Card>
          )}
        </div>
      </div>
    </div>
  );
}

// ── TRANSFER ───────────────────────────────────────────────────────────────
function Transfer({stkG,setStkG,stkL,setStkL,products,addMov,showToast,logActivity,channel}){
  const [dir,setDir]=useState("g2l");
  const [selProd,setSelProd]=useState(null);
  const [qtys,setQtys]=useState({});
  const [obs,setObs]=useState("");
  const [saving,setSaving]=useState(false);
  const [printed,setPrinted]=useState(false);
  const [payStep,setPayStep]=useState(0);   // payment wizard step
  const [payments,setPayments]=useState([]); // [{method, amount}]
  const [payAmt,setPayAmt]=useState("");     // current payment amount input
  const [search,setSearch]=useState("");
  const [lastReport,setLastReport]=useState(null);

  const src=dir==="g2l"?stkG:stkL;
  const srcTable=dir==="g2l"?"stock_galpao":"stock_loja";
  const dstTable=dir==="g2l"?"stock_loja":"stock_galpao";
  const setSrc=dir==="g2l"?setStkG:setStkL;
  const setDst=dir==="g2l"?setStkL:setStkG;
  const dstStock=dir==="g2l"?stkL:stkG;

  const getQtySrc=(pId,sz)=>src.find(s=>s.pId===pId&&s.sz===sz)?.qty||0;
  const getQtyDst=(pId,sz)=>dstStock.find(s=>s.pId===pId&&s.sz===sz)?.qty||0;

  const handleTransfer=async()=>{
    if(!selProd){showToast("Selecione um produto","error");return;}
    const entries=Object.entries(qtys).filter(([sz,q])=>Number(q)>0);
    if(entries.length===0){showToast("Informe ao menos uma quantidade","error");return;}
    // Validate
    for(const [sz,q] of entries){
      if(Number(q)>getQtySrc(selProd.id,sz)){showToast("Estoque insuficiente: tam "+sz,"error");return;}
    }
    setSaving(true);
    try{
      const pId=selProd.id;
      for(const [sz,q] of entries){
        const qty=Number(q);
        // Subtract from source
        const srcItem=src.find(s=>s.pId===pId&&s.sz===sz);
        const newSrc=Math.max(0,(srcItem?.qty||0)-qty);
        if(srcItem?._id)await sb.from(srcTable).update({qty:newSrc}).eq("id",srcItem._id);
        setSrc(prev=>{const u=[...prev];const i=u.findIndex(s=>s.pId===pId&&s.sz===sz);if(i>=0)u[i]={...u[i],qty:newSrc};return u;});
        // Add to destination
        const dstItem=dstStock.find(s=>s.pId===pId&&s.sz===sz);
        const newDst=(dstItem?.qty||0)+qty;
        if(dstItem?._id){await sb.from(dstTable).update({qty:newDst}).eq("id",dstItem._id);}
        else{const{data}=await sb.from(dstTable).insert({product_id:pId,size:sz,qty:newDst}).select().single();
          if(data)setDst(prev=>[...prev,{pId,sz,qty:newDst,_id:data.id}]);}
        setDst(prev=>{const u=[...prev];const i=u.findIndex(s=>s.pId===pId&&s.sz===sz);if(i>=0){u[i]={...u[i],qty:newDst};return u;}return prev;});
      }
      const total=entries.reduce((a,[,q])=>a+Number(q),0);
      const dirLabel=dir==="g2l"?"Galpão → Loja":"Loja → Galpão";
      await addMov({type:"transferência",loc:"ambos",desc:`${selProd.name} · ${total} un. · ${dirLabel}`,obs});
      await logActivity("transferencia",`${selProd.name} · ${total} un. · ${dirLabel}`);
      // Build report data
      const report={
        date:new Date().toISOString(),
        dir:dirLabel,
        product:selProd,
        entries,
        total,
        obs,
      };
      setLastReport(report);
      showToast(`Transferência concluída! ${total} peças.`);
      setSelProd(null);setQtys({});setObs("");
    }catch(e){showToast("Erro: "+e.message,"error");console.error(e);}
    setSaving(false);
  };

  const printReport=(r)=>{
    const w=window.open("","_blank","width=700,height=600");
    const items=r.entries.map(([sz,q])=>`<tr><td style="padding:8px 16px;border-bottom:1px solid #eee;font-size:15px;font-weight:600">${sz}</td><td style="padding:8px 16px;border-bottom:1px solid #eee;text-align:center">${q}</td></tr>`).join("");
    w.document.write(`<!DOCTYPE html><html><head><title>Transferência</title>
    <style>body{font-family:Georgia,serif;padding:40px;color:#1a1714;max-width:600px;margin:0 auto}
    h1{font-size:28px;font-weight:400;margin-bottom:4px}
    .sub{color:#888;font-size:13px;margin-bottom:30px}
    table{width:100%;border-collapse:collapse;margin:20px 0}
    th{background:#f7f5f2;padding:10px 16px;text-align:left;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#888}
    .total{background:#f0ede8;padding:12px 16px;border-radius:8px;display:flex;justify-content:space-between;font-weight:600;margin-top:10px}
    @media print{button{display:none}}</style></head>
    <body>
    <h1>✦ Relatório de Transferência</h1>
    <div class="sub">${new Date(r.date).toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"})}</div>
    <p><strong>Produto:</strong> ${r.product.name} (${r.product.sku})</p>
    <p><strong>Direção:</strong> ${r.dir}</p>
    ${r.obs?`<p><strong>Observação:</strong> ${r.obs}</p>`:""}
    <table><thead><tr><th>Tamanho</th><th style="text-align:center">Qtd Transferida</th></tr></thead>
    <tbody>${items}</tbody></table>
    <div class="total"><span>Total transferido</span><span>${r.total} peças</span></div>
    <br><br><button onclick="window.print()" style="padding:10px 24px;background:#C8973A;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px">🖨️ Imprimir / Salvar PDF</button>
    </body></html>`);
    w.document.close();
  };

  const filteredProds=[...products].sort((a,b)=>a.name.localeCompare(b.name,"pt-BR"))
    .filter(p=>p.name.toLowerCase().includes(search.toLowerCase())||p.sku?.toLowerCase().includes(search.toLowerCase()));

  return(
    <div className="fu">
      <PageHeader title="Transferência" sub="Mova mercadorias entre Galpão e Loja"/>

      {/* Direction toggle */}
      <div style={{display:"flex",gap:10,marginBottom:20,maxWidth:400}}>
        {[["g2l","🏭 Galpão → Loja"],["l2g","👗 Loja → Galpão"]].map(([val,lbl])=>(
          <button key={val} onClick={()=>{setDir(val);setSelProd(null);setQtys({});}} style={{flex:1,padding:"13px",borderRadius:9,border:`1.5px solid ${dir===val?C.gold:C.border}`,background:dir===val?C.goldLt:"transparent",color:dir===val?C.gold:C.inkMd,cursor:"pointer",fontWeight:dir===val?600:400,fontSize:14}}>{lbl}</button>
        ))}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 380px",gap:16,alignItems:"start"}}>
        {/* LEFT — product list */}
        <div>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar produto..."
            style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:7,color:C.ink,padding:"9px 14px",fontSize:13.5,outline:"none",width:"100%",marginBottom:14,boxSizing:"border-box"}}/>
          <div style={{display:"grid",gap:8}}>
            {filteredProds.map(p=>{
              const psSrc=src.filter(s=>s.pId===p.id);
              const total=psSrc.reduce((a,b)=>a+b.qty,0);
              const sel=selProd?.id===p.id;
              return(
                <div key={p.id} onClick={()=>{setSelProd(p);setQtys({});}}
                  style={{background:sel?C.goldLt:C.surface,border:`1.5px solid ${sel?C.gold:C.border}`,borderRadius:10,padding:"12px 16px",cursor:"pointer",transition:"all .12s"}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <Thumb p={p} size={36}/>
                      <div>
                        <div style={{fontWeight:600,fontSize:14}}>{p.name}</div>
                        <div style={{fontSize:11.5,color:C.inkLt}}>{p.sku}</div>
                      </div>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div className="cor" style={{fontSize:18,color:total<=5?C.red:C.gold,fontWeight:700}}>{total}</div>
                      <div style={{fontSize:10,color:C.inkFt}}>{dir==="g2l"?"galpão":"loja"}</div>
                    </div>
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:8}}>
                    {psSrc.sort((a,b)=>a.sz.localeCompare(b.sz,undefined,{numeric:true})).map(s=>(
                      <div key={s.sz} style={{textAlign:"center",background:s.qty<=3?"#FFF0F0":C.hover,border:`1px solid ${s.qty<=3?C.red:C.border}`,borderRadius:6,padding:"3px 9px",minWidth:42}}>
                        <div style={{fontSize:9,color:C.inkFt}}>{s.sz}</div>
                        <div style={{fontWeight:700,color:s.qty<=3?C.red:C.ink,fontSize:14}}>{s.qty}</div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* RIGHT — transfer panel */}
        <div style={{position:"sticky",top:20,display:"flex",flexDirection:"column",gap:12}}>
          {!selProd?(
            <Card style={{textAlign:"center",padding:40,color:C.inkFt}}>
              <div style={{fontSize:32,marginBottom:10}}>👆</div>
              <div style={{fontSize:14}}>Selecione um produto ao lado para transferir</div>
            </Card>
          ):(
            <Card>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,padding:"10px 14px",background:C.hover,borderRadius:8}}>
                <Thumb p={selProd} size={36}/>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:14}}>{selProd.name}</div>
                  <div style={{fontSize:11.5,color:C.inkLt}}>{selProd.sku}</div>
                </div>
                <button onClick={()=>{setSelProd(null);setQtys({});}} style={{background:"none",border:"none",cursor:"pointer",color:C.inkLt,fontSize:18}}>×</button>
              </div>

              {/* Shopify-style table */}
              <div style={{marginBottom:12}}>
                <div style={{display:"grid",gridTemplateColumns:"60px 1fr 1fr 80px",gap:6,padding:"6px 8px",background:C.hover,borderRadius:6,marginBottom:4}}>
                  <div style={{fontSize:10,fontWeight:700,color:C.inkLt,letterSpacing:.5}}>TAM</div>
                  <div style={{fontSize:10,fontWeight:700,color:C.inkLt,letterSpacing:.5}}>{dir==="g2l"?"GALPÃO":"LOJA"}</div>
                  <div style={{fontSize:10,fontWeight:700,color:C.inkLt,letterSpacing:.5}}>{dir==="g2l"?"LOJA":"GALPÃO"}</div>
                  <div style={{fontSize:10,fontWeight:700,color:C.gold,letterSpacing:.5}}>MOVER</div>
                </div>
                {sortSizes(selProd.sizes||[]).map(sz=>{
                  const qSrc=getQtySrc(selProd.id,sz);
                  const qDst=getQtyDst(selProd.id,sz);
                  const q=Number(qtys[sz]||0);
                  return(
                    <div key={sz} style={{display:"grid",gridTemplateColumns:"60px 1fr 1fr 80px",gap:6,alignItems:"center",padding:"5px 8px",borderBottom:`1px solid ${C.border}`}}>
                      <div style={{fontWeight:700,fontSize:15}}>{sz}</div>
                      <div style={{fontSize:13,color:qSrc<=3?C.red:C.inkMd,fontWeight:500}}>{qSrc}{q>0&&<span style={{fontSize:10,color:C.red,marginLeft:4}}>→{qSrc-q}</span>}</div>
                      <div style={{fontSize:13,color:C.inkMd}}>{qDst}{q>0&&<span style={{fontSize:10,color:C.green,marginLeft:4}}>→{qDst+q}</span>}</div>
                      <input type="number" min="0" max={qSrc} value={qtys[sz]||""} placeholder="0"
                        onChange={e=>setQtys(prev=>({...prev,[sz]:e.target.value}))}
                        onFocus={e=>e.target.select()}
                        style={{width:"100%",background:C.surface,border:`1px solid ${q>0?C.gold:C.border}`,borderRadius:5,color:q>0?C.gold:C.ink,padding:"6px 8px",fontSize:14,fontWeight:q>0?700:400,outline:"none",textAlign:"center"}}/>
                    </div>
                  );
                })}
                <div style={{marginTop:8,padding:"7px 10px",background:C.goldLt,borderRadius:6,display:"flex",justifyContent:"space-between",fontSize:12.5,color:C.gold,fontWeight:600}}>
                  <span>Total a transferir:</span>
                  <span>{Object.values(qtys).reduce((a,q)=>a+Number(q||0),0)} peças</span>
                </div>
              </div>

              {selProd&&sortSizes(selProd.sizes||[]).some(sz=>(dir==="g2l"?stkG:stkL).find(s=>s.pId===selProd.id&&s.sz===sz&&s.qty>0))&&(
                <div style={{marginBottom:12}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,background:C.purpleLt,borderRadius:8,padding:"8px 12px",border:`1px solid ${C.purple}40`}}>
                    <span style={{fontSize:12,fontWeight:600,color:C.purple}}>📦 Transferir grade completa:</span>
                    <Btn v="ghost" sz="sm" onClick={()=>{
                      const srcStk=dir==="g2l"?stkG:stkL;
                      sortSizes(selProd.sizes||[]).forEach(sz=>{
                        const s=srcStk.find(x=>x.pId===selProd.id&&x.sz===sz);
                        if(s?.qty>0)setQtys(prev=>({...prev,[sz]:s.qty}));
                      });
                      showToast("Grade preenchida — revise e confirme");
                    }}>Preencher tudo</Btn>
                  </div>
                </div>
              )}
              <Fld label="Observação (opcional)" value={obs} onChange={setObs} placeholder="Ex: reposição semana 10..."/>
              <Btn onClick={handleTransfer} v="gold" full sz="lg" disabled={saving}>
                {saving?"Transferindo...":"⇌ Confirmar Transferência"}
              </Btn>
            </Card>
          )}

          {/* Last report */}
          {lastReport&&(
            <Card>
              <SectionTitle>Última Transferência</SectionTitle>
              <div style={{fontSize:12.5,color:C.inkMd,marginBottom:10}}>
                <div><strong>{lastReport.product.name}</strong> · {lastReport.dir}</div>
                <div>{fmtDS(lastReport.date)} · {lastReport.total} peças</div>
              </div>
              <Btn onClick={()=>printReport(lastReport)} v="secondary" full>🖨️ Imprimir / Baixar PDF</Btn>
            </Card>
          )}
        </div>
      </div>
    </div>
  );
}

// ── SALES ──────────────────────────────────────────────────────────────────
function Sales({sales,setSales,showToast,logActivity,issuedNFe,stkG,setStkG,stkL,setStkL,products,addMov}){
  const [view,setView]=useState("list"); // list | detail | edit
  const [selSale,setSelSale]=useState(null);
  const [search,setSearch]=useState("");
  const [cancelling,setCancelling]=useState(false);
  const [saving,setSaving]=useState(false);
  const [scanCode,setScanCode]=useState("");
  const [editDiscount,setEditDiscount]=useState(0);
  const [editPayMethod,setEditPayMethod]=useState("dinheiro");
  const [editObs,setEditObs]=useState("");
  const scanRef=useRef();

  useEffect(()=>{ if(view==="list")scanRef.current?.focus(); },[view]);

  const total=sales.filter(s=>s.status!=="cancelada").reduce((a,b)=>a+(b.total||0),0);
  const byM=sales.filter(s=>s.status!=="cancelada").reduce((a,s)=>{a[s.paymentMethod]=(a[s.paymentMethod]||0)+s.total;return a;},{});
  const mc={dinheiro:C.gold,pix:C.green,cartao:C.blue,boleto:C.inkMd};

  const filtered=[...sales]
    .filter(s=>{
      if(!search)return true;
      const q=search.toLowerCase();
      return (s.clientName||"").toLowerCase().includes(q)||
             (s.id||"").toLowerCase().includes(q)||
             (s.seller||"").toLowerCase().includes(q)||
             (s.items||[]).some(i=>i.name?.toLowerCase().includes(q));
    })
    .sort((a,b)=>new Date(b.date)-new Date(a.date));

  const handleScan=(e)=>{
    if(e.key==="Enter"){
      const code=scanCode.trim();
      setScanCode("");
      if(!code)return;
      const found=sales.find(s=>s.id===code||(s.id||"").startsWith(code)||
        (s.id||"").replace(/-/g,"").substring(0,12).toUpperCase()===code.toUpperCase());
      if(found){setSelSale(found);setView("detail");}
      else showToast("Venda não encontrada: "+code,"error");
    }
  };

  // ── CANCEL: restore stock ──
  const cancelSale=async(sale)=>{
    if(!window.confirm(`Cancelar venda de ${fmt(sale.total)} para ${sale.clientName||"Avulso"}?\n\nOs itens serão devolvidos ao estoque.`))return;
    setCancelling(true);
    try{
      // 1. Mark as cancelled in DB
      await sb.from("sales").update({status:"cancelada"}).eq("id",sale.id);
      setSales(prev=>prev.map(s=>s.id===sale.id?{...s,status:"cancelada"}:s));

      // 2. Restore stock — galpao or loja based on sale_mode
      const isGalpao=sale.sale_mode==="galpao";
      const table=isGalpao?"stock_galpao":"stock_loja";
      const stk=isGalpao?stkG:stkL;
      const setStk=isGalpao?setStkG:setStkL;

      for(const item of (sale.items||[])){
        const prod=products.find(p=>p.name===item.name||p.id===item.pId);
        if(!prod)continue;
        const existing=stk.find(s=>s.pId===prod.id&&s.sz===item.sz);
        const newQty=(existing?.qty||0)+item.qty;
        if(existing?._id){
          await sb.from(table).update({qty:newQty}).eq("id",existing._id);
        }else{
          await sb.from(table).insert({product_id:prod.id,size:item.sz,qty:newQty});
        }
        setStk(prev=>{
          const idx=prev.findIndex(s=>s.pId===prod.id&&s.sz===item.sz);
          if(idx>=0){const u=[...prev];u[idx]={...u[idx],qty:newQty};return u;}
          return [...prev,{pId:prod.id,sz:item.sz,qty:newQty,_id:existing?._id||null}];
        });
      }

      await addMov({type:"cancelamento",loc:isGalpao?"galpao":"loja",desc:`Cancelamento venda — ${sale.clientName||"Avulso"} — ${fmt(sale.total)}`});
      await logActivity("cancelamento",`Venda cancelada — ${sale.clientName||"Avulso"} — ${fmt(sale.total)} — estoque restaurado`);
      showToast("Venda cancelada e estoque restaurado ✅");
      setView("list");setSelSale(null);
    }catch(err){showToast("Erro: "+err.message,"error");console.error(err);}
    setCancelling(false);
  };

  // ── SAVE EDIT ──
  const saveEdit=async(sale)=>{
    setSaving(true);
    try{
      const subtotal=(sale.items||[]).reduce((a,i)=>a+i.price*i.qty,0);
      const discAmt=subtotal*(editDiscount/100);
      const newTotal=Math.max(0,subtotal-discAmt+(sale.freightPrice||0));
      const updates={
        discount_pct:editDiscount,
        discount_amt:discAmt,
        total:newTotal,
        payment_method:editPayMethod,
        obs:editObs,
      };
      await sb.from("sales").update(updates).eq("id",sale.id);
      const updated={...sale,...updates,discountPct:editDiscount,discountAmt:discAmt,total:newTotal,paymentMethod:editPayMethod};
      setSales(prev=>prev.map(s=>s.id===sale.id?updated:s));
      setSelSale(updated);
      await logActivity("edicao_venda",`Venda editada — ${sale.clientName||"Avulso"} — ${fmt(newTotal)}`);
      showToast("Venda atualizada ✅");
      setView("detail");
    }catch(err){showToast("Erro: "+err.message,"error");}
    setSaving(false);
  };

  const printSaleReceipt=(s)=>{
    const w=window.open("","_blank","width=800,height=700");
    const items=(s.items||[]).map(item=>`
      <tr>
        <td style="padding:9px 12px;text-align:center;font-weight:700;font-size:16px;border-bottom:1px solid #e8e4df">${item.qty}</td>
        <td style="padding:9px 12px;font-size:14px;border-bottom:1px solid #e8e4df">${item.name}</td>
        <td style="padding:9px 12px;text-align:center;font-weight:600;font-size:14px;border-bottom:1px solid #e8e4df">${item.sz}</td>
        <td style="padding:9px 12px;text-align:right;font-weight:500;font-size:14px;border-bottom:1px solid #e8e4df">R$ ${(item.price*item.qty).toFixed(2).replace(".",",")}</td>
      </tr>`).join("");
    const discRow=s.discountAmt>0?`<tr><td colspan="3" style="padding:6px 12px;text-align:right;font-size:12px;color:#B85450">${s.promo_code?"Cupom "+s.promo_code:"Desconto "+s.discountPct+"%"}</td><td style="padding:6px 12px;text-align:right;font-size:12px;color:#B85450">- R$ ${(s.discountAmt||0).toFixed(2).replace(".",",")}</td></tr>`:"";
    const fretRow=(s.freightPrice||0)>0?`<tr><td colspan="3" style="padding:6px 12px;text-align:right;font-size:12px;color:#3D6B8C">Frete</td><td style="padding:6px 12px;text-align:right;font-size:12px;color:#3D6B8C">R$ ${(s.freightPrice||0).toFixed(2).replace(".",",")}</td></tr>`:"";
    const clientName=(s.clientName||"Avulso").replace(/^[\d.\s]+/,"");
    // Barcode = sale ID (first 12 chars for Code128)
    const barcodeId=(s.id||"").replace(/-/g,"").substring(0,12).toUpperCase();
    w.document.write(`<!DOCTYPE html><html><head><title>Comprovante — The Cott</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"><\/script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <style>
      *{box-sizing:border-box;margin:0;padding:0}body{font-family:'Jost',sans-serif;color:#1a1714;background:#fff;padding:0}
      .page{width:148mm;min-height:210mm;margin:0 auto;padding:14mm 12mm}
      .brand{font-family:'Cormorant Garamond',serif;text-align:center;font-size:26px;letter-spacing:4px;margin-bottom:4px}
      .sub{text-align:center;font-size:10px;letter-spacing:2px;color:#888;margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid #1a1714}
      .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 20px;font-size:12px;margin-bottom:14px}
      .info-label{color:#888}
      table{width:100%;border-collapse:collapse;margin-bottom:8px}
      thead tr{background:#f7f5f2}
      th{padding:7px 10px;font-size:10px;letter-spacing:1px;color:#888;font-weight:700;text-transform:uppercase;border-bottom:2px solid #1a1714}
      th:first-child,td:first-child{text-align:center;width:46px}
      th:nth-child(3),td:nth-child(3){text-align:center;width:56px}
      th:last-child,td:last-child{text-align:right;width:100px}
      .total-row{display:flex;justify-content:space-between;font-weight:700;font-size:17px;padding:9px 0;border-top:2px solid #1a1714;margin-top:4px}
      .barcode-wrap{text-align:center;margin-top:14px;padding-top:12px;border-top:1px dashed #ccc}
      .barcode-wrap svg{max-width:160px}
      .barcode-label{font-size:9px;color:#aaa;margin-top:2px;letter-spacing:1px}
      .footer{margin-top:10px;text-align:center;font-size:10px;color:#aaa}
      @media print{@page{size:A5;margin:0}.page{padding:10mm 8mm}}
    </style></head><body>
    <div class="page">
      <div class="brand">✦ THE COTT ✦</div>
      <div class="sub">COMPROVANTE DE VENDA</div>
      <div class="info-grid">
        <div><span class="info-label">Data: </span><strong>${new Date(s.date).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}</strong></div>
        <div><span class="info-label">Vendedor: </span><strong>${s.seller||""}</strong></div>
        <div style="grid-column:1/-1"><span class="info-label">Cliente: </span><strong>${clientName}</strong>${s.isWholesale?' <span style="background:#f0edf8;color:#6B5B9E;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:700">ATACADO</span>':''}</div>
      </div>
      <table>
        <thead><tr><th>Qtd</th><th style="text-align:left">Produto</th><th>Tam</th><th>Valor</th></tr></thead>
        <tbody>${items}</tbody>
        <tfoot>${discRow}${fretRow}
          <tr><td colspan="3" style="padding:8px 12px;text-align:right;font-size:13px;font-weight:700;border-top:2px solid #1a1714">TOTAL</td>
          <td style="padding:8px 12px;text-align:right;font-size:16px;font-weight:700;border-top:2px solid #1a1714;color:#4A7C5E">R$ ${(s.total||0).toFixed(2).replace(".",",")}</td></tr>
        </tfoot>
      </table>
      <div class="barcode-wrap">
        <svg id="bc"></svg>
        <div class="barcode-label">TROCA/DEVOLUÇÃO: ${barcodeId}</div>
      </div>
      <div class="footer">
        📅 Troca até: <strong>${new Date(s.tradeDeadline||s.date).toLocaleDateString("pt-BR")}</strong> (7 dias) · THE COTT LTDA — obrigado!
      </div>
    </div>
    <script>
      JsBarcode("#bc","${barcodeId}",{format:"CODE128",width:1.5,height:36,displayValue:false,margin:0,background:"transparent"});
      setTimeout(()=>window.print(),600);
    <\/script>
    </body></html>`);
    w.document.close();
  };

  // ── EDIT VIEW ──
  if(view==="edit"&&selSale){
    const s=selSale;
    const subtotal=(s.items||[]).reduce((a,i)=>a+i.price*i.qty,0);
    const discAmt=subtotal*(editDiscount/100);
    const previewTotal=Math.max(0,subtotal-discAmt+(s.freightPrice||0));
    return(
      <div className="fu" style={{maxWidth:560}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
          <button onClick={()=>setView("detail")} style={{background:"none",border:"none",color:C.inkMd,cursor:"pointer",fontSize:22}}>←</button>
          <div className="cor" style={{fontSize:26}}>Editar Venda</div>
        </div>

        <Card style={{marginBottom:12}}>
          <SectionTitle>Cliente e itens</SectionTitle>
          <div style={{fontSize:13,color:C.inkMd,marginBottom:8}}>{(s.clientName||"Avulso").replace(/^[\d.\s]+/,"")}</div>
          {(s.items||[]).map((item,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:`1px solid ${C.border}`,fontSize:13}}>
              <span>{item.name} — {item.sz} ×{item.qty}</span>
              <span style={{color:C.inkMd}}>{fmt(item.price*item.qty)}</span>
            </div>
          ))}
          <div style={{display:"flex",justifyContent:"space-between",fontWeight:600,padding:"8px 0",fontSize:14}}>
            <span>Subtotal</span><span>{fmt(subtotal)}</span>
          </div>
        </Card>

        <Card style={{marginBottom:12}}>
          <SectionTitle>Desconto (%)</SectionTitle>
          <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}>
            <input type="number" min="0" max="100" value={editDiscount}
              onChange={e=>setEditDiscount(Number(e.target.value))}
              style={{width:100,background:C.hover,border:`1px solid ${C.border}`,borderRadius:6,color:C.ink,padding:"8px 12px",fontSize:15,outline:"none",textAlign:"center",fontWeight:600}}/>
            <span style={{fontSize:13,color:C.inkMd}}>%</span>
            {editDiscount>0&&<span style={{fontSize:13,color:C.red}}>− {fmt(discAmt)}</span>}
          </div>
          <div style={{fontSize:11.5,color:C.inkLt}}>Desconto aplicado sobre o subtotal dos itens</div>
        </Card>

        <Card style={{marginBottom:12}}>
          <SectionTitle>Forma de pagamento</SectionTitle>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {[{id:"dinheiro",l:"💵 Dinheiro"},{id:"pix",l:"⚡ PIX"},{id:"cartao",l:"💳 Cartão"},{id:"boleto",l:"📄 Boleto"}].map(o=>(
              <button key={o.id} onClick={()=>setEditPayMethod(o.id)} style={{padding:"10px",borderRadius:7,border:`1.5px solid ${editPayMethod===o.id?C.gold:C.border}`,background:editPayMethod===o.id?C.goldLt:"transparent",color:editPayMethod===o.id?C.gold:C.inkMd,cursor:"pointer",fontSize:13,fontWeight:editPayMethod===o.id?600:400}}>{o.l}</button>
            ))}
          </div>
        </Card>

        <Card style={{marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:14,fontWeight:600}}>Novo total</span>
            <div className="cor" style={{fontSize:28,color:C.green}}>{fmt(previewTotal)}</div>
          </div>
        </Card>

        <div style={{display:"flex",gap:10}}>
          <Btn v="ghost" onClick={()=>setView("detail")} full>Cancelar</Btn>
          <Btn v="success" onClick={()=>saveEdit(selSale)} disabled={saving} full>{saving?"Salvando...":"✅ Salvar Alterações"}</Btn>
        </div>
      </div>
    );
  }

  // ── DETAIL VIEW ──
  if(view==="detail"&&selSale){
    const s=selSale;
    const cancelled=s.status==="cancelada";
    return(
      <div className="fu" style={{maxWidth:680}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
          <button onClick={()=>{setView("list");setSelSale(null);}} style={{background:"none",border:"none",color:C.inkMd,cursor:"pointer",fontSize:22}}>←</button>
          <div style={{flex:1}}>
            <div className="cor" style={{fontSize:26}}>Venda #{(s.id||"").substring(0,8).toUpperCase()}</div>
            <div style={{fontSize:13,color:C.inkLt}}>{fmtD(s.date)} · {s.seller}</div>
          </div>
          {cancelled
            ?<span style={{background:"#FFF0F0",color:C.red,padding:"4px 12px",borderRadius:8,fontSize:12,fontWeight:700}}>CANCELADA</span>
            :<Btn v="ghost" sz="sm" onClick={()=>{setEditDiscount(s.discountPct||0);setEditPayMethod(s.paymentMethod||"dinheiro");setEditObs(s.obs||"");setView("edit");}}>✏️ Editar</Btn>
          }
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
          <Card>
            <div style={{fontSize:11,color:C.inkLt,marginBottom:4,textTransform:"uppercase",letterSpacing:.5}}>Cliente</div>
            <div style={{fontWeight:600,fontSize:14}}>{(s.clientName||"Avulso").replace(/^[\d.\s]+/,"")}</div>
            {s.clientPhone&&<div style={{fontSize:12,color:C.inkLt}}>{s.clientPhone}</div>}
            {s.isWholesale&&<Badge color={C.purple}>Atacado</Badge>}
          </Card>
          <Card>
            <div style={{fontSize:11,color:C.inkLt,marginBottom:4,textTransform:"uppercase",letterSpacing:.5}}>Pagamento</div>
            <div style={{fontWeight:600,fontSize:14,textTransform:"capitalize"}}>{s.paymentMethod}</div>
            <div className="cor" style={{fontSize:22,color:cancelled?C.inkLt:C.green}}>{fmt(s.total)}</div>
          </Card>
        </div>

        <Card style={{marginBottom:12}}>
          <SectionTitle>Itens da venda</SectionTitle>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{borderBottom:`2px solid ${C.border}`}}>
              {["Produto","Tam","Qtd","Valor"].map(h=><th key={h} style={{padding:"7px 8px",textAlign:h==="Qtd"||h==="Tam"?"center":"left",fontSize:11,fontWeight:700,color:C.inkLt,textTransform:"uppercase",letterSpacing:.5}}>{h}</th>)}
            </tr></thead>
            <tbody>
              {(s.items||[]).map((item,i)=>(
                <tr key={i} style={{borderBottom:`1px solid ${C.border}`}}>
                  <td style={{padding:"8px"}}>{item.name}</td>
                  <td style={{padding:"8px",textAlign:"center",fontWeight:600}}>{item.sz}</td>
                  <td style={{padding:"8px",textAlign:"center"}}>{item.qty}</td>
                  <td style={{padding:"8px",textAlign:"right",fontWeight:600,color:C.green}}>{fmt(item.price*item.qty)}</td>
                </tr>
              ))}
            </tbody>
            <tfoot>
              {(s.discountAmt||0)>0&&<tr><td colSpan={3} style={{padding:"6px 8px",textAlign:"right",fontSize:12,color:C.red}}>Desconto {s.discountPct}%</td><td style={{padding:"6px 8px",textAlign:"right",fontSize:12,color:C.red}}>− {fmt(s.discountAmt)}</td></tr>}
              {(s.freightPrice||0)>0&&<tr><td colSpan={3} style={{padding:"6px 8px",textAlign:"right",fontSize:12,color:C.blue}}>Frete</td><td style={{padding:"6px 8px",textAlign:"right",fontSize:12,color:C.blue}}>{fmt(s.freightPrice)}</td></tr>}
              <tr style={{borderTop:`2px solid ${C.border}`}}>
                <td colSpan={3} style={{padding:"10px 8px",textAlign:"right",fontWeight:700}}>TOTAL</td>
                <td style={{padding:"10px 8px",textAlign:"right",fontWeight:700,fontSize:17,color:cancelled?C.inkLt:C.green}}>{fmt(s.total)}</td>
              </tr>
            </tfoot>
          </table>
        </Card>

        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <Btn v="secondary" onClick={()=>printSaleReceipt(s)}>🖨️ Reimprimir Comprovante</Btn>
          {!cancelled&&<Btn v="danger" onClick={()=>cancelSale(s)} disabled={cancelling}>{cancelling?"Cancelando...":"❌ Cancelar Venda"}</Btn>}
        </div>
      </div>
    );
  }

  // ── LIST VIEW ──
  return(
    <div className="fu">
      <PageHeader title="Vendas" sub={`${sales.length} vendas · ${fmt(total)} total`}/>

      {/* Summary cards */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:12,marginBottom:24}}>
        <Card style={{borderLeft:`3px solid ${C.green}`}}>
          <div style={{fontSize:10.5,color:C.inkLt,marginBottom:6,letterSpacing:.5,textTransform:"uppercase"}}>Total Geral</div>
          <div className="cor" style={{fontSize:26,color:C.green}}>{fmt(total)}</div>
        </Card>
        {Object.entries(byM).map(([m,v])=>(
          <Card key={m} style={{borderLeft:`3px solid ${mc[m]||C.inkMd}`}}>
            <div style={{fontSize:10.5,color:C.inkLt,marginBottom:6,textTransform:"capitalize"}}>{m}</div>
            <div className="cor" style={{fontSize:22,color:mc[m]||C.inkMd}}>{fmt(v)}</div>
          </Card>
        ))}
      </div>

      {/* Barcode scan field */}
      <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:16,maxWidth:500}}>
        <div style={{position:"relative",flex:1}}>
          <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",fontSize:16,color:C.inkLt}}>📷</span>
          <input ref={scanRef} value={scanCode} onChange={e=>setScanCode(e.target.value)}
            onKeyDown={handleScan}
            placeholder="Escaneie o código de barras do comprovante..."
            style={{width:"100%",background:C.surface,border:`1.5px solid ${C.gold}`,borderRadius:8,color:C.ink,padding:"10px 14px 10px 40px",fontSize:13,outline:"none"}}/>
        </div>
        <input value={search} onChange={e=>setSearch(e.target.value)}
          placeholder="Buscar por cliente, vendedor..."
          style={{flex:1,background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,color:C.ink,padding:"10px 14px",fontSize:13,outline:"none"}}/>
      </div>

      {/* Sales list */}
      {filtered.length===0
        ?<Card style={{textAlign:"center",color:C.inkFt,padding:40}}>Nenhuma venda encontrada.</Card>

            const cancelled=s.status==="cancelada";
            return(
              <div key={s.id} onClick={()=>{setSelSale(s);setView("detail");}}
                style={{background:cancelled?"#FFF8F8":C.surface,border:`1.5px solid ${cancelled?C.red:C.border}`,borderRadius:12,padding:"14px 18px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10,transition:"border-color .12s",opacity:cancelled?.7:1}}

                    {(s.clientName||"Avulso").replace(/^[\d.\s]+/,"")}

                    {cancelled&&<span style={{fontSize:10.5,color:C.red,background:"#FFF0F0",padding:"1px 6px",borderRadius:8}}>Cancelada</span>}
                    {s.withNFe&&<span style={{fontSize:10.5,color:C.gold,background:C.goldLt,padding:"1px 6px",borderRadius:8}}>NF-e</span>}
                  </div>

                </div>

    </div>
  );
}


// ── DEVOLUÇÕES ─────────────────────────────────────────────────────────────
function Devolucoes({sales,setSales,products,stkG,setStkG,stkL,setStkL,addMov,showToast,logActivity,channel}){
  const [search,setSearch]=useState("");
  const [selSale,setSelSale]=useState(null);
  const [selItems,setSelItems]=useState({}); // {itemIdx: qty}
  const [reason,setReason]=useState("troca");
  const [saving,setSaving]=useState(false);
  const [scanCode,setScanCode]=useState("");
  const scanRef=useRef();

  useEffect(()=>{scanRef.current?.focus();},[]);

  const handleScan=(e)=>{
    if(e.key!=="Enter")return;
    const code=scanCode.trim();setScanCode("");
    if(!code)return;
    const found=sales.find(s=>
      s.id===code||
      (s.id||"").replace(/-/g,"").substring(0,12).toUpperCase()===code.toUpperCase()
    );
    if(found&&found.status!=="cancelada"){setSelSale(found);setSelItems({});}
    else if(found)showToast("Venda já cancelada","error");
    else showToast("Venda não encontrada","error");
  };

  const activeSales=[...sales]
    .filter(s=>s.status!=="cancelada")
    .filter(s=>{
      if(!search)return true;
      const q=search.toLowerCase();
      return (s.clientName||"").toLowerCase().includes(q)||(s.id||"").toLowerCase().includes(q);
    })
    .sort((a,b)=>new Date(b.date)-new Date(a.date))
    .slice(0,50);

  const processReturn=async()=>{
    const items=Object.entries(selItems).filter(([,q])=>q>0);
    if(items.length===0){showToast("Selecione ao menos 1 item","error");return;}
    setSaving(true);
    try{
      const isGalpao=selSale.sale_mode==="galpao";
      const table=isGalpao?"stock_galpao":"stock_loja";
      const stk=isGalpao?stkG:stkL;
      const setStk=isGalpao?setStkG:setStkL;

      for(const [idxStr,qty] of items){
        const idx=parseInt(idxStr);
        const item=selSale.items[idx];
        const prod=products.find(p=>p.name===item.name||p.id===item.pId);
        if(!prod)continue;
        const returnQty=Math.min(qty,item.qty);
        const existing=stk.find(s=>s.pId===prod.id&&s.sz===item.sz);
        const newQty=(existing?.qty||0)+returnQty;
        if(existing?._id){
          await sb.from(table).update({qty:newQty}).eq("id",existing._id);
        }else{
          const{data}=await sb.from(table).insert({product_id:prod.id,size:item.sz,qty:newQty}).select().single();
          if(data)setStk(prev=>[...prev,{pId:prod.id,sz:item.sz,qty:newQty,_id:data.id}]);
        }
        setStk(prev=>{
          const i=prev.findIndex(s=>s.pId===prod.id&&s.sz===item.sz);
          if(i>=0){const u=[...prev];u[i]={...u[i],qty:newQty};return u;}
          return prev;
        });
      }

      // Mark sale as devolvida (partial or full)
      const totalReturned=items.reduce((_,[,q])=>_+q,0);
      const totalItems=selSale.items.reduce((a,i)=>a+i.qty,0);
      const newStatus=totalReturned>=totalItems?"devolvida":"parcial";
      await sb.from("sales").update({status:newStatus}).eq("id",selSale.id);
      setSales(prev=>prev.map(s=>s.id===selSale.id?{...s,status:newStatus}:s));

      await addMov({type:"devolucao",loc:isGalpao?"galpao":"loja",
        desc:`Devolução ${reason} — ${(selSale.clientName||"Avulso").replace(/^[\d.\s]+/,"")} — ${totalReturned} peça(s)`});
      await logActivity("devolucao",`Devolução (${reason}) — ${selSale.clientName||"Avulso"} — ${totalReturned} peça(s) devolvidas ao estoque`);
      showToast(`✅ ${totalReturned} peça(s) devolvida(s) ao estoque!`);
      setSelSale(null);setSelItems({});
    }catch(err){showToast("Erro: "+err.message,"error");console.error(err);}
    setSaving(false);
  };

  return(
    <div className="fu">
      <PageHeader title="Devoluções" sub="Registre trocas e devoluções de mercadoria"/>

      {/* Barcode scan */}
      <div style={{display:"flex",gap:10,marginBottom:20,maxWidth:600,flexWrap:"wrap"}}>
        <div style={{position:"relative",flex:1,minWidth:220}}>
          <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",fontSize:16}}>📷</span>
          <input ref={scanRef} value={scanCode} onChange={e=>setScanCode(e.target.value)}
            onKeyDown={handleScan} placeholder="Escaneie o código do comprovante..."
            style={{width:"100%",background:C.surface,border:`1.5px solid ${C.gold}`,borderRadius:8,padding:"10px 14px 10px 40px",fontSize:13,outline:"none",color:C.ink}}/>
        </div>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar por cliente..."
          style={{flex:1,minWidth:180,background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 14px",fontSize:13,outline:"none",color:C.ink}}/>
      </div>

      <div style={{display:"grid",gridTemplateColumns:selSale?"1fr 380px":"1fr",gap:16,alignItems:"start"}}>

        {/* LEFT — sales list */}
        <div style={{display:"grid",gap:8}}>
          {activeSales.length===0&&<Card style={{textAlign:"center",color:C.inkFt,padding:40}}>Nenhuma venda encontrada.</Card>}
          {activeSales.map(s=>{
            const sel=selSale?.id===s.id;
            const status=s.status;
            return(
              <div key={s.id} onClick={()=>{setSelSale(sel?null:s);setSelItems({});}}
                style={{background:sel?C.goldLt:C.surface,border:`1.5px solid ${sel?C.gold:status==="devolvida"?C.red:C.border}`,borderRadius:10,padding:"12px 16px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,transition:"all .12s"}}
                onMouseEnter={e=>{if(!sel)e.currentTarget.style.borderColor=C.gold;}}
                onMouseLeave={e=>{if(!sel)e.currentTarget.style.borderColor=status==="devolvida"?C.red:C.border;}}>
                <div>
                  <div style={{fontWeight:600,fontSize:13.5,display:"flex",alignItems:"center",gap:8}}>
                    {(s.clientName||"Avulso").replace(/^[\d.\s]+/,"")}
                    {status==="devolvida"&&<span style={{fontSize:10,background:"#FFF0F0",color:C.red,padding:"1px 6px",borderRadius:6,fontWeight:700}}>Devolvida</span>}
                    {status==="parcial"&&<span style={{fontSize:10,background:"#FFF8E7",color:C.gold,padding:"1px 6px",borderRadius:6,fontWeight:700}}>Parcial</span>}
                  </div>
                  <div style={{fontSize:12,color:C.inkLt,marginTop:2}}>{fmtD(s.date)} · {s.items?.length} item(s)</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div className="cor" style={{fontSize:18,color:C.green}}>{fmt(s.total)}</div>
                </div>
              </div>
            );
          })}
        </div>

        {/* RIGHT — return panel */}
        {selSale&&(
          <div style={{position:"sticky",top:20}}>
            <Card>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                <div style={{fontWeight:700,fontSize:14}}>{(selSale.clientName||"Avulso").replace(/^[\d.\s]+/,"")}</div>
                <button onClick={()=>{setSelSale(null);setSelItems({});}} style={{background:"none",border:"none",cursor:"pointer",color:C.inkLt,fontSize:18}}>×</button>
              </div>

              <SectionTitle>Motivo</SectionTitle>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
                {[["troca","🔄 Troca"],["devolucao","↩ Devolução"],["defeito","⚠️ Defeito"],["outro","📋 Outro"]].map(([v,l])=>(
                  <button key={v} onClick={()=>setReason(v)} style={{padding:"8px",borderRadius:7,border:`1.5px solid ${reason===v?C.gold:C.border}`,background:reason===v?C.goldLt:"transparent",color:reason===v?C.gold:C.inkMd,cursor:"pointer",fontSize:12.5,fontWeight:reason===v?600:400}}>{l}</button>
                ))}
              </div>

              <SectionTitle>Selecione os itens a devolver</SectionTitle>
              <div style={{display:"grid",gap:8,marginBottom:14}}>
                {selSale.items?.map((item,i)=>(
                  <div key={i} style={{display:"grid",gridTemplateColumns:"1fr auto 70px",gap:8,alignItems:"center",padding:"8px",background:C.hover,borderRadius:7}}>
                    <div>
                      <div style={{fontSize:13,fontWeight:500}}>{item.name}</div>
                      <div style={{fontSize:11,color:C.inkLt}}>Tam {item.sz} · Qtd orig.: {item.qty}</div>
                    </div>
                    <span style={{fontSize:12,color:C.inkLt}}>Devolver:</span>
                    <input type="number" min="0" max={item.qty} value={selItems[i]||""}
                      onChange={e=>setSelItems(p=>({...p,[i]:Number(e.target.value)}))}
                      placeholder="0"
                      style={{width:"100%",background:C.surface,border:`1px solid ${(selItems[i]||0)>0?C.gold:C.border}`,borderRadius:6,padding:"6px 8px",fontSize:14,fontWeight:700,textAlign:"center",outline:"none",color:C.ink}}/>
                  </div>
                ))}
              </div>

              <Btn v="success" onClick={processReturn} full disabled={saving}>
                {saving?"Processando...":"↩ Confirmar Devolução"}
              </Btn>
            </Card>
          </div>
        )}
      </div>
    </div>
  );
}


// ── LABELS ─────────────────────────────────────────────────────────────────
function Labels({products}){
  const [selIds,setSelIds]=useState([]);
  const [qty,setQty]=useState(1);
  const [search,setSearch]=useState("");

  const toggle=(id)=>setSelIds(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const selAll=()=>setSelIds(filtered.map(p=>p.id));
  const clearAll=()=>setSelIds([]);

  const filtered=products.filter(p=>
    p.name.toLowerCase().includes(search.toLowerCase())||
    (p.sku||"").toLowerCase().includes(search.toLowerCase())
  );

  const printLabels=()=>{
    const sel=products.filter(p=>selIds.includes(p.id));
    if(sel.length===0){return;}
    // Each product generates qty labels, one per size variant per qty
    const labels=[];
    sel.forEach(p=>{
      for(let q=0;q<qty;q++){
        (p.sizes||[""]).forEach(sz=>{
          labels.push({name:p.name,sku:p.sku,sz,price:p.retailPrice,cat:p.cat});
        });
      }
    });

    // Layout: 3 columns x 8 rows = 24 per A4 page (Pimaco 6080 style)
    const cols=3, rows=8;
    const pages=[];
    for(let i=0;i<labels.length;i+=cols*rows){
      pages.push(labels.slice(i,i+cols*rows));
    }

    const w=window.open("","_blank","width=900,height=700");
    const pageHtml=pages.map(page=>{
      const cells=page.map(l=>`
        <div class="label">
          <div class="brand">THE COTT</div>
          <div class="name">${l.name}</div>
          <div class="sz-price">
            <span class="sz">TAM: ${l.sz||"UN"}</span>
            <span class="price">R$ ${l.price?.toFixed(2).replace(".",",")||"0,00"}</span>
          </div>
          <svg class="barcode" data-sku="${l.sku||""}"></svg>
          <div class="sku">${l.sku||""}</div>
        </div>`).join("");
      // Pad to full page
      const empty=cols*rows-page.length;
      const empties=Array(empty).fill('<div class="label empty"></div>').join("");
      return `<div class="page">${cells}${empties}</div>`;
    }).join("");

    w.document.write(`<!DOCTYPE html><html><head><title>Etiquetas — The Cott</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"><\/script>
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      body{font-family:'Arial Narrow',Arial,sans-serif;background:#fff}
      .page{
        width:210mm;min-height:297mm;
        display:grid;
        grid-template-columns:repeat(3,1fr);
        grid-template-rows:repeat(8,35mm);
        padding:10mm 5mm;
        gap:0;
        page-break-after:always;
      }
      .label{
        border:0.3mm dashed #ccc;
        padding:2mm 3mm;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        text-align:center;overflow:hidden;
      }
      .label.empty{border:0.3mm dashed #eee;}
      .brand{font-size:7pt;font-weight:700;letter-spacing:2px;color:#888;margin-bottom:1mm}
      .name{font-size:7.5pt;font-weight:700;line-height:1.2;margin-bottom:1mm;max-height:14pt;overflow:hidden}
      .sz-price{display:flex;justify-content:space-between;width:100%;font-size:7pt;margin-bottom:1mm}
      .sz{font-weight:700;color:#333}
      .price{font-weight:700;color:#1a1714}
      .barcode{width:100%;height:10mm}

                <div style={{fontSize:11,color:C.inkLt}}>{p.sku} · {p.sizes?.length||0} tamanhos</div>

      {selIds.length>0&&(

}

function NFe({sales,clients,issuedNFe,nfeConfig,saveNfeConfig,showToast,emitirNFe,logActivity}){
  const [selSale,setSelSale]=useState("");
  const [cfg,setCfg]=useState(nfeConfig);
  const [activeTab,setActiveTab]=useState("config");
  useEffect(()=>setCfg(nfeConfig),[nfeConfig]);
  const sale=sales.find(s=>s.id===selSale);
  const client=clients.find(c=>c.id===(sale?.client_id||sale?.clientId));
  const saveCfg=async()=>{await saveNfeConfig(cfg);showToast("Configuração salva!");};
  const emitir=async()=>{
    if(!selSale){showToast("Selecione uma venda","error");return;}
    if(!cfg.cnpj||!cfg.razaoSocial){showToast("Configure CNPJ e Razão Social","error");return;}
    await emitirNFe(sale,client);
    await logActivity("nfe_emitida",`Venda ${selSale} — ${fmt(sale?.total)}`);
    showToast("NF-e emitida!");setSelSale("");
  };
  return(
    <div className="fu">
      <PageHeader title="NF-e" sub="Nota Fiscal Eletrônica modelo 55"/>
      <InlineTabs tabs={[{id:"config",label:"Configuração"},{id:"emitir",label:"Emitir NF-e"},{id:"historico",label:"Histórico"}]} active={activeTab} onChange={setActiveTab}/>
      {activeTab==="config"&&(
        <Card style={{maxWidth:560}}>
          <Fld label="CNPJ" value={cfg.cnpj} onChange={v=>setCfg(f=>({...f,cnpj:v}))} placeholder="00.000.000/0001-00" required/>
          <Fld label="Razão Social" value={cfg.razaoSocial} onChange={v=>setCfg(f=>({...f,razaoSocial:v}))} required/>
          <Fld label="Inscrição Estadual" value={cfg.ie} onChange={v=>setCfg(f=>({...f,ie:v}))}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
            <Fld label="UF" value={cfg.uf} onChange={v=>setCfg(f=>({...f,uf:v}))}
              options={["SP","RJ","MG","RS","PR","SC","BA","PE","CE","GO","MT","MS","ES","AM","PA","MA","PI","AL","SE","RN","PB","TO","RO","AC","AP","RR","DF"]}/>
            <Fld label="CRT" value={cfg.crt} onChange={v=>setCfg(f=>({...f,crt:v}))}
              options={[{value:"1",label:"1-Simples"},{value:"2",label:"2-Excesso"},{value:"3",label:"3-Normal"}]}/>
            <Fld label="Série" value={cfg.serie} onChange={v=>setCfg(f=>({...f,serie:v}))}/>
          </div>
          <Fld label="Ambiente" value={cfg.ambiente} onChange={v=>setCfg(f=>({...f,ambiente:v}))}
            options={[{value:"homologacao",label:"Homologação (teste)"},{value:"producao",label:"Produção (válido fiscalmente)"}]}/>
          {cfg.ambiente==="producao"&&<div style={{marginBottom:14,padding:"9px 13px",background:"#FFF3CD",borderRadius:7,fontSize:12.5,color:"#856404"}}>⚠️ Ambiente de produção — NF-es terão validade fiscal.</div>}
          <Btn onClick={saveCfg} full sz="lg">Salvar Configuração</Btn>
        </Card>
      )}
      {activeTab==="emitir"&&(
        <Card style={{maxWidth:560}}>
          <Fld label="Selecionar venda" value={selSale} onChange={setSelSale}
            options={[{value:"",label:"Selecione uma venda..."},...sales.filter(s=>!s.withNFe&&!s.with_nfe).map(s=>({value:s.id,label:`${s.clientName} — ${fmt(s.total)} — ${fmtDS(s.date)}`}))]}
            note="Apenas vendas sem NF-e emitida"/>
          {sale&&<div style={{marginBottom:14,padding:"11px 14px",background:C.hover,borderRadius:8,fontSize:13,color:C.inkMd}}>
            <div><strong>Cliente:</strong> {sale.clientName}{client?.cpf_cnpj?` · ${client.cpf_cnpj}`:""}</div>
            <div><strong>Total:</strong> {fmt(sale.total)} · {sale.items?.length} item(s)</div>
          </div>}
          <Btn onClick={emitir} full sz="lg">Emitir NF-e →</Btn>
        </Card>
      )}
      {activeTab==="historico"&&(
        <div>
          {issuedNFe.length===0?<Card style={{textAlign:"center",color:C.inkFt,padding:40}}>Nenhuma NF-e emitida.</Card>
            :issuedNFe.map(n=>(
              <Card key={n.id} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <div style={{fontWeight:600,fontSize:14}}>NF-e nº {n.numero} · Série {n.serie}</div>
                  <Badge color={n.ambiente==="producao"?C.green:C.gold}>{n.ambiente==="producao"?"Autorizada":"Homologação"}</Badge>
                </div>
                <div style={{fontSize:12.5,color:C.inkMd,marginBottom:4}}>{n.clientName} · {fmt(n.total)} · {fmtDS(n.date)}</div>
                <div style={{fontSize:10,color:C.inkFt,fontFamily:"monospace",wordBreak:"break-all",marginBottom:8}}>{n.chave}</div>
                <div style={{display:"flex",gap:8}}>
                  <Btn v="ghost" sz="sm">📄 DANFE</Btn>
                  <Btn v="ghost" sz="sm">📁 XML</Btn>
                </div>
              </Card>
            ))}
        </div>
      )}
    </div>
  );
}

// ── DASHBOARD ──────────────────────────────────────────────────────────────
function Dashboard({products,stkG,stkL,movements,sales,activities,channel,setSales,showToast,logActivity,addMov,clients,setTab}){
  // Client alerts: boleto unpaid >7 days, inactive >60 days
  const clientAlerts=React.useMemo(()=>{
    if(!clients?.length)return[];
    const now=new Date();
    const alerts=[];
    clients.forEach(c=>{
      // Check boleto overdue
      const boletSales=sales.filter(s=>(s.client_id===c.id||s.clientId===c.id)&&s.payment_method==="boleto"&&s.status!=="cancelada");
      boletSales.forEach(s=>{
        const saleDate=new Date(s.date);
        const daysSince=Math.floor((now-saleDate)/(1000*60*60*24));
        if(daysSince>7&&s.status!=="pago"){
          alerts.push({type:"boleto",client:c,sale:s,days:daysSince,msg:`Boleto há ${daysSince} dias`});
        }
      });
      // Check inactive >60 days
      const lastSale=sales.filter(s=>s.client_id===c.id||s.clientId===c.id).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
      if(lastSale){
        const daysSince=Math.floor((now-new Date(lastSale.date))/(1000*60*60*24));
        if(daysSince>60)alerts.push({type:"inactive",client:c,days:daysSince,msg:`Inativo há ${daysSince} dias`});
      }
    });
    return alerts.slice(0,10);
  },[clients,sales]);
  const [dashTab,setDashTab]=useState("overview"); // overview | vendas | atividades
  const [saleSearch,setSaleSearch]=useState("");
  const [selSale,setSelSale]=useState(null);
  const [cancelling,setCancelling]=useState(false);
  const scanRef=useRef();

  useEffect(()=>{ if(dashTab==="vendas")scanRef.current?.focus(); },[dashTab]);

  // ── Filter sales by channel ──
  const channelSales=sales.filter(s=>{
    if(!channel)return true;
    if(channel==="galpao")return s.sale_mode==="galpao"||s.sale_mode==="online";
    if(channel==="centro")return s.sale_mode==="balcao"||s.sale_mode==="whatsapp"||!s.sale_mode;
    return true;
  });
  const channelActivities=(activities||[]).filter(a=>true); // all for now

  const todaySales=channelSales.filter(s=>s.date?.startsWith(new Date().toISOString().slice(0,10)));
  const totalG=stkG.reduce((a,b)=>a+b.qty,0);
  const totalL=stkL.reduce((a,b)=>a+b.qty,0);
  const mc={dinheiro:C.gold,pix:C.green,cartao:C.blue,boleto:C.inkMd};

  const filteredSales=[...channelSales]
    .filter(s=>{
      if(!saleSearch)return true;
      const q=saleSearch.toLowerCase();
      return (s.clientName||"").toLowerCase().includes(q)||(s.seller||"").toLowerCase().includes(q);
    })
    .sort((a,b)=>new Date(b.date)-new Date(a.date));

  const cancelSale=async(sale)=>{
    if(!window.confirm(`Cancelar venda de ${fmt(sale.total)}?`))return;
    setCancelling(true);
    try{
      await sb.from("sales").update({status:"cancelada"}).eq("id",sale.id);
      setSales(prev=>prev.map(s=>s.id===sale.id?{...s,status:"cancelada"}:s));
      await logActivity("cancelamento",`Venda cancelada — ${sale.clientName||"Avulso"} — ${fmt(sale.total)}`);
      showToast("Venda cancelada ✅");
      setSelSale(null);
    }catch(err){showToast("Erro: "+err.message,"error");}
    setCancelling(false);
  };

  const printSaleReceipt=(s)=>{
    const w=window.open("","_blank","width=800,height=700");
    const barcodeId=(s.id||"").replace(/-/g,"").substring(0,12).toUpperCase();
    const items=(s.items||[]).map(item=>`<tr>

    </tr>`).join("");

    .bc{text-align:center;margin-top:14px;padding-top:12px;border-top:1px dashed #ccc}

    @media print{@page{size:A5;margin:0}body{padding:10mm 8mm}}</style></head><body>
    <h2>✦ THE COTT ✦</h2><div class="sub">COMPROVANTE DE VENDA</div>
    <p style="font-size:12px;margin-bottom:8px"><strong>Cliente:</strong> ${(s.clientName||"Avulso").replace(/^[\d.\s]+/,"")}</p>
    <p style="font-size:12px;margin-bottom:12px"><strong>Data:</strong> ${new Date(s.date).toLocaleString("pt-BR")} · <strong>Vendedor:</strong> ${s.seller||""}</p>
    <table><thead><tr><th style="width:46px">Qtd</th><th style="text-align:left">Produto</th><th style="width:60px">Tam</th><th style="width:100px;text-align:right">Valor</th></tr></thead>
    <tbody>${items}</tbody>
    <tfoot><tr><td colspan="3" class="total" style="text-align:right">TOTAL</td><td class="total" style="text-align:right;color:#4A7C5E">R$ ${(s.total||0).toFixed(2).replace(".",",")}</td></tr></tfoot>
    </table>
    <div class="bc"><svg id="bc"></svg><div class="bc-label">TROCA/DEVOLUÇÃO: ${barcodeId}</div></div>
    <script>JsBarcode("#bc","${barcodeId}",{format:"CODE128",width:1.5,height:36,displayValue:false,margin:0,background:"transparent"});setTimeout(()=>window.print(),600);<\/script>
    </body></html>`);
    w.document.close();
  };

  // ── Sub tabs ──
  const tabs=[
    {id:"overview",label:"Visão Geral"},
    {id:"vendas",label:`Vendas (${channelSales.filter(s=>s.status!=="cancelada").length})`},
    {id:"atividades",label:"Atividades"},
  ];

  return(
    <div className="fu">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20,flexWrap:"wrap",gap:10}}>
        <div>
          <div className="cor" style={{fontSize:32,fontWeight:400}}>Início</div>
          <div style={{fontSize:13,color:C.inkLt}}>{new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}</div>
        </div>
        {setTab&&<Btn v="gold" onClick={()=>setTab("pdv")} sz="lg">◉ Nova Venda</Btn>}

              <span style={{fontSize:16}}>{a.type==="boleto"?"🔴":"🟡"}</span>

                <span style={{fontSize:12,color:a.type==="boleto"?C.red:"#7A5C00",marginLeft:8}}>{a.msg}</span>

              {a.type==="inactive"&&<span style={{fontSize:11,background:C.gold,color:"#fff",borderRadius:10,padding:"2px 8px",fontWeight:700}}>INATIVO</span>}
            </div>
          ))}
        </div>
      )}

      {/* Sub-tab bar */}
      <div style={{display:"flex",gap:0,marginBottom:24,borderBottom:`2px solid ${C.border}`}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setDashTab(t.id)} style={{
            padding:"10px 20px",border:"none",background:"none",cursor:"pointer",fontSize:13.5,
            fontWeight:dashTab===t.id?700:400,color:dashTab===t.id?C.ink:C.inkMd,
            borderBottom:dashTab===t.id?`2px solid ${C.gold}`:"2px solid transparent",

          }}>{t.label}</button>

      {/* ── OVERVIEW ── */}

              {label:"Total (mês)",val:fmt(channelSales.filter(s=>s.status!=="cancelada").reduce((a,b)=>a+(b.total||0),0)),sub:"todas as vendas",color:C.gold},

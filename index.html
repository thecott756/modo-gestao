      {dashTab==="vendas"&&(
        <div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10,marginBottom:20}}>
            <Card style={{borderLeft:`3px solid ${C.green}`}}>
              <div style={{fontSize:10,color:C.inkLt,marginBottom:4,textTransform:"uppercase",letterSpacing:.5}}>Total</div>
              <div className="cor" style={{fontSize:24,color:C.green}}>{fmt(channelSales.filter(s=>s.status!=="cancelada").reduce((a,b)=>a+(b.total||0),0))}</div>
            </Card>
            {Object.entries(channelSales.filter(s=>s.status!=="cancelada").reduce((a,s)=>{a[s.paymentMethod]=(a[s.paymentMethod]||0)+s.total;return a;},{})).map(([m,v])=>(
              <Card key={m} style={{borderLeft:`3px solid ${mc[m]||C.inkMd}`}}>
                <div style={{fontSize:10,color:C.inkLt,marginBottom:4,textTransform:"capitalize"}}>{m}</div>
                <div className="cor" style={{fontSize:20,color:mc[m]||C.inkMd}}>{fmt(v)}</div>
              </Card>
            ))}
          </div>
          <input ref={scanRef} value={saleSearch} onChange={e=>setSaleSearch(e.target.value)}
            placeholder="📷 Escaneie o código ou busque por cliente..."
            style={{width:"100%",maxWidth:500,background:C.surface,border:`1.5px solid ${C.gold}`,borderRadius:8,padding:"10px 14px",fontSize:13,outline:"none",color:C.ink,marginBottom:14}}/>
          {selSale?(
            <div style={{maxWidth:640}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
                <button onClick={()=>setSelSale(null)} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:C.inkMd}}>←</button>
                <div className="cor" style={{fontSize:22}}>Venda #{(selSale.id||"").substring(0,8).toUpperCase()}</div>
                {selSale.status==="cancelada"&&<span style={{fontSize:11,background:"#FFF0F0",color:C.red,padding:"2px 8px",borderRadius:6,fontWeight:700}}>CANCELADA</span>}
              </div>
              <Card style={{marginBottom:12}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                  <thead><tr style={{borderBottom:`2px solid ${C.border}`}}>
                    {["Produto","Tam","Qtd","Valor"].map(h=><th key={h} style={{padding:"7px 8px",textAlign:h==="Qtd"||h==="Tam"?"center":"left",fontSize:11,fontWeight:700,color:C.inkLt,textTransform:"uppercase"}}>{h}</th>)}
                  </tr></thead>
                  <tbody>{(selSale.items||[]).map((item,i)=>(
                    <tr key={i} style={{borderBottom:`1px solid ${C.border}`}}>
                      <td style={{padding:"8px"}}>{item.name}</td>
                      <td style={{padding:"8px",textAlign:"center",fontWeight:600}}>{item.sz}</td>
                      <td style={{padding:"8px",textAlign:"center"}}>{item.qty}</td>
                      <td style={{padding:"8px",textAlign:"right",color:C.green,fontWeight:600}}>{fmt(item.price*item.qty)}</td>
                    </tr>
                  ))}</tbody>
                  <tfoot>
                    <tr style={{borderTop:`2px solid ${C.border}`}}>
                      <td colSpan={3} style={{padding:"10px 8px",textAlign:"right",fontWeight:700}}>TOTAL</td>
                      <td style={{padding:"10px 8px",textAlign:"right",fontWeight:700,fontSize:16,color:C.green}}>{fmt(selSale.total)}</td>
                    </tr>
                  </tfoot>
                </table>
              </Card>
              <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                <Btn v="secondary" onClick={()=>printSaleReceipt(selSale)}>🖨️ Reimprimir</Btn>
                {selSale.status!=="cancelada"&&<Btn v="danger" onClick={()=>cancelSale(selSale)} disabled={cancelling}>{cancelling?"Cancelando...":"❌ Cancelar Venda"}</Btn>}
              </div>
            </div>
          ):(
            <div style={{display:"grid",gap:8}}>
              {filteredSales.slice(0,60).map(s=>{
                const cancelled=s.status==="cancelada";
                return(
                  <div key={s.id} onClick={()=>setSelSale(s)}
                    style={{background:cancelled?"#FFF8F8":C.surface,border:`1.5px solid ${cancelled?C.red:C.border}`,borderRadius:10,padding:"12px 16px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,opacity:cancelled?.7:1,transition:"border-color .12s"}}
                    onMouseEnter={e=>{if(!cancelled)e.currentTarget.style.borderColor=C.gold;}}
                    onMouseLeave={e=>{e.currentTarget.style.borderColor=cancelled?C.red:C.border;}}>
                    <div>
                      <div style={{fontWeight:600,fontSize:13,display:"flex",alignItems:"center",gap:8}}>
                        {(s.clientName||"Avulso").replace(/^[\d.\s]+/,"")}
                        {cancelled&&<span style={{fontSize:10,color:C.red,background:"#FFF0F0",padding:"1px 6px",borderRadius:6,fontWeight:700}}>Cancelada</span>}
                        {s.isWholesale&&<span style={{fontSize:10,color:C.purple,background:C.purpleLt,padding:"1px 6px",borderRadius:6}}>Atacado</span>}
                      </div>
                      <div style={{fontSize:11.5,color:C.inkLt}}>{fmtD(s.date)} · {s.seller} · {s.items?.length} item(s)</div>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <div className="cor" style={{fontSize:18,color:cancelled?C.inkLt:C.green}}>{fmt(s.total)}</div>
                      <span style={{color:C.inkFt}}>›</span>
                    </div>
                  </div>
                );
              })}
              {filteredSales.length===0&&<Card style={{textAlign:"center",color:C.inkFt,padding:40}}>Nenhuma venda.</Card>}
            </div>
          )}
        </div>
      )}

      {/* ── ATIVIDADES ── */}
      {dashTab==="atividades"&&(
        <div>
          <div style={{display:"grid",gap:8}}>
            {channelActivities.length===0&&<Card style={{textAlign:"center",color:C.inkFt,padding:40}}>Nenhuma atividade registrada.</Card>}
            {channelActivities.slice(0,100).map((a,i)=>(
              <div key={i} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                <div>
                  <div style={{fontWeight:500,fontSize:13}}>{a.detail||a.action}</div>
                  <div style={{fontSize:11,color:C.inkLt,marginTop:2}}>{a.username} · {fmtD(a.date)}</div>
                </div>
                <span style={{fontSize:11,background:C.hover,color:C.inkMd,padding:"2px 8px",borderRadius:6,whiteSpace:"nowrap"}}>{a.action}</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}




// ── CONFIGURAÇÕES ────────────────────────────────────────────────────────────
function Configuracoes({showToast,user}){
  // 2-step verification gate
  const [verified,setVerified]=useState(false);
  const [verifyPw,setVerifyPw]=useState("");
  const [verifyErr,setVerifyErr]=useState("");

  const doVerify=()=>{
    const u=USERS.find(u=>u.login===user.login&&u.pw===verifyPw);
    if(u){setVerified(true);setVerifyErr("");}
    else{setVerifyErr("Senha incorreta.");setVerifyPw("");}
  };

  if(!verified)return(
    <div className="fu" style={{maxWidth:380}}>
      <PageHeader title="Configurações" sub="Verificação necessária para continuar"/>
      <Card>
        <div style={{textAlign:"center",marginBottom:20}}>
          <div style={{fontSize:40,marginBottom:10}}>🔐</div>
          <div style={{fontWeight:600,fontSize:15,color:C.ink}}>Confirme sua identidade</div>
          <div style={{fontSize:13,color:C.inkLt,marginTop:4}}>Insira sua senha para acessar as configurações</div>
        </div>
        <input type="password" value={verifyPw} onChange={e=>setVerifyPw(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&doVerify()}
          placeholder="Sua senha..."
          style={{width:"100%",background:C.hover,border:`1.5px solid ${verifyErr?C.red:C.border}`,borderRadius:8,color:C.ink,padding:"11px 14px",fontSize:14,outline:"none",marginBottom:10}}
          autoFocus/>
        {verifyErr&&<div style={{color:C.red,fontSize:12,marginBottom:10}}>{verifyErr}</div>}
        <Btn v="gold" onClick={doVerify} full sz="lg">🔓 Acessar Configurações</Btn>
      </Card>
    </div>
  );

  const [asaasKey,setAsaasKey]=useState("");
  const [savedKey,setSavedKey]=useState("");
  const [saving,setSaving]=useState(false);
  const [savingBoleto,setSavingBoleto]=useState(false);
  const [testing,setTesting]=useState(false);
  const [testResult,setTestResult]=useState(null);
  const [showKey,setShowKey]=useState(false);

  // Boleto settings
  const [diasVenc,setDiasVenc]=useState(3);
  const [multaPct,setMultaPct]=useState(2);
  const [jurosPct,setJurosPct]=useState(1);
  const [descPct,setDescPct]=useState(0);
  const [descDias,setDescDias]=useState(0);
  const [boletoEnv,setBoletoEnv]=useState("email"); // email | whatsapp | none
  // Resend
  const [resendKey,setResendKey]=useState("");
  const [resendFrom,setResendFrom]=useState("");
  const [savingResend,setSavingResend]=useState(false);
  const [testResend,setTestResend]=useState(null);
  const [showResendKey,setShowResendKey]=useState(false);

  useEffect(()=>{
    const load=async()=>{
      try{
        const{data}=await sb.from("nfe_config").select("*").eq("id",1).single();
        if(data?.asaas_key){setSavedKey(data.asaas_key);setAsaasKey(data.asaas_key);}
        if(data?.boleto_dias_venc!=null) setDiasVenc(data.boleto_dias_venc);
        if(data?.boleto_multa!=null)     setMultaPct(data.boleto_multa);
        if(data?.boleto_juros!=null)     setJurosPct(data.boleto_juros);
        if(data?.boleto_desc_pct!=null)  setDescPct(data.boleto_desc_pct);
        if(data?.boleto_desc_dias!=null) setDescDias(data.boleto_desc_dias);
        if(data?.boleto_envio)           setBoletoEnv(data.boleto_envio);
        if(data?.resend_key)              setResendKey(data.resend_key);
        if(data?.resend_from)             setResendFrom(data.resend_from);
      }catch(e){}
    };
    load();
  },[]);

  const saveKey=async()=>{
    if(!asaasKey.trim()){showToast("Informe a chave da API","error");return;}
    setSaving(true);
    try{
      await sb.from("nfe_config").upsert({id:1,asaas_key:asaasKey.trim()});
      setSavedKey(asaasKey.trim());
      showToast("✅ Chave salva!");
    }catch(e){showToast("Erro: "+e.message,"error");}
    setSaving(false);
  };

  const saveBoleto=async()=>{
    setSavingBoleto(true);
    try{
      await sb.from("nfe_config").upsert({
        id:1,
        boleto_dias_venc:diasVenc,
        boleto_multa:multaPct,
        boleto_juros:jurosPct,
        boleto_desc_pct:descPct,
        boleto_desc_dias:descDias,
        boleto_envio:boletoEnv,
      });
      showToast("✅ Configurações do boleto salvas!");
    }catch(e){showToast("Erro: "+e.message,"error");}
    setSavingBoleto(false);
  };

  const saveResendConfig=async()=>{
    if(!resendKey.trim()||!resendFrom.trim()){showToast("Preencha chave e e-mail remetente","error");return;}
    setSavingResend(true);
    try{
      await sb.from("nfe_config").upsert({id:1,resend_key:resendKey.trim(),resend_from:resendFrom.trim()});
      showToast("✅ Configuração de e-mail salva!");
    }catch(e){showToast("Erro: "+e.message,"error");}
    setSavingResend(false);
  };

  const testResendConfig=async()=>{
    if(!resendKey.trim()||!resendFrom.trim()){showToast("Salve a configuração primeiro","error");return;}
    setTestResend(null);
    try{
      const{data,error}=await sb.functions.invoke("send-email",{
        body:{
          action:"test",
          apiKey:resendKey.trim(),
          from:resendFrom.trim(),
          to:resendFrom.trim(),
          subject:"Teste MODO — E-mail funcionando!",
          html:"<p>Olá! Este é um e-mail de teste do sistema <strong>MODO Gestão Fashion</strong>. Se você recebeu este e-mail, a integração está funcionando corretamente. ✅</p><p>The Cott LTDA</p>",
        }
      });
      if(data?.ok){setTestResend("ok");showToast("✅ E-mail de teste enviado!");}
      else{setTestResend("erro");showToast("❌ "+(data?.error||error?.message||"Erro no envio"),"error");}
    }catch(e){setTestResend("erro");showToast("❌ "+e.message,"error");}
  };

  const testKey=async()=>{
    const key=asaasKey.trim()||savedKey;
    if(!key){showToast("Informe a chave primeiro","error");return;}
    setTesting(true);setTestResult(null);
    try{
      const{data,error}=await sb.functions.invoke("asaas-proxy",{body:{action:"test",apiKey:key}});
      const errMsg=error?.message||data?.error||null;
      if(data?.ok){setTestResult("ok");showToast("✅ Conexão funcionando!");}
      else if(errMsg&&!errMsg.includes("non-2xx")){setTestResult("erro");showToast("❌ "+errMsg,"error");}
      else{setTestResult("erro");showToast("❌ Chave inválida","error");}
    }catch(e){setTestResult("erro");showToast("❌ "+e.message,"error");}
    setTesting(false);
  };

  const maskedKey=savedKey?savedKey.substring(0,12)+"••••••••••••"+savedKey.slice(-4):"";
  const vencDate=(()=>{const d=new Date();d.setDate(d.getDate()+diasVenc);return d.toLocaleDateString("pt-BR");})();

  return(
    <div className="fu" style={{maxWidth:640}}>
      <PageHeader title="Configurações" sub="Integrações e configurações do sistema"/>

      {/* ── ASAAS KEY ── */}
      <Card style={{marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
          <div style={{width:40,height:40,borderRadius:10,background:"#EBF3FF",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>🔗</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:15}}>Asaas — Chave de API</div>
            <div style={{fontSize:12,color:C.inkLt}}>Obtenha em asaas.com → Integrações → Chaves de API</div>
          </div>
          {savedKey&&(
            <span style={{background:testResult==="erro"?"#FFF0F0":testResult==="ok"?C.greenLt:C.hover,color:testResult==="erro"?C.red:testResult==="ok"?C.green:C.inkMd,fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20}}>
              {testResult==="erro"?"⚠️ Erro":testResult==="ok"?"✅ Conectado":"● Salva"}
            </span>
          )}
        </div>

        <div style={{position:"relative",marginBottom:10}}>
          <input type={showKey?"text":"password"} value={asaasKey} onChange={e=>setAsaasKey(e.target.value)}
            placeholder={savedKey?"••••• chave salva •••••":"Cole aqui: $aact_prod_..."}
            style={{width:"100%",background:C.hover,border:`1.5px solid ${C.border}`,borderRadius:7,color:C.ink,padding:"10px 44px 10px 13px",fontSize:13,outline:"none",fontFamily:"monospace"}}/>
          <button onClick={()=>setShowKey(v=>!v)}
            style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:16,color:C.inkLt}}>
            {showKey?"🙈":"👁️"}
          </button>
        </div>
        {savedKey&&<div style={{fontSize:11,color:C.green,marginBottom:8,display:"flex",alignItems:"center",gap:6}}><span>✅</span> Chave configurada</div>}
        <div style={{display:"flex",gap:8}}>
          <Btn v="gold" onClick={saveKey} disabled={saving||!asaasKey.trim()}>{saving?"Salvando...":"💾 Salvar Chave"}</Btn>
          <Btn v="ghost" onClick={testKey} disabled={testing}>{testing?"Testando...":"🔌 Testar Conexão"}</Btn>
        </div>
        {testResult==="ok"&&<div style={{marginTop:10,background:C.greenLt,borderRadius:7,padding:"9px 13px",fontSize:13,color:C.green}}>✅ Conexão com Asaas funcionando!</div>}
        {testResult==="erro"&&<div style={{marginTop:10,background:"#FFF0F0",borderRadius:7,padding:"9px 13px",fontSize:13,color:C.red}}>❌ Chave inválida. Verifique no Asaas.</div>}
      </Card>

      {/* ── BOLETO SETTINGS ── */}
      <Card style={{marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
          <div style={{width:40,height:40,borderRadius:10,background:"#FFF8E7",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>🧾</div>
          <div>
            <div style={{fontWeight:700,fontSize:15}}>Configurações do Boleto</div>
            <div style={{fontSize:12,color:C.inkLt}}>Vencimento, multa, juros e desconto aplicados em todos os boletos</div>
          </div>
        </div>

        {/* Vencimento */}
        <SectionTitle>Prazo de vencimento</SectionTitle>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
          <div style={{display:"flex",alignItems:"center",gap:8,background:C.hover,borderRadius:8,padding:"8px 14px"}}>
            <button onClick={()=>setDiasVenc(d=>Math.max(1,d-1))}
              style={{width:28,height:28,borderRadius:6,border:`1px solid ${C.border}`,background:C.surface,cursor:"pointer",fontSize:18,fontWeight:700,color:C.ink}}>−</button>
            <div style={{textAlign:"center",minWidth:60}}>
              <div style={{fontSize:22,fontWeight:700,color:C.gold}}>{diasVenc}</div>
              <div style={{fontSize:10,color:C.inkLt}}>dia(s)</div>
            </div>
            <button onClick={()=>setDiasVenc(d=>Math.min(30,d+1))}
              style={{width:28,height:28,borderRadius:6,border:`1px solid ${C.border}`,background:C.surface,cursor:"pointer",fontSize:18,fontWeight:700,color:C.ink}}>+</button>
          </div>
          <div style={{fontSize:12.5,color:C.inkMd}}>
            Boleto gerado hoje vence em<br/>
            <strong style={{color:C.ink}}>{vencDate}</strong>
          </div>
        </div>

        {/* Multa e Juros */}
        <SectionTitle>Multa e Juros por atraso</SectionTitle>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
          <div>
            <div style={{fontSize:12,color:C.inkLt,marginBottom:6}}>Multa (aplicada 1× no atraso)</div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <input type="number" min={0} max={2} step={0.1} value={multaPct}
                onChange={e=>setMultaPct(Math.min(2,Math.max(0,parseFloat(e.target.value)||0)))}
                style={{width:80,background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,padding:"8px 10px",fontSize:15,fontWeight:600,textAlign:"center",outline:"none",color:C.ink}}/>
              <span style={{fontSize:14,color:C.inkMd,fontWeight:600}}>%</span>
            </div>
            <div style={{fontSize:10.5,color:C.inkFt,marginTop:4}}>Máx. legal: 2%</div>
          </div>
          <div>
            <div style={{fontSize:12,color:C.inkLt,marginBottom:6}}>Juros (ao mês, pro-rata)</div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <input type="number" min={0} max={1} step={0.1} value={jurosPct}
                onChange={e=>setJurosPct(Math.min(1,Math.max(0,parseFloat(e.target.value)||0)))}
                style={{width:80,background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,padding:"8px 10px",fontSize:15,fontWeight:600,textAlign:"center",outline:"none",color:C.ink}}/>
              <span style={{fontSize:14,color:C.inkMd,fontWeight:600}}>% a.m.</span>
            </div>
            <div style={{fontSize:10.5,color:C.inkFt,marginTop:4}}>Máx. legal: 1% a.m.</div>
          </div>
        </div>

        {/* Desconto */}
        <SectionTitle>Desconto por pagamento antecipado</SectionTitle>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
          <div>
            <div style={{fontSize:12,color:C.inkLt,marginBottom:6}}>Desconto</div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <input type="number" min={0} max={20} step={0.5} value={descPct}
                onChange={e=>setDescPct(Math.max(0,parseFloat(e.target.value)||0))}
                style={{width:80,background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,padding:"8px 10px",fontSize:15,fontWeight:600,textAlign:"center",outline:"none",color:C.ink}}/>
              <span style={{fontSize:14,color:C.inkMd,fontWeight:600}}>%</span>
            </div>
          </div>
          <div>
            <div style={{fontSize:12,color:C.inkLt,marginBottom:6}}>Válido até (dias antes do venc.)</div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <input type="number" min={0} max={diasVenc} value={descDias}
                onChange={e=>setDescDias(Math.max(0,parseInt(e.target.value)||0))}
                style={{width:80,background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,padding:"8px 10px",fontSize:15,fontWeight:600,textAlign:"center",outline:"none",color:C.ink}}/>
              <span style={{fontSize:14,color:C.inkMd,fontWeight:600}}>dia(s)</span>
            </div>
          </div>
        </div>
        {descPct>0&&descDias>0&&(
          <div style={{background:C.greenLt,borderRadius:7,padding:"8px 12px",fontSize:12.5,color:C.green,marginBottom:16}}>
            💡 Desconto de {descPct}% para pagamentos até {descDias} dia(s) antes do vencimento
          </div>
        )}

        {/* Envio automático */}
        <SectionTitle>Envio automático do boleto</SectionTitle>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:16}}>
          {[["none","❌ Não enviar"],["email","✉️ E-mail"],["whatsapp","📱 WhatsApp"]].map(([v,l])=>(
            <button key={v} onClick={()=>setBoletoEnv(v)}
              style={{padding:"10px 8px",borderRadius:8,border:`1.5px solid ${boletoEnv===v?C.gold:C.border}`,background:boletoEnv===v?C.goldLt:"transparent",color:boletoEnv===v?C.gold:C.inkMd,cursor:"pointer",fontSize:13,fontWeight:boletoEnv===v?600:400}}>
              {l}
            </button>
          ))}
        </div>

        {/* Preview */}
        <div style={{background:C.hover,borderRadius:8,padding:"12px 14px",marginBottom:14,fontSize:12.5,color:C.inkMd}}>
          <div style={{fontWeight:600,color:C.ink,marginBottom:6}}>📋 Resumo das configurações:</div>
          <div>Vencimento: <strong>{diasVenc} dia(s)</strong> após a emissão</div>
          <div>Multa: <strong>{multaPct}%</strong> {multaPct===0?"(sem multa)":"no atraso"}</div>
          <div>Juros: <strong>{jurosPct}% a.m.</strong> {jurosPct===0?"(sem juros)":"após vencimento"}</div>
          {descPct>0?<div>Desconto: <strong>{descPct}%</strong> se pagar {descDias}d antes</div>:<div>Desconto: <strong>Nenhum</strong></div>}
          <div>Envio: <strong>{boletoEnv==="none"?"Não enviar":boletoEnv==="email"?"Por e-mail":"Por WhatsApp"}</strong></div>
        </div>

        <Btn v="success" onClick={saveBoleto} disabled={savingBoleto} full>
          {savingBoleto?"Salvando...":"✅ Salvar Configurações do Boleto"}
        </Btn>
      </Card>

      {/* ── RESEND EMAIL ── */}
      <Card style={{marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
          <div style={{width:40,height:40,borderRadius:10,background:"#F0FFF4",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>✉️</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:15}}>Resend — Envio de E-mails</div>
            <div style={{fontSize:12,color:C.inkLt}}>Envie comprovantes diretamente aos clientes. Plano grátis: 3.000 e-mails/mês</div>
          </div>
          {resendKey&&(
            <span style={{background:testResend==="ok"?C.greenLt:testResend==="erro"?"#FFF0F0":C.hover,color:testResend==="ok"?C.green:testResend==="erro"?C.red:C.inkMd,fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20}}>
              {testResend==="ok"?"✅ Ativo":testResend==="erro"?"⚠️ Erro":"● Configurado"}
            </span>
          )}
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr",gap:10,marginBottom:12}}>
          <div>
            <div style={{fontSize:11.5,color:C.inkLt,marginBottom:5}}>Chave de API (resend.com → API Keys)</div>
            <div style={{position:"relative"}}>
              <input type={showResendKey?"text":"password"} value={resendKey} onChange={e=>setResendKey(e.target.value)}
                placeholder="re_..."
                style={{width:"100%",background:C.hover,border:`1.5px solid ${C.border}`,borderRadius:7,color:C.ink,padding:"9px 40px 9px 12px",fontSize:13,outline:"none",fontFamily:"monospace"}}/>
              <button onClick={()=>setShowResendKey(v=>!v)}
                style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:15,color:C.inkLt}}>
                {showResendKey?"🙈":"👁️"}
              </button>
            </div>
          </div>
          <div>
            <div style={{fontSize:11.5,color:C.inkLt,marginBottom:5}}>E-mail remetente (domínio verificado no Resend)</div>
            <input type="email" value={resendFrom} onChange={e=>setResendFrom(e.target.value)}
              placeholder="contato@thecott.com.br"
              style={{width:"100%",background:C.hover,border:`1.5px solid ${C.border}`,borderRadius:7,color:C.ink,padding:"9px 12px",fontSize:13,outline:"none"}}/>
          </div>
        </div>

        <div style={{display:"flex",gap:8}}>
          <Btn v="gold" onClick={saveResendConfig} disabled={savingResend||!resendKey.trim()||!resendFrom.trim()}>
            {savingResend?"Salvando...":"💾 Salvar"}
          </Btn>
          <Btn v="ghost" onClick={testResendConfig} disabled={!resendKey.trim()}>
            📧 Testar envio
          </Btn>
        </div>
        {testResend==="ok"&&<div style={{marginTop:10,background:C.greenLt,borderRadius:7,padding:"9px 13px",fontSize:13,color:C.green}}>✅ E-mail de teste enviado com sucesso!</div>}
        {testResend==="erro"&&<div style={{marginTop:10,background:"#FFF0F0",borderRadius:7,padding:"9px 13px",fontSize:13,color:C.red}}>❌ Erro. Verifique a chave e o domínio no Resend.</div>}
        
        {!resendKey&&(
          <div style={{marginTop:10,background:C.hover,borderRadius:7,padding:"9px 12px",fontSize:12,color:C.inkMd}}>
            💡 <strong>Como configurar:</strong> Acesse resend.com → crie conta grátis → verifique seu domínio → gere uma API Key → cole acima.
          </div>
        )}
      </Card>

      {/* Como usar */}
      <Card style={{background:C.hover,border:"none"}}>
        <SectionTitle>Como gerar boletos nas vendas</SectionTitle>
        {[
          ["1","Configure e salve as definições acima"],
          ["2","Venda → Pagamento → finalize → clique '🧾 Gerar Boleto'"],
          ["3","O PDF abre automaticamente com código de barras e QR PIX"],
          ["4","Taxa Asaas: R$ 0,99/boleto pago (3 primeiros meses) · R$ 1,99 depois"],
          ["5","Boletos não pagos não geram cobrança"],
        ].map(([n,t])=>(
          <div key={n} style={{display:"flex",gap:10,padding:"6px 0",borderBottom:`1px solid ${C.border}`,alignItems:"flex-start"}}>
            <span style={{minWidth:20,height:20,borderRadius:"50%",background:C.gold,color:"#fff",fontSize:10,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{n}</span>
            <span style={{fontSize:12.5,color:C.inkMd}}>{t}</span>
          </div>
        ))}
      </Card>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

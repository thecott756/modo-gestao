function StockPage({title,loc,stock,setStock,products,addMov,showToast,table,logActivity}){
  const [selProd,setSelProd]=useState(null);
  const [type,setType]=useState("entrada");
  const [qtys,setQtys]=useState({});  // {sz: qty}
  const [obs,setObs]=useState("");
  const [saving,setSaving]=useState(false);
  const [search,setSearch]=useState("");
  const getQty=(pId,sz)=>stock.find(s=>s.pId===pId&&s.sz===sz)?.qty||0;

  const handleSubmit=async()=>{
    if(!selProd){showToast("Selecione um produto","error");return;}
    const entries=Object.entries(qtys).filter(([sz,q])=>Number(q)>0);
    if(entries.length===0){showToast("Informe ao menos uma quantidade","error");return;}
    setSaving(true);
    try{
      for(const [sz,q] of entries){
        const qty=Number(q);
        const pId=selProd.id;
        const cur=getQty(pId,sz);
        if(type==="saida"&&qty>cur){showToast(`Estoque insuficiente: ${sz}`,"error");continue;}
        const newQty=cur+(type==="entrada"?qty:-qty);
        const existing=stock.find(s=>s.pId===pId&&s.sz===sz);
        if(existing?._id){await sb.from(table).update({qty:newQty}).eq("id",existing._id);}
        else{const{data}=await sb.from(table).insert({product_id:pId,size:sz,qty:newQty}).select().single();
          if(data)setStock(prev=>[...prev,{pId,sz,qty:newQty,_id:data.id}]);}
        setStock(prev=>{const idx=prev.findIndex(s=>s.pId===pId&&s.sz===sz);
          if(idx>=0){const u=[...prev];u[idx]={...u[idx],qty:newQty};return u;}return prev;});
        await addMov({type,loc,desc:`${selProd.name} – Tam ${sz} – ${qty} un.`,obs});
      }
      const total=entries.reduce((a,[,q])=>a+Number(q),0);
      await logActivity(type==="entrada"?"entrada_estoque":"saida_estoque",`${selProd.name} · ${total} un. · ${title}`);
      showToast(`${type==="entrada"?"Entrada":"Saída"} registrada! (${total} peças)`);
      setSelProd(null);setQtys({});setObs("");
    }catch(e){showToast("Erro: "+e.message,"error");}
    setSaving(false);
  };

  const filtered=[...products].sort((a,b)=>a.name.localeCompare(b.name))
    .filter(p=>p.name.toLowerCase().includes(search.toLowerCase())||p.sku?.toLowerCase().includes(search.toLowerCase()));

  return(
    <div className="fu">
      <PageHeader title={"Estoque — "+title} sub={stock.reduce((a,b)=>a+b.qty,0)+" peças total"}/>

      <div style={{display:"grid",gridTemplateColumns:"1fr 380px",gap:16,alignItems:"start"}}>

        {/* LEFT — product list */}
        <div>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar produto..."
            style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:7,color:C.ink,padding:"9px 14px",fontSize:13.5,outline:"none",width:"100%",marginBottom:14,boxSizing:"border-box"}}/>
          <div style={{display:"grid",gap:8}}>
            {filtered.map(p=>{
              const ps=stock.filter(s=>s.pId===p.id);
              const total=ps.reduce((a,b)=>a+b.qty,0);
              const sel=selProd?.id===p.id;
              return(
                <div key={p.id} onClick={()=>{setSelProd(p);setQtys({});}}
                  style={{background:sel?C.goldLt:C.surface,border:`1.5px solid ${sel?C.gold:C.border}`,borderRadius:10,padding:"12px 16px",cursor:"pointer",transition:"all .12s"}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:sel?10:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <Thumb p={p} size={38}/>
                      <div>
                        <div style={{fontWeight:600,fontSize:14}}>{p.name}</div>
                        <div style={{fontSize:11.5,color:C.inkLt}}>{p.sku}{p.color?" · "+p.color:""}</div>
                      </div>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div className="cor" style={{fontSize:20,color:total<=5?C.red:C.gold,fontWeight:700}}>{total}</div>
                      <div style={{fontSize:10,color:C.inkFt}}>peças</div>
                    </div>
                  </div>
                  {/* Size chips — always visible */}
                  <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:6}}>
                    {ps.sort((a,b)=>a.sz.localeCompare(b.sz,undefined,{numeric:true})).map(s=>(
                      <div key={s.sz} style={{textAlign:"center",background:s.qty<=3?"#FFF0F0":C.hover,border:`1px solid ${s.qty<=3?C.red:C.border}`,borderRadius:6,padding:"3px 9px",minWidth:44}}>
                        <div style={{fontSize:9,color:C.inkFt,letterSpacing:.3}}>{s.sz}</div>
                        <div style={{fontWeight:700,color:s.qty<=3?C.red:C.ink,fontSize:15}}>{s.qty}</div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* RIGHT — entry/exit panel */}
        <div style={{position:"sticky",top:20}}>
          {!selProd?(
            <Card style={{textAlign:"center",padding:40,color:C.inkFt}}>
              <div style={{fontSize:32,marginBottom:10}}>👆</div>
              <div style={{fontSize:14}}>Selecione um produto ao lado para registrar entrada ou saída</div>
            </Card>
          ):(
            <Card>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,padding:"10px 14px",background:C.hover,borderRadius:8}}>
                <Thumb p={selProd} size={36}/>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:14}}>{selProd.name}</div>
                  <div style={{fontSize:11.5,color:C.inkLt}}>{selProd.sku}</div>
                </div>
                <button onClick={()=>{setSelProd(null);setQtys({});}} style={{background:"none",border:"none",cursor:"pointer",color:C.inkLt,fontSize:18}}>×</button>
              </div>

              {/* Entrada / Saída toggle */}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
                {[["entrada","✅ Entrada","green"],["saida","📤 Saída","red"]].map(([val,lbl,col])=>(
                  <button key={val} onClick={()=>setType(val)} style={{padding:"10px",borderRadius:8,border:`1.5px solid ${type===val?C[col]:C.border}`,background:type===val?C[col+"Lt"]:"transparent",color:type===val?C[col]:C.inkMd,cursor:"pointer",fontWeight:600,fontSize:13.5}}>
                    {lbl}
                  </button>
                ))}
              </div>

              {/* Shopify-style variant table */}
              <div style={{marginBottom:12}}>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 80px",gap:6,padding:"6px 8px",background:C.hover,borderRadius:6,marginBottom:6}}>
                  <div style={{fontSize:10.5,fontWeight:700,color:C.inkLt,letterSpacing:.5}}>TAMANHO</div>
                  <div style={{fontSize:10.5,fontWeight:700,color:C.inkLt,letterSpacing:.5}}>ATUAL</div>
                  <div style={{fontSize:10.5,fontWeight:700,color:C.inkLt,letterSpacing:.5}}>{type==="entrada"?"ENTRADA":"SAÍDA"}</div>
                </div>
                {selProd.sizes?.map(sz=>{
                  const cur=getQty(selProd.id,sz);
                  const q=Number(qtys[sz]||0);
                  const after=type==="entrada"?cur+q:cur-q;
                  return(
                    <div key={sz} style={{display:"grid",gridTemplateColumns:"1fr 1fr 80px",gap:6,alignItems:"center",padding:"5px 8px",borderBottom:`1px solid ${C.border}`}}>
                      <div style={{fontWeight:700,fontSize:15,color:C.ink}}>{sz}</div>
                      <div style={{fontSize:13,color:cur<=3?C.red:C.inkMd}}>
                        {cur}
                        {q>0&&<span style={{marginLeft:6,fontSize:11,color:type==="entrada"?C.green:C.red,fontWeight:600}}>→ {after}</span>}
                      </div>
                      <input type="number" min="0" value={qtys[sz]||""} placeholder="0"
                        onChange={e=>setQtys(prev=>({...prev,[sz]:e.target.value}))}
                        onFocus={e=>e.target.select()}
                        style={{width:"100%",background:C.surface,border:`1px solid ${q>0?(type==="entrada"?C.green:C.red):C.border}`,borderRadius:5,color:C.ink,padding:"6px 8px",fontSize:14,fontWeight:q>0?700:400,outline:"none",textAlign:"center"}}/>
                    </div>
                  );
                })}
                <div style={{marginTop:8,padding:"6px 8px",background:C.hover,borderRadius:6,display:"flex",justifyContent:"space-between",fontSize:12.5,color:C.inkMd}}>
                  <span>Total a {type==="entrada"?"entrar":"sair"}:</span>
                  <strong style={{color:type==="entrada"?C.green:C.red}}>{Object.values(qtys).reduce((a,q)=>a+Number(q||0),0)} peças</strong>
                </div>
              </div>

              <Fld label="Observação (opcional)" value={obs} onChange={setObs} placeholder="Ex: NF 1234, fornecedor..."/>
              <Btn onClick={handleSubmit} v={type==="entrada"?"success":"danger"} full sz="lg" disabled={saving}>
                {saving?"Salvando...":(type==="entrada"?"✅ Confirmar Entrada":"📤 Confirmar Saída")}
              </Btn>
            </Card>
          )}
        </div>
      </div>
    </div>
  );
}

// ── TRANSFER ───────────────────────────────────────────────────────────────
function Transfer({stkG,setStkG,stkL,setStkL,products,addMov,showToast,logActivity}){
  const [dir,setDir]=useState("g2l");
  const [sP,setSP]=useState("");const [sSz,setSSz]=useState("");const [qty,setQty]=useState(1);const [obs,setObs]=useState("");
  const product=products.find(p=>p.id===Number(sP));
  const src=dir==="g2l"?stkG:stkL;
  const available=src.find(s=>s.pId===Number(sP)&&s.sz===sSz)?.qty||0;

  const handle=async()=>{
    if(!sP||!sSz||qty<1){showToast("Preencha todos os campos","error");return;}
    if(qty>available){showToast("Estoque insuficiente!","error");return;}
    const pId=Number(sP);const isG2L=dir==="g2l";
    const updateSide=async(stock,setStock,table,sign)=>{
      const s=stock.find(x=>x.pId===pId&&x.sz===sSz);
      const newQty=Math.max(0,(s?.qty||0)+sign*qty);
      if(s?._id)await sb.from(table).update({qty:newQty}).eq("id",s._id);
      else{const{data}=await sb.from(table).insert({product_id:pId,size:sSz,qty:newQty}).select().single();
        if(data)setStock(prev=>[...prev,{pId,sz:sSz,qty:newQty,_id:data.id}]);}
      setStock(prev=>{const idx=prev.findIndex(x=>x.pId===pId&&x.sz===sSz);
        if(idx>=0){const u=[...prev];u[idx]={...u[idx],qty:newQty};return u;}return prev;});
    };
    await updateSide(stkG,setStkG,"stock_galpao",isG2L?-1:1);
    await updateSide(stkL,setStkL,"stock_loja",isG2L?1:-1);
    await addMov({type:"transferência",loc:"ambos",desc:`${product.name} – ${sSz} – ${qty} un. (${isG2L?"Galpão→Loja":"Loja→Galpão"})`,obs});
    await logActivity("transferencia",`${product.name} Tam ${sSz} · ${qty} un. · ${isG2L?"Galpão→Loja":"Loja→Galpão"}`);
    showToast("Transferência realizada!");setSP("");setSSz("");setQty(1);setObs("");
  };

  return(
    <div className="fu">
      <PageHeader title="Transferência" sub="Mova mercadorias entre Galpão e Loja"/>
      <div style={{maxWidth:500}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
          {[["g2l","🏭  Galpão → Loja"],["l2g","👗  Loja → Galpão"]].map(([val,lbl])=>(
            <button key={val} onClick={()=>setDir(val)} style={{padding:"14px",borderRadius:9,border:`1.5px solid ${dir===val?C.gold:C.border}`,background:dir===val?C.goldLt:"transparent",color:dir===val?C.gold:C.inkMd,cursor:"pointer",fontWeight:500,fontSize:14}}>{lbl}</button>
          ))}
        </div>
        <Card>
          <Fld label="Produto" value={sP} onChange={v=>{setSP(v);setSSz("");}} required
            options={[{value:"",label:"Selecione..."},...products.map(p=>({value:p.id,label:`${p.name} (${p.sku})`}))]}/>
          {product&&<Fld label="Tamanho" value={sSz} onChange={setSSz} required
            options={[{value:"",label:"Selecione..."},...product.sizes.map(s=>{const q=src.find(x=>x.pId===product.id&&x.sz===s)?.qty||0;return{value:s,label:`${s} — ${q} disponíveis`};})]}/>}
          <Fld label="Quantidade" value={qty} onChange={v=>setQty(Number(v))} type="number" required/>
          <Fld label="Observação" value={obs} onChange={setObs} placeholder="Motivo..."/>
          {sSz&&<div style={{marginBottom:14,padding:"9px 13px",background:C.hover,borderRadius:7,fontSize:13,color:C.inkMd}}>Disponível: <strong style={{color:C.ink}}>{available} peças</strong></div>}
          <Btn onClick={handle} full sz="lg">Confirmar Transferência ⇌</Btn>
        </Card>
      </div>
    </div>
  );
}

// ── NF-e ───────────────────────────────────────────────────────────────────
function NFe({sales,clients,issuedNFe,nfeConfig,saveNfeConfig,showToast,emitirNFe,logActivity}){
  const [selSale,setSelSale]=useState("");
  const [cfg,setCfg]=useState(nfeConfig);
  const [activeTab,setActiveTab]=useState("config");
  useEffect(()=>setCfg(nfeConfig),[nfeConfig]);
  const sale=sales.find(s=>s.id===selSale);
  const client=clients.find(c=>c.id===(sale?.client_id||sale?.clientId));
  const saveCfg=async()=>{await saveNfeConfig(cfg);showToast("Configuração salva!");};
  const emitir=async()=>{
    if(!selSale){showToast("Selecione uma venda","error");return;}
    if(!cfg.cnpj||!cfg.razaoSocial){showToast("Configure CNPJ e Razão Social","error");return;}
    await emitirNFe(sale,client);
    await logActivity("nfe_emitida",`Venda ${selSale} — ${fmt(sale?.total)}`);
    showToast("NF-e emitida!");setSelSale("");
  };
  return(
    <div className="fu">
      <PageHeader title="NF-e" sub="Nota Fiscal Eletrônica modelo 55"/>
      <InlineTabs tabs={[{id:"config",label:"Configuração"},{id:"emitir",label:"Emitir NF-e"},{id:"historico",label:"Histórico"}]} active={activeTab} onChange={setActiveTab}/>
      {activeTab==="config"&&(
        <Card style={{maxWidth:560}}>
          <Fld label="CNPJ" value={cfg.cnpj} onChange={v=>setCfg(f=>({...f,cnpj:v}))} placeholder="00.000.000/0001-00" required/>
          <Fld label="Razão Social" value={cfg.razaoSocial} onChange={v=>setCfg(f=>({...f,razaoSocial:v}))} required/>
          <Fld label="Inscrição Estadual" value={cfg.ie} onChange={v=>setCfg(f=>({...f,ie:v}))}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
            <Fld label="UF" value={cfg.uf} onChange={v=>setCfg(f=>({...f,uf:v}))}
              options={["SP","RJ","MG","RS","PR","SC","BA","PE","CE","GO","MT","MS","ES","AM","PA","MA","PI","AL","SE","RN","PB","TO","RO","AC","AP","RR","DF"]}/>
            <Fld label="CRT" value={cfg.crt} onChange={v=>setCfg(f=>({...f,crt:v}))}
              options={[{value:"1",label:"1-Simples"},{value:"2",label:"2-Excesso"},{value:"3",label:"3-Normal"}]}/>
            <Fld label="Série" value={cfg.serie} onChange={v=>setCfg(f=>({...f,serie:v}))}/>
          </div>
          <Fld label="Ambiente" value={cfg.ambiente} onChange={v=>setCfg(f=>({...f,ambiente:v}))}
            options={[{value:"homologacao",label:"Homologação (teste)"},{value:"producao",label:"Produção (válido fiscalmente)"}]}/>
          {cfg.ambiente==="producao"&&<div style={{marginBottom:14,padding:"9px 13px",background:"#FFF3CD",borderRadius:7,fontSize:12.5,color:"#856404"}}>⚠️ Ambiente de produção — NF-es terão validade fiscal.</div>}
          <Btn onClick={saveCfg} full sz="lg">Salvar Configuração</Btn>
        </Card>
      )}
      {activeTab==="emitir"&&(
        <Card style={{maxWidth:560}}>
          <Fld label="Selecionar venda" value={selSale} onChange={setSelSale}
            options={[{value:"",label:"Selecione uma venda..."},...sales.filter(s=>!s.withNFe&&!s.with_nfe).map(s=>({value:s.id,label:`${s.clientName} — ${fmt(s.total)} — ${fmtDS(s.date)}`}))]}
            note="Apenas vendas sem NF-e emitida"/>
          {sale&&<div style={{marginBottom:14,padding:"11px 14px",background:C.hover,borderRadius:8,fontSize:13,color:C.inkMd}}>
            <div><strong>Cliente:</strong> {sale.clientName}{client?.cpf_cnpj?` · ${client.cpf_cnpj}`:""}</div>
            <div><strong>Total:</strong> {fmt(sale.total)} · {sale.items?.length} item(s)</div>
          </div>}
          <Btn onClick={emitir} full sz="lg">Emitir NF-e →</Btn>
        </Card>
      )}
      {activeTab==="historico"&&(
        <div>
          {issuedNFe.length===0?<Card style={{textAlign:"center",color:C.inkFt,padding:40}}>Nenhuma NF-e emitida.</Card>
            :issuedNFe.map(n=>(
              <Card key={n.id} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <div style={{fontWeight:600,fontSize:14}}>NF-e nº {n.numero} · Série {n.serie}</div>
                  <Badge color={n.ambiente==="producao"?C.green:C.gold}>{n.ambiente==="producao"?"Autorizada":"Homologação"}</Badge>
                </div>
                <div style={{fontSize:12.5,color:C.inkMd,marginBottom:4}}>{n.clientName} · {fmt(n.total)} · {fmtDS(n.date)}</div>
                <div style={{fontSize:10,color:C.inkFt,fontFamily:"monospace",wordBreak:"break-all",marginBottom:8}}>{n.chave}</div>
                <div style={{display:"flex",gap:8}}>
                  <Btn v="ghost" sz="sm">📄 DANFE</Btn>
                  <Btn v="ghost" sz="sm">📁 XML</Btn>
                </div>
              </Card>
            ))}
        </div>
      )}
    </div>
  );
}

// ── ATIVIDADES ─────────────────────────────────────────────────────────────
function Atividades({activities}){
  const actionLabel={
    "venda":"💰 Venda","entrada_estoque":"📦 Entrada","saida_estoque":"📤 Saída",
    "transferencia":"⇌ Transferência","cliente_cadastrado":"👤 Cliente",
    "produto_cadastrado":"🏷️ Produto","nfe_emitida":"📋 NF-e","logout":"🚪 Saída"
  };
  const actionColor={
    "venda":C.green,"entrada_estoque":C.blue,"saida_estoque":C.red,
    "transferencia":C.gold,"cliente_cadastrado":C.purple,
    "produto_cadastrado":C.inkMd,"nfe_emitida":C.gold,"logout":C.inkFt
  };
  return(
    <div className="fu">
      <PageHeader title="Registro de Atividades" sub={`${activities.length} registros`}/>
      {activities.length===0?<Card style={{textAlign:"center",color:C.inkFt,padding:40}}>Nenhuma atividade registrada.</Card>
        :<Card>
          {activities.map((a,i)=>(
            <div key={a.id||i} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderBottom:`1px solid ${C.border}`}}>
              <div style={{width:80,flexShrink:0}}>
                <Badge color={actionColor[a.action]||C.inkMd}>{actionLabel[a.action]||a.action}</Badge>
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:13.5,color:C.ink}}>{a.detail}</div>
                <div style={{fontSize:11,color:C.inkLt}}>{a.username} · {fmtD(a.date)}</div>
              </div>
            </div>
          ))}
        </Card>}
    </div>
  );
}

// ── DASHBOARD ──────────────────────────────────────────────────────────────
function Dashboard({products,stkG,stkL,movements,sales}){
  const tG=stkG.reduce((a,b)=>a+b.qty,0);const tL=stkL.reduce((a,b)=>a+b.qty,0);
  const tV=sales.reduce((a,b)=>a+(b.total||0),0);
  const hoje=sales.filter(s=>new Date(s.date).toDateString()===new Date().toDateString());
  const tHoje=hoje.reduce((a,b)=>a+(b.total||0),0);
  const cards=[
    {l:"Peças Galpão",v:tG,icon:"🏭",cl:C.gold},
    {l:"Peças Loja",v:tL,icon:"👗",cl:C.blue},
    {l:"Total Vendas",v:fmt(tV),icon:"💰",cl:C.green},
    {l:"Vendas Hoje",v:fmt(tHoje),icon:"🛒",cl:C.purple},
  ];
  return(
    <div className="fu">
      <PageHeader title="Dashboard" sub={new Date().toLocaleDateString("pt-BR",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}/>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:14,marginBottom:28}}>
        {cards.map(c=>(
          <Card key={c.l} style={{borderLeft:`3px solid ${c.cl}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div style={{fontSize:10.5,color:C.inkLt,marginBottom:8,letterSpacing:.5,textTransform:"uppercase"}}>{c.l}</div>
                <div className="cor" style={{fontSize:30,fontWeight:400,color:c.cl}}>{c.v}</div>
              </div>
              <span style={{fontSize:24,opacity:.1}}>{c.icon}</span>
            </div>
          </Card>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
        <Card>
          <SectionTitle>Últimas Movimentações</SectionTitle>
          {movements.length===0?<div style={{color:C.inkFt,fontSize:13}}>Nenhuma movimentação.</div>
            :movements.slice(0,8).map(m=>(
              <div key={m.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${C.border}`}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <Badge color={m.type==="entrada"?C.green:m.type==="saida"?C.red:C.blue}>{m.type}</Badge>
                  <span style={{fontSize:12.5,color:C.inkMd}}>{m.descricao||m.desc}</span>
                </div>
                <span style={{fontSize:11,color:C.inkFt,flexShrink:0}}>{m.user}</span>
              </div>
            ))}
        </Card>
        <Card>
          <SectionTitle>Últimas Vendas</SectionTitle>
          {sales.length===0?<div style={{color:C.inkFt,fontSize:13}}>Nenhuma venda.</div>
            :sales.slice(0,8).map(s=>(
              <div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${C.border}`}}>
                <div>
                  <span style={{fontWeight:500,fontSize:13}}>{s.clientName||"Avulso"}</span>
                  <span style={{color:C.inkLt,marginLeft:6,fontSize:12}}>{s.items?.length} item(s)</span>
                </div>
                <span style={{color:C.green,fontWeight:600,fontSize:13}}>{fmt(s.total)}</span>
              </div>
            ))}
        </Card>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

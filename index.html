// ── BARCODE ────────────────────────────────────────────────────────────────
function encodeCode128(text){
  const P={103:"11010000100",104:"11010010000",105:"11010011100",
    0:"11011001100",1:"11001101100",2:"11001100110",3:"10010011000",4:"10010001100",
    5:"10001001100",6:"10011001000",7:"10011000100",8:"10001100100",9:"11001001000",
    10:"11001000100",11:"11000100100",12:"10110011100",13:"10011011100",14:"10011001110",
    15:"10111001100",16:"10011101100",17:"10011100110",18:"11001110010",19:"11001011100",
    20:"11001001110",21:"11011100100",22:"11001110100",23:"11101101110",24:"11101001100",
    25:"11100101100",26:"11100100110",27:"11101100100",28:"11100110100",29:"11100110010",
    30:"11011011000",31:"11011000110",32:"11000110110",33:"10100011000",34:"10001011000",
    35:"10001000110",36:"10110001000",37:"10001101000",38:"10001100010",39:"11010001000",
    40:"11000101000",41:"11000100010",42:"10110111000",43:"10110001110",44:"10001101110",
    45:"10111011000",46:"10111000110",47:"10001110110",48:"11101110110",49:"11010001110",
    50:"11000101110",51:"11011101000",52:"11011100010",53:"11011101110",54:"11101011000",
    55:"11101000110",56:"11100010110",57:"11101101000",58:"11101100010",59:"11100011010",
    60:"11101111010",61:"11001000010",62:"11110001010",63:"10100110000",64:"10100001100",
    65:"10010110000",66:"10010000110",67:"10000101100",68:"10000100110",69:"10110010000",
    70:"10110000100",71:"10011010000",72:"10011000010",73:"10000110100",74:"10000110010",
    75:"11000010010",76:"11001010000",77:"11110111010",78:"11000010100",79:"10001111010",
    80:"10100111100",81:"10010111100",82:"10010011110",83:"10111100100",84:"10011110100",
    85:"10011110010",86:"11110100100",87:"11110010100",88:"11110010010",89:"11011011110",
    90:"11011110110",91:"11110110110",92:"10101111000",93:"10100011110",94:"10001011110",
    95:"10111101000",96:"10111100010",97:"11110101000",98:"11110100010",99:"10111011110",
    100:"10111101110",101:"11101011110",102:"11110101110",106:"1100011101011"};
  const START_B=104;
  const data=[START_B,...text.split("").map(c=>c.charCodeAt(0)-32)];
  let check=START_B;
  for(let i=1;i<data.length;i++)check=(check+data[i]*i)%103;
  data.push(check,106);
  return data.map(v=>P[v]||"").join("");
}
function Barcode({value,width=220,height=52}){
  const ref=useRef();
  useEffect(()=>{
    const c=ref.current;if(!c)return;
    const bars=encodeCode128(value);
    const bw=Math.max(1,Math.floor(width/bars.length));
    c.width=bw*bars.length;c.height=height+16;
    const ctx=c.getContext("2d");
    ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
    for(let i=0;i<bars.length;i++){ctx.fillStyle=bars[i]==="1"?"#000":"#fff";ctx.fillRect(i*bw,0,bw,height);}
    ctx.fillStyle="#000";ctx.font="10px monospace";ctx.textAlign="center";
    ctx.fillText(value,c.width/2,height+13);
  },[value,width,height]);
  return <canvas ref={ref} style={{display:"block",maxWidth:"100%"}}/>;
}

  useEffect(()=>{
    const touch=()=>{lastActivity.current=Date.now();};
    ["mousemove","mousedown","keydown","touchstart","scroll"].forEach(e=>window.addEventListener(e,touch,{passive:true}));
    return()=>["mousemove","mousedown","keydown","touchstart","scroll"].forEach(e=>window.removeEventListener(e,touch));

        setUser(null);setChannel(null);

  useEffect(()=>{if(user){loadAll();setTab("dashboard");}

  const addMov=async(data)=>{
    const mv={id:uid(),date:new Date().toISOString(),type:data.type,loc:data.loc,descricao:data.desc,obs:data.obs||"",username:user?.name};
    setMovements(p=>[mv,...p]);
    try{await sb.from("movements").insert(mv);}catch(e){}
  };

  const saveNfeConfig=async(cfg)=>{
    setNfeConfigState(cfg);
    try{await sb.from("nfe_config").upsert({id:1,cnpj:cfg.cnpj,ie:cfg.ie,razao_social:cfg.razaoSocial,uf:cfg.uf,crt:cfg.crt,ambiente:cfg.ambiente,serie:cfg.serie,next_num:cfg.nextNum});}catch(e){}
  };

  const emitirNFe=async(sale,client)=>{
    const nfe={
      id:uid(),sale_id:sale.id,date:new Date().toISOString(),
      chave:`35${new Date().getFullYear()}${(nfeConfig.cnpj||"").replace(/\D/g,"").padStart(14,"0")}55${nfeConfig.serie.padStart(3,"0")}${String(nfeConfig.nextNum).padStart(9,"0")}`.substr(0,44),
      numero:String(nfeConfig.nextNum).padStart(6,"0"),
      serie:nfeConfig.serie,ambiente:nfeConfig.ambiente,status:"autorizada",
      total:sale.total,client_name:sale.clientName,client_cpf:client?.cpf||"",emitente:nfeConfig.razaoSocial,
    };
    try{await sb.from("issued_nfe").insert(nfe);}catch(e){}
    const newCfg={...nfeConfig,nextNum:nfeConfig.nextNum+1};
    await saveNfeConfig(newCfg);
    setIssuedNFe(p=>[{...nfe,clientName:nfe.client_name,clientCpf:nfe.client_cpf},...p]);
    return nfe;
  };

  if(!user)return <Login onLogin={handleLogin}/>;

  // Channel selector screen
  const availChannels=CHANNELS.filter(ch=>(ROLE_CHANNELS[user.role]||[]).includes(ch.id));
  if(!channel){
    return(
      <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{width:480,textAlign:"center"}}>
          <div style={{marginBottom:32}}>
            <div className="cor" style={{fontSize:42,letterSpacing:3,color:C.ink}}>MODO</div>
            <div style={{fontSize:10,letterSpacing:4,color:C.inkFt,fontWeight:600,marginTop:2}}>GESTÃO FASHION</div>
          </div>
          <div style={{fontSize:13,color:C.inkLt,marginBottom:24}}>Olá, <strong>{user.name}</strong>. Selecione o ponto de venda:</div>
          <div style={{display:"grid",gridTemplateColumns:availChannels.length===1?"1fr":"1fr 1fr",gap:16,marginBottom:32}}>
            {availChannels.map(ch=>(
              <button key={ch.id} onClick={()=>{setChannel(ch.id);loadAll();}}
                style={{padding:"32px 20px",borderRadius:16,border:`2px solid ${C.border}`,background:C.surface,cursor:"pointer",textAlign:"center",transition:"all .2s"}}
                onMouseEnter={e=>{e.currentTarget.style.borderColor=ch.color;e.currentTarget.style.background=ch.color+"18";e.currentTarget.style.transform="translateY(-3px)";}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.background=C.surface;e.currentTarget.style.transform="";}}>
                <div style={{fontSize:44,marginBottom:14}}>{ch.icon}</div>
                <div style={{fontWeight:700,fontSize:18,color:C.ink,marginBottom:6}}>{ch.label}</div>
                <div style={{fontSize:12,color:C.inkLt}}>{ch.id==="galpao"?"Venda Galpão · Online":"Venda Balcão · WhatsApp"}</div>
              </button>
            ))}
          </div>
          <button onClick={handleLogout} style={{background:"none",border:"none",color:C.inkLt,fontSize:12,cursor:"pointer"}}>← Sair</button>
        </div>
        <Toast msg={toast.msg} type={toast.type}/>
      </div>
    );
  }

  const curChannel=CHANNELS.find(c=>c.id===channel)||CHANNELS[0];

  const NAV=[
    {id:"dashboard",  label:"Início",        icon:"⌂"},
    {id:"pdv",        label:"Venda",         icon:"◉"},
    {id:"clientes",   label:"Clientes",      icon:"◎"},
    {id:"galpao",     label:"Est. Galpão",   icon:"◧"},
    {id:"loja",       label:"Est. Loja",     icon:"◨"},
    {id:"transfer",   label:"Transferência", icon:"⇌"},
    {id:"produtos",   label:"Produtos",      icon:"◻"},
    {id:"vendas",     label:"Vendas",        icon:"◈"},
    {id:"devolucoes", label:"Devoluções",    icon:"↩"},
    {id:"etiquetas",  label:"Etiquetas",     icon:"⊟"},
    {id:"nfe",        label:"NF-e",          icon:"⊞"},
    {id:"atividades", label:"Atividades",    icon:"◷"},

  ].filter(n=>{
    // Must be in role tabs AND in channel tabs
    const inRole=ROLE_TABS[user.role]?.includes(n.id);
    const inChannel=curChannel.tabs.includes(n.id);
    // Stock pages: filter by channel
    if(n.id==="galpao"){
      if(channel==="centro")return false;
      return inRole;
    }
    if(n.id==="loja"){
      if(channel==="galpao")return false;
      return inRole;
    }
    // Config always visible for admin/gerente
    if(n.id==="config")return user.role==="admin"||user.role==="gerente";
    return inRole&&inChannel;
  });

  return(
    <div className="app-layout" style={{display:"flex",minHeight:"100vh",background:C.bg}}>
      {/* SIDEBAR */}
      <aside className="sidebar no-print" style={{width:200,background:C.surface,borderRight:`1px solid ${C.border}`,
        position:"fixed",top:0,left:0,bottom:0,zIndex:100,display:"flex",flexDirection:"column",overflowY:"auto"}}>
        <div style={{padding:"16px 16px 10px"}}>
          <div className="cor" style={{fontSize:26,fontWeight:500,color:C.ink,letterSpacing:1}}>MODO</div>
          <div style={{fontSize:8,color:C.inkFt,fontWeight:600,letterSpacing:3,marginTop:1}}>GESTÃO FASHION</div>
          <div style={{marginTop:8,padding:"6px 10px",borderRadius:8,background:curChannel.color+"20",border:`1px solid ${curChannel.color}40`,display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:14}}>{curChannel.icon}</span>
            <div style={{flex:1,overflow:"hidden"}}>
              <div style={{fontSize:10,fontWeight:700,color:curChannel.color,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{curChannel.label}</div>
            </div>
          </div>
        </div>
        <HR m="0 14px 8px"/>
        <nav style={{flex:1,padding:"0 8px"}}>
          {NAV.map(n=>(
            <button key={n.id} onClick={()=>setTab(n.id)} style={{
              width:"100%",textAlign:"left",padding:"9px 12px",borderRadius:7,border:"none",
              background:tab===n.id?C.hover:"transparent",color:tab===n.id?C.ink:C.inkMd,
              cursor:"pointer",fontSize:13,fontWeight:tab===n.id?600:400,
              display:"flex",alignItems:"center",gap:10,marginBottom:1,transition:"all .12s",
              borderLeft:tab===n.id?`3px solid ${C.gold}`:"3px solid transparent",

          ))}
        </nav>
        <div style={{padding:"10px 14px",borderTop:`1px solid ${C.border}`}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
            <div>
              <div style={{fontSize:12,fontWeight:600,color:C.ink}}>{user.name}</div>
              <div style={{fontSize:10,color:C.inkLt,textTransform:"capitalize"}}>{user.role}</div>
            </div>
            {(user.role==="admin"||user.role==="gerente")&&(
              <button onClick={()=>setTab("config")} title="Configurações"
                style={{width:30,height:30,borderRadius:8,border:`1px solid ${C.border}`,background:tab==="config"?C.hover:"transparent",cursor:"pointer",fontSize:16,color:tab==="config"?C.gold:C.inkMd,display:"flex",alignItems:"center",justifyContent:"center"}}>

          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:4}}>

            )}
          </div>
        </div>
      </aside>

      {/* MAIN */}
      <main className="main-content" style={{marginLeft:200,flex:1,padding:"32px 36px 80px",minHeight:"100vh"}}>
        {loading?<Loading/>:<>

          {tab==="pdv"       &&<PDV stkG={stkG} setStkG={setStkG} stkL={stkL} setStkL={setStkL} products={products} clients={clients} setClients={setClients} setSales={setSales} addMov={addMov} showToast={showToast} user={user} logActivity={logActivity} channel={channel} curChannel={curChannel}/>}
          {tab==="clientes"  &&<Clients clients={clients} setClients={setClients} sales={sales} showToast={showToast} logActivity={logActivity}/>}
          {tab==="galpao"    &&<StockPage title="Galpão" loc="galpao" stock={stkG} setStock={setStkG} products={products} addMov={addMov} showToast={showToast} table="stock_galpao" logActivity={logActivity}/>}
          {tab==="loja"      &&<StockPage title="Loja" loc="loja" stock={stkL} setStock={setStkL} products={products} addMov={addMov} showToast={showToast} table="stock_loja" logActivity={logActivity}/>}
          {tab==="transfer"  &&<Transfer stkG={stkG} setStkG={setStkG} stkL={stkL} setStkL={setStkL} products={products} addMov={addMov} showToast={showToast} logActivity={logActivity} channel={channel}/>}
          {tab==="produtos"  &&<Products products={products} setProducts={setProducts} setStkG={setStkG} setStkL={setStkL} sales={sales} showToast={showToast} logActivity={logActivity}/>}
          {tab==="vendas"    &&<Sales sales={sales} setSales={setSales} showToast={showToast} logActivity={logActivity} issuedNFe={issuedNFe} stkG={stkG} setStkG={setStkG} stkL={stkL} setStkL={setStkL} products={products} addMov={addMov} channel={channel}/>}
          {tab==="etiquetas" &&<Labels products={products}/>}
          {tab==="devolucoes"&&<Devolucoes sales={sales} setSales={setSales} products={products} stkG={stkG} setStkG={setStkG} stkL={stkL} setStkL={setStkL} addMov={addMov} showToast={showToast} logActivity={logActivity} channel={channel}/>}
          {tab==="nfe"       &&<NFe sales={sales} clients={clients} issuedNFe={issuedNFe} nfeConfig={nfeConfig} saveNfeConfig={saveNfeConfig} showToast={showToast} emitirNFe={emitirNFe} logActivity={logActivity}/>}
          {tab==="atividades"&&<Atividades activities={activities} channel={channel}/>}
          {tab==="config"    &&<Configuracoes showToast={showToast} user={user}/>}
          {(tab==="dashboard"||tab==="inicio") &&<Dashboard products={products} stkG={stkG} stkL={stkL} movements={movements} sales={sales} activities={activities} channel={channel} setSales={setSales} showToast={showToast} logActivity={logActivity} addMov={addMov} clients={clients} setTab={setTab}/>}
        </>}
      </main>
      <Toast msg={toast.msg} type={toast.type}/>
    </div>
  );
}

// ── LOGIN ──────────────────────────────────────────────────────────────────
function Login({onLogin}){
  const [login,setLogin]=useState("");const [pw,setPw]=useState("");const [err,setErr]=useState("");
  const go=()=>{const u=USERS.find(u=>u.login===login&&u.pw===pw);if(u)onLogin(u);else setErr("Usuário ou senha incorretos.");};
  return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex"}}>
      <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:32}}>
        <div style={{maxWidth:360,width:"100%"}} className="fu">
          <div className="cor" style={{fontSize:52,fontWeight:300,color:C.ink,marginBottom:2,letterSpacing:2}}>MODO</div>
          <div style={{fontSize:11,color:C.inkLt,letterSpacing:3,marginBottom:40,textTransform:"uppercase"}}>Gestão Fashion</div>
          <Fld label="Usuário" value={login} onChange={setLogin} placeholder="usuario" onKeyDown={e=>e.key==="Enter"&&go()}/>
          <Fld label="Senha" value={pw} onChange={setPw} type="password" placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&go()}/>
          {err&&<div style={{color:C.red,fontSize:13,marginBottom:12,padding:"8px 12px",background:C.redLt,borderRadius:6}}>{err}</div>}
          <button onClick={go} style={{width:"100%",background:"#1A1714",color:"#FFFFFF",border:"none",
            padding:"14px",borderRadius:7,fontWeight:600,fontSize:15,cursor:"pointer",letterSpacing:.5,marginBottom:20}}>
            Entrar
          </button>
        </div>
      </div>
      <div style={{width:"40%",background:`linear-gradient(155deg,${C.goldLt} 0%,#EDE8E2 55%,#E0D8D0 100%)`,
        display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:20,padding:40}}>
        <div className="cor" style={{fontSize:72,opacity:.08,lineHeight:1}}>✦</div>
        <div className="cor" style={{fontSize:18,color:C.inkMd,textAlign:"center",lineHeight:2,fontStyle:"italic"}}>
          "Gestão elegante para<br/>marcas que prezam<br/>pela excelência."
        </div>
      </div>
    </div>
  );
}

  const [paid,setPaid]=useState(0);
  const [receipt,setReceipt]=useState(null);
  const [wpPhone,setWpPhone]=useState("");
  const [wpEmail,setWpEmail]=useState("");
  const [freight,setFreight]=useState({cep:"",service:"pac",price:0,calc:false});
  const [saving,setSaving]=useState(false);
  const [printed,setPrinted]=useState(false);
  const [payStep,setPayStep]=useState(0);   // payment wizard step
  const [payments,setPayments]=useState([]); // [{method, amount}]
  const [payAmt,setPayAmt]=useState("");     // current payment amount input
  const [pickerProd,setPickerProd]=useState(null);
  const [pickerSz,setPickerSz]=useState(null);
  const [pickerQty,setPickerQty]=useState(1);
  const [gradeQty,setGradeQty]=useState(1); // how many grades to add at once
  const [boletoStep,setBoletoStep]=useState(false);
  const [boletoQtd,setBoletoQtd]=useState(1);
  const [boletoMulta,setBoletoMulta]=useState(5);
  const [boletoJuros,setBoletoJuros]=useState(2);
  const [gerandoBoleto,setGerandoBoleto]=useState(false);
  const [offlineMode,setOfflineMode]=useState(false);
  const [hasDraft,setHasDraft]=useState(false);
  const DRAFT_KEY="modo_cart_draft_"+channel;
  const [prodSearch,setProdSearch]=useState("");

  const isWholesale=selClient&&selClient.type==="wholesale";

  // ── OFFLINE: monitor connection ──
  useEffect(()=>{
    const on=()=>setOfflineMode(false);
    const off=()=>setOfflineMode(true);
    window.addEventListener("online",on);
    window.addEventListener("offline",off);
    setOfflineMode(!navigator.onLine);
    return()=>{window.removeEventListener("online",on);window.removeEventListener("offline",off);};
  },[]);

  // ── DRAFT: auto-save cart to localStorage ──
  useEffect(()=>{
    if(cart.length===0&&!selClient&&!saleMode)return;
    try{
      localStorage.setItem(DRAFT_KEY,JSON.stringify({
        cart,selClient,saleMode,appliedPromo,promoCode,
        savedAt:new Date().toISOString()
      }));
    }catch(e){}
  },[cart,selClient,saleMode,appliedPromo]);

  // ── DRAFT: check on mount ──
  useEffect(()=>{
    try{
      const raw=localStorage.getItem(DRAFT_KEY);
      if(raw){const d=JSON.parse(raw);if(d.cart?.length>0||d.selClient)setHasDraft(true);}
    }catch(e){}
  },[]);

  const restoreDraft=()=>{
    try{
      const raw=localStorage.getItem(DRAFT_KEY);
      if(!raw)return;
      const d=JSON.parse(raw);
      if(d.cart?.length>0){setCart(d.cart);}
      if(d.selClient){setSelClient(d.selClient);setClientMode("cadastrado");}
      if(d.saleMode){setSaleMode(d.saleMode);}
      if(d.appliedPromo){setAppliedPromo(d.appliedPromo);setPromoCode(d.promoCode||"");}
      setStep(d.saleMode?"sale":"mode");
      setHasDraft(false);
      showToast("✅ Rascunho restaurado!");
    }catch(e){showToast("Erro ao restaurar rascunho","error");}
  };

  const clearDraft=()=>{
    try{localStorage.removeItem(DRAFT_KEY);}catch(e){}
    setHasDraft(false);
  };
  const prod=products.find(p=>p.id===Number(selProd));
  const getPrice=p=>isWholesale?(p.wholesalePrice||p.retailPrice):p.retailPrice;
  const getStk=(pId,sz)=>{
    // Channel determines which stock to show
    const stockSrc=channel==="galpao"?stkG:stkL;
    return stockSrc.find(s=>s.pId===pId&&s.sz===sz)?.qty||0;
  };
  const subtotal=cart.reduce((a,b)=>a+b.price*b.qty,0);
  const autoDisc=0; // Discount applied at payment step if cash/pix
  const promoDisc=appliedPromo?.pct||0;
  const extraDisc=Math.max(autoDisc,promoDisc);
  const discAmt=subtotal*extraDisc/100;
  const freightPrice=saleMode==="online"?freight.price:0;
  const total=Math.max(0,subtotal-discAmt+freightPrice);
  const change=payMethod==="dinheiro"?Math.max(0,paid-total):0;

  const applyPromo=()=>{
    const code=promoCode.trim().toUpperCase();
    if(PROMO_CODES[code]){setAppliedPromo({...PROMO_CODES[code],code});showToast(PROMO_CODES[code].label);}
    else{showToast("Código inválido","error");}
  };

  const addItem=()=>{
    if(!selProd||!selSz){showToast("Selecione produto e tamanho","error");return;}
    const av=getStk(Number(selProd),selSz);
    if(av<1){showToast("Sem estoque na loja!","error");return;}
    const p=prod;
    const idx=cart.findIndex(c=>c.pId===Number(selProd)&&c.sz===selSz);
    if(idx>=0){if(cart[idx].qty>=av){showToast("Estoque insuficiente","error");return;}
      setCart(prev=>prev.map((c,i)=>i===idx?{...c,qty:c.qty+1}:c));
    }else{
      setCart(prev=>[...prev,{pId:Number(selProd),name:p.name,sz:selSz,price:getPrice(p),qty:1,cat:p.cat,sku:p.sku}]);
    }
    setSelProd("");setSelSz("");
  };

  const addByBarcode=()=>{
    if(!barcodeInput.trim())return;
    const[sku,sz]=barcodeInput.trim().split("|");
    const p=products.find(x=>x.sku===sku);
    if(!p){showToast("Produto não encontrado","error");setBarcodeInput("");return;}
    const size=sz||p.sizes[0];
    const av=getStk(p.id,size);
    if(av<1){showToast("Sem estoque","error");setBarcodeInput("");return;}
    const idx=cart.findIndex(c=>c.pId===p.id&&c.sz===size);
    if(idx>=0)setCart(prev=>prev.map((c,i)=>i===idx?{...c,qty:c.qty+1}:c));
    else setCart(prev=>[...prev,{pId:p.id,name:p.name,sz:size,price:getPrice(p),qty:1,cat:p.cat,sku:p.sku}]);
    setBarcodeInput("");showToast(`${p.name} (${size}) adicionado`);
  };

  const calcFreight=()=>{
    if(freight.cep.replace(/\D/g,"").length<8){showToast("CEP inválido","error");return;}
    const prices={pac:18.50,sedex:32.80,sedex10:45.20};
    setFreight(f=>({...f,price:prices[f.service]||18.50,calc:true}));
  };

  const gerarBoleto=async(sale, returnResult=false)=>{
    let apiKey="",cfg={};
    try{
      const{data}=await sb.from("nfe_config").select("*").eq("id",1).single();
      apiKey=data?.asaas_key||"";
      cfg=data||{};
    }catch(e){}
    if(!apiKey){showToast("Configure a chave Asaas em ⚙ Configurações","error");return null;}

    if(!returnResult)showToast("Gerando boleto...");
    try{
      const clientName=(sale.clientName||"Avulso").replace(/^[\d.\s]+/,"");
      const cpfCnpj=(sale.clientCpfCnpj||"").replace(/\D/g,"");

      // Use override dueDate or calculate from config
      let dueDateStr=sale._dueDate||"";
      if(!dueDateStr){
        const dias=cfg.boleto_dias_venc||3;
        const dueDate=new Date();dueDate.setDate(dueDate.getDate()+dias);
        dueDateStr=dueDate.toISOString().split("T")[0];
      }

      // Multa and juros: use sale override or config
      const multa=sale._multa!=null?sale._multa:(cfg.boleto_multa||0);
      const juros=sale._juros!=null?sale._juros:(cfg.boleto_juros||0);

      // Description with parcela info
      const parcelaInfo=sale._parcela?` (${sale._parcela}/${sale._totalParcelas})`:"";
      const description=`Venda The Cott #${(sale.id||"").substring(0,8).toUpperCase()}${parcelaInfo}`;

      const extras={};
      if(multa>0)  extras.fine={value:multa};
      if(juros>0)  extras.interest={value:juros};
      if((cfg.boleto_desc_pct||0)>0&&(cfg.boleto_desc_dias||0)>0){
        extras.discount={value:cfg.boleto_desc_pct,dueDateLimitDays:cfg.boleto_desc_dias,type:"PERCENTAGE"};
      }

      const{data,error}=await sb.functions.invoke("asaas-proxy",{
        body:{
          action:"gerar_boleto",
          apiKey,
          clientName,
          cpfCnpj,
          clientPhone:sale.clientPhone||"",
          value:sale.total,
          dueDate:dueDateStr,
          description,
          ...extras,
        }
      });

      if(error||data?.error){
        showToast("Erro: "+(data?.error||error?.message||"tente novamente"),"error");
        return null;
      }
      if(data?.bankSlipUrl){
        if(!returnResult)window.open(data.bankSlipUrl,"_blank");
        else window.open(data.bankSlipUrl,"_blank");
        if(!returnResult)showToast("✅ Boleto gerado!");
        return data;
      }
      return null;
    }catch(e){showToast("Erro: "+e.message,"error");console.error(e);return null;}
  };

  const finalize=async()=>{
    if(cart.length===0){showToast("Carrinho vazio!","error");return;}
    setSaving(true);
    try{
      const now=new Date().toISOString();
      // Determine stock location based on sale mode
      const stockLoc=channel==="galpao"?"galpao":"loja";
      const stockTable=channel==="galpao"?"stock_galpao":"stock_loja";
      const stockState=channel==="galpao"?stkG:stkL;
      // Build sale row with only columns that exist in DB
      const saleRow={
        id:uid(),
        date:now,
        items:cart,  // jsonb
        subtotal,
        discount_pct:extraDisc,
        discount_amt:discAmt,
        freight_price:freightPrice,
        total,
        payment_method:payMethod,
        paid_amount:payMethod==="dinheiro"?paid:total,
        change_amount:change,
        client_id:selClient?.id||null,
        client_name:(selClient?.name||"Avulso").replace(/^[\d.\s]+/,""),
        client_phone:selClient?.phone||"",
        seller:user.name,
        is_wholesale:!!isWholesale,
        trade_deadline:add7(now).toISOString(),
        with_nfe:false,
        nfe_num:"",
        nfe_chave:"",
      };
      // Try to add optional columns (may not exist in older DBs)
      try{saleRow.promo_code=appliedPromo?.code||"";}catch(e){}
      try{saleRow.sale_mode=saleMode;}catch(e){}

      const{error:saleErr}=await sb.from("sales").insert(saleRow);
      if(saleErr){
        // Retry without optional columns
        delete saleRow.promo_code;
        delete saleRow.sale_mode;
        const{error:saleErr2}=await sb.from("sales").insert(saleRow);
        if(saleErr2)throw new Error(saleErr2.message);
      }

      // Update stock (galpao or loja depending on sale mode)
      for(const item of cart){
        const s=stockState.find(s=>s.pId===item.pId&&s.sz===item.sz);
        if(s?._id){
          await sb.from(stockTable).update({qty:Math.max(0,(s.qty||0)-item.qty)}).eq("id",s._id);
        }
      }
      if(channel==="galpao"){
        setStkG(prev=>{const u=[...prev];cart.forEach(item=>{const idx=u.findIndex(s=>s.pId===item.pId&&s.sz===item.sz);if(idx>=0)u[idx]={...u[idx],qty:Math.max(0,u[idx].qty-item.qty)};});return u;});
      }else{
        setStkL(prev=>{const u=[...prev];cart.forEach(item=>{const idx=u.findIndex(s=>s.pId===item.pId&&s.sz===item.sz);if(idx>=0)u[idx]={...u[idx],qty:Math.max(0,u[idx].qty-item.qty)};});return u;});
      }

      const displaySale={...saleRow,clientName:saleRow.client_name,discountAmt:discAmt,discountPct:extraDisc,freightPrice,isWholesale:!!isWholesale,withNFe:false,tradeDeadline:add7(now).toISOString(),paymentMethod:payMethod,paidAmount:payMethod==="dinheiro"?paid:total,change,promo_code:appliedPromo?.code||"",sale_mode:saleMode};
      setSales(prev=>[displaySale,...prev]);
      await addMov({type:"venda",loc:stockLoc,desc:`Venda ${saleMode==="galpao"?"Galpão":saleMode==="online"?"Online":"Balcão"} – ${cart.length} item(s) – ${fmt(total)}`});
      await logActivity("venda",`${saleRow.client_name} — ${fmt(total)}`);
      setReceipt(displaySale);
      setPrinted(false);
      setWpPhone(selClient?.phone||"");
      setWpEmail(selClient?.email||"");
      // Clear draft on successful save
      try{localStorage.removeItem(DRAFT_KEY);}catch(e){}
      setHasDraft(false);
      setCart([]);setPaid(0);setAppliedPromo(null);setPromoCode("");
      setFreight({cep:"",service:"pac",price:0,calc:false});
      showToast("Venda finalizada!");
    }catch(e){showToast("Erro: "+e.message,"error");console.error(e);}
    setSaving(false);
  };

                <div><span style={{color:C.inkLt}}>Data: </span><strong>{fmtD(receipt.date)}</strong></div>
                <div><span style={{color:C.inkLt}}>Vendedor: </span><strong>{receipt.seller}</strong></div>
                <div style={{gridColumn:"1/-1"}}><span style={{color:C.inkLt}}>Cliente: </span><strong>{(receipt.clientName||"Avulso").replace(/^[\d.\s]+/,"")}</strong>
                  {receipt.isWholesale&&<span style={{marginLeft:8,background:C.purpleLt,color:C.purple,padding:"1px 7px",borderRadius:10,fontSize:11,fontWeight:600}}>ATACADO</span>}
                </div>
                {receipt.sale_mode&&receipt.sale_mode!=="balcao"&&<div style={{gridColumn:"1/-1"}}><span style={{color:C.inkLt}}>Modalidade: </span><strong>{receipt.sale_mode==="online"?"Online / Entrega":"Venda Galpão"}</strong></div>}
              </div>

              {/* Items table */}
              <table style={{width:"100%",borderCollapse:"collapse",marginBottom:12,fontSize:13}}>
                <thead>
                  <tr style={{background:"#f7f5f2"}}>
                    <th style={{padding:"7px 10px",textAlign:"center",fontWeight:700,fontSize:11,letterSpacing:.5,color:C.inkMd,borderBottom:`2px solid ${C.border}`,width:50}}>QTD</th>
                    <th style={{padding:"7px 10px",textAlign:"left",fontWeight:700,fontSize:11,letterSpacing:.5,color:C.inkMd,borderBottom:`2px solid ${C.border}`}}>PRODUTO</th>
                    <th style={{padding:"7px 10px",textAlign:"center",fontWeight:700,fontSize:11,letterSpacing:.5,color:C.inkMd,borderBottom:`2px solid ${C.border}`,width:60}}>TAM</th>
                    <th style={{padding:"7px 10px",textAlign:"right",fontWeight:700,fontSize:11,letterSpacing:.5,color:C.inkMd,borderBottom:`2px solid ${C.border}`,width:90}}>VALOR</th>
                  </tr>
                </thead>
                <tbody>
                  {receipt.items?.map((item,i)=>(
                    <tr key={i} style={{borderBottom:`1px solid ${C.border}`}}>
                      <td style={{padding:"8px 10px",textAlign:"center",fontWeight:700,fontSize:15}}>{item.qty}</td>
                      <td style={{padding:"8px 10px",fontSize:13}}>{item.name}</td>
                      <td style={{padding:"8px 10px",textAlign:"center",fontWeight:600,fontSize:13}}>{item.sz}</td>
                      <td style={{padding:"8px 10px",textAlign:"right",fontWeight:500}}>{fmt(item.price*item.qty)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>

              {/* Totals */}
              <div style={{marginLeft:"auto",maxWidth:220,fontSize:12.5}}>
                {receipt.discountAmt>0&&(
                  <div style={{display:"flex",justifyContent:"space-between",color:C.red,marginBottom:3}}>
                    <span>{receipt.promo_code?"Cupom "+receipt.promo_code:"Desconto "+receipt.discountPct+"%"}</span>
                    <span>- {fmt(receipt.discountAmt)}</span>
                  </div>
                )}
                {receipt.freightPrice>0&&(
                  <div style={{display:"flex",justifyContent:"space-between",color:C.blue,marginBottom:3}}>
                    <span>Frete</span><span>{fmt(receipt.freightPrice)}</span>
                  </div>
                )}
                <div style={{display:"flex",justifyContent:"space-between",fontWeight:700,fontSize:16,padding:"8px 0",borderTop:`2px solid ${C.ink}`,marginTop:4}}>
                  <span>TOTAL</span><span>{fmt(receipt.total)}</span>
                </div>
                <div style={{fontSize:12,color:C.inkMd,marginTop:3}}>
                  Pagamento: <strong>{receipt.paymentMethod}</strong>
                  {receipt.paymentMethod==="dinheiro"&&receipt.change>0&&<span> · Troco: {fmt(receipt.change)}</span>}
                </div>
              </div>

              {/* Footer */}
              <div style={{marginTop:16,paddingTop:12,borderTop:`1px dashed ${C.border}`,fontSize:11,color:C.inkLt,textAlign:"center"}}>
                <div>📅 Troca até: <strong style={{color:C.ink}}>{fmtDS(receipt.tradeDeadline)}</strong> (7 dias corridos)</div>
                <div style={{marginTop:4,letterSpacing:.5}}>THE COTT LTDA — obrigado pela preferência!</div>
              </div>
            </div>

            {/* Action buttons — hidden on print */}
            <div className="no-print" style={{padding:"16px 24px",borderTop:`1px solid ${C.border}`,display:"flex",flexDirection:"column",gap:10}}>



              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,alignItems:"end"}}>
                <div>
                  <div style={{fontSize:11,fontWeight:600,color:C.inkLt,letterSpacing:.5,marginBottom:5}}>WHATSAPP</div>
                  <input value={wpPhone} onChange={e=>setWpPhone(e.target.value)}
                    placeholder="(24) 99999-9999"
                    style={{width:"100%",background:C.hover,border:`1px solid ${C.border}`,borderRadius:6,color:C.ink,padding:"8px 11px",fontSize:13,outline:"none"}}/>
                </div>
                <Btn onClick={()=>sendWA(receipt)} v="success">📱 WhatsApp</Btn>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,alignItems:"end"}}>
                <div>
                  <div style={{fontSize:11,fontWeight:600,color:C.inkLt,letterSpacing:.5,marginBottom:5}}>E-MAIL</div>
                  <input value={wpEmail} onChange={e=>setWpEmail(e.target.value)}
                    placeholder="cliente@email.com" type="email"
                    style={{width:"100%",background:C.hover,border:`1px solid ${C.border}`,borderRadius:6,color:C.ink,padding:"8px 11px",fontSize:13,outline:"none"}}/>
                </div>
                <Btn onClick={()=>sendEmail(receipt)} v="blue">✉️ E-mail</Btn>
              </div>
              <Btn onClick={()=>gerarBoleto({...receipt,clientCpfCnpj:selClient?.cpf_cnpj||selClient?.cpf||"",clientPhone:selClient?.phone||""})} v="secondary" full>
                🧾 Gerar Boleto (Asaas)
              </Btn>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                <Btn onClick={()=>{printReceipt(receipt);setPrinted(true);}} v="secondary">🖨️ Reimprimir</Btn>
                <Btn onClick={()=>{setReceipt(null);resetSale();}} v="ghost">🛒 Nova Venda</Btn>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}



// ── CLIENTS ────────────────────────────────────────────────────────────────
// ── CLIENTS ────────────────────────────────────────────────────────────────
function Clients({clients,setClients,sales,showToast,logActivity}){
  const [view,setView]=useState("list");
  const [clientTab,setClientTab]=useState("varejo");
  const [sortMode,setSortMode]=useState("alpha"); // alpha | recent
  const [selId,setSelId]=useState(null);
  const [search,setSearch]=useState("");
  const [cnpjLoading,setCnpjLoading]=useState(false);
  const [cepLoading,setCepLoading]=useState(false);
  const blank={name:"",tradeName:"",cpfCnpj:"",ie:"",docType:"cpf",phone:"",email:"",cep:"",address:"",number:"",city:"",state:"",type:"retail",cnpjStatus:""};
  const [form,setForm]=useState(blank);
  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));

  const fetchCEP=async(cep)=>{
    const clean=cep.replace(/\D/g,"");
    if(clean.length!==8)return;
    setCepLoading(true);
    try{
      const r=await fetch(`https://viacep.com.br/ws/${clean}/json/`);
      const d=await r.json();
      if(!d.erro){
        setForm(f=>({...f,address:d.logradouro||"",city:d.localidade||"",state:d.uf||""}));
        showToast("Endereço preenchido pelo CEP","info");
      }else showToast("CEP não encontrado","error");
    }catch(e){showToast("Erro ao buscar CEP","error");}
    setCepLoading(false);
  };

  const fetchCNPJ=async(cnpj)=>{
    const clean=cnpj.replace(/\D/g,"");
    if(clean.length!==14){showToast("CNPJ deve ter 14 dígitos","error");return;}
    setCnpjLoading(true);
    try{
      const r=await fetch(`https://brasilapi.com.br/api/cnpj/v1/${clean}`);
      if(!r.ok){showToast("CNPJ não encontrado","error");setCnpjLoading(false);return;}
      const d=await r.json();
      setForm(f=>({...f,
        name:d.razao_social||f.name,
        tradeName:d.nome_fantasia||f.tradeName,
        address:d.logradouro||f.address,
        number:d.numero||f.number,
        city:d.municipio||f.city,
        state:d.uf||f.state,
        cep:d.cep?.replace(/\D/g,"")||f.cep,
        cnpjStatus:d.descricao_situacao_cadastral||"",
        type:"wholesale",
      }));
      showToast(`CNPJ: ${d.descricao_situacao_cadastral}`,"info");
    }catch(e){showToast("Erro ao consultar CNPJ","error");}
    setCnpjLoading(false);
  };

  const save=async()=>{
    if(!form.name){showToast("Nome obrigatório","error");return;}
    if(form.cpfCnpj){
      const cpfClean=form.cpfCnpj.replace(/\D/g,"");
      const dup=clients.find(c=>{
        const existing=(c.cpf_cnpj||c.cpf||"").replace(/\D/g,"");
        return existing&&existing===cpfClean;
      });
      if(dup){showToast("CPF/CNPJ já cadastrado: "+cleanName(dup.name),"error");return;}
    }
    const type=form.docType==="cnpj"?"wholesale":form.type;
    const fullAddress=`${form.address}${form.number?", "+form.number:""}`;
    const c={id:uid(),name:form.name,trade_name:form.tradeName,cpf_cnpj:form.cpfCnpj,
      ie:form.ie,doc_type:form.docType,phone:form.phone,email:form.email||"",
      cep:form.cep,address:fullAddress,city:form.city,state:form.state,
      type,cnpj_status:form.cnpjStatus,cashback_balance:0,created_at:new Date().toISOString()};
    const{error}=await sb.from("clients").insert(c);
    if(error){showToast("Erro: "+error.message,"error");return;}
    setClients(p=>[...p,c]);
    await logActivity("cliente_cadastrado",c.name);
    showToast("Cliente cadastrado!");
    setView("list");setForm(blank);
  };

  const selClient=clients.find(c=>c.id===selId);
  const clientSales=sales.filter(s=>s.client_id===selId||s.clientId===selId);
  const totalSpent=clientSales.reduce((a,s)=>a+(s.total||0),0);

  const cleanName=n=>(n||"").replace(/^[\d.\s]+/,"").trim();
  const clientSales2={}; // last sale date per client
  clients.forEach(c=>{
    const last=sales.filter(s=>s.client_id===c.id||s.clientId===c.id).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
    if(last)clientSales2[c.id]=last.date;
  });
  const sortFn=(a,b)=>{
    if(sortMode==="alpha")return cleanName(a.name).localeCompare(cleanName(b.name),"pt-BR");
    const da=clientSales2[a.id]||a.created_at||"";
    const db=clientSales2[b.id]||b.created_at||"";
    return db.localeCompare(da);
  };
  const sortedClients=[...clients].sort(sortFn);
  const varejo=sortedClients.filter(c=>c.type==="retail"||c.type!=="wholesale");
  const atacado=sortedClients.filter(c=>c.type==="wholesale");
  const listToShow=(clientTab==="varejo"?varejo:atacado).filter(c=>
    cleanName(c.name).toLowerCase().includes(search.toLowerCase())||
    (c.cpf_cnpj&&c.cpf_cnpj.includes(search))||(c.cpf&&c.cpf.includes(search))||(c.phone&&c.phone.includes(search))
  );

  // DETAIL
  if(view==="detail"&&selClient)return(
    <div className="fu">
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
        <button onClick={()=>setView("list")} style={{background:"none",border:"none",color:C.inkMd,cursor:"pointer",fontSize:22}}>←</button>
        <div style={{flex:1}}>
          <div className="cor" style={{fontSize:28,fontWeight:400}}>{selClient.name}</div>
          {selClient.trade_name&&<div style={{fontSize:12,color:C.inkLt}}>{selClient.trade_name}</div>}
        </div>
        <Badge color={selClient.type==="wholesale"?C.purple:C.green}>{selClient.type==="wholesale"?"Atacado":"Varejo"}</Badge>
        {selClient.cnpj_status&&<Badge color={selClient.cnpj_status.includes("ATIVA")?C.green:C.red}>{selClient.cnpj_status}</Badge>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:20}}>
        <Card>
          <SectionTitle>Dados</SectionTitle>
          <div style={{fontSize:13.5,lineHeight:2.2,color:C.inkMd}}>
            <div><strong style={{color:C.ink}}>{selClient.doc_type?.toUpperCase()}:</strong> {selClient.cpf_cnpj}</div>
            {selClient.ie&&<div><strong style={{color:C.ink}}>IE:</strong> {selClient.ie}</div>}
            {selClient.phone&&<div>📱 {selClient.phone}</div>}
            {selClient.email&&<div>✉️ {selClient.email}</div>}
            {selClient.address&&<div>📍 {selClient.address}{selClient.city?`, ${selClient.city}`:""}{selClient.state?`/${selClient.state}`:""}</div>}
          </div>
        </Card>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Card>
            <SectionTitle>Total Compras</SectionTitle>
            <div className="cor" style={{fontSize:26,color:C.green}}>{fmt(totalSpent)}</div>
            <div style={{fontSize:12,color:C.inkLt,marginTop:4}}>{clientSales.length} pedido(s)</div>
          </Card>
          <Card>
            <SectionTitle>Cashback</SectionTitle>
            <div className="cor" style={{fontSize:26,color:C.gold}}>{fmt(selClient.cashback_balance||0)}</div>
            <div style={{fontSize:11,color:C.inkLt,marginTop:4}}>Saldo disponível</div>
          </Card>
        </div>
      </div>
      <Card>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <SectionTitle style={{marginBottom:0}}>Histórico de Compras</SectionTitle>
          {clientSales.length>0&&<div style={{fontSize:12,color:C.inkLt}}>Última: {fmtDS(clientSales.sort((a,b)=>new Date(b.date)-new Date(a.date))[0]?.date)}</div>}
        </div>
        {clientSales.length===0
          ?<div style={{color:C.inkFt,fontSize:13,textAlign:"center",padding:20}}>Nenhuma compra registrada.</div>
          :[...clientSales].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(s=>{
            const cancelled=s.status==="cancelada";
            return(
              <div key={s.id} style={{padding:"10px 0",borderBottom:`1px solid ${C.border}`,opacity:cancelled?.6:1}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div>
                    <div style={{fontWeight:600,fontSize:13}}>{fmtDS(s.date)}</div>
                    <div style={{fontSize:11.5,color:C.inkLt,marginTop:2}}>{s.payment_method||s.paymentMethod} · {s.items?.length||0} item(s) · {s.sale_mode||""}</div>
                    {s.items?.length>0&&<div style={{fontSize:11,color:C.inkFt,marginTop:3}}>{s.items.map(i=>`${i.qty}× ${i.name} (${i.sz})`).join(", ")}</div>}
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div className="cor" style={{fontSize:17,color:cancelled?C.inkLt:C.green}}>{fmt(s.total)}</div>
                    {cancelled&&<div style={{fontSize:10,color:C.red,fontWeight:700}}>cancelada</div>}
                    {s.paymentMethod==="boleto"&&<div style={{fontSize:10,color:C.gold}}>boleto</div>}
                  </div>
                </div>
              </div>
            );
          })}
      </Card>
      <div style={{display:"flex",gap:8,marginTop:12}}>
        <Btn v="ghost" onClick={()=>{setView("edit");setForm({name:selClient.name,tradeName:selClient.trade_name||"",cpfCnpj:selClient.cpf_cnpj||selClient.cpf||"",ie:selClient.ie||"",docType:selClient.doc_type||"cpf",phone:selClient.phone||"",email:selClient.email||"",cep:selClient.cep||"",address:selClient.address||"",number:selClient.number||"",city:selClient.city||"",state:selClient.state||"",type:selClient.type||"retail",cnpjStatus:selClient.cnpj_status||""});}}>✏️ Editar cliente</Btn>
      </div>
    </div>
  );

  // NEW FORM
  if(view==="new")return(
    <div className="fu">
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
        <button onClick={()=>setView("list")} style={{background:"none",border:"none",color:C.inkMd,cursor:"pointer",fontSize:22}}>←</button>
        <div className="cor" style={{fontSize:28,fontWeight:400}}>Novo Cliente</div>
      </div>
      <Card style={{maxWidth:560}}>
        {/* Doc type */}
        <div style={{display:"grid",gridTemplateColumns:"120px 1fr",gap:10,marginBottom:4}}>
          <Fld label="Tipo doc." value={form.docType} onChange={v=>setF("docType",v)}
            options={[{value:"cpf",label:"CPF"},{value:"cnpj",label:"CNPJ"}]}/>
          <Fld label={form.docType==="cnpj"?"CNPJ":"CPF"} value={form.cpfCnpj}
            onChange={v=>setF("cpfCnpj",form.docType==="cnpj"?fmtCNPJ(v):fmtCPF(v))}
            placeholder={form.docType==="cnpj"?"00.000.000/0001-00":"000.000.000-00"}/>
        </div>
        {form.docType==="cnpj"&&(
          <div style={{marginBottom:14}}>
            <Btn v="blue" sz="sm" disabled={cnpjLoading} onClick={()=>fetchCNPJ(form.cpfCnpj)}>
              {cnpjLoading?"Consultando...":"🔍 Buscar CNPJ na Receita Federal"}
            </Btn>
            {form.cnpjStatus&&<div style={{marginTop:8,padding:"7px 12px",background:form.cnpjStatus.includes("ATIVA")?C.greenLt:C.redLt,borderRadius:6,fontSize:12.5,color:form.cnpjStatus.includes("ATIVA")?C.green:C.red,fontWeight:500}}>Situação: {form.cnpjStatus}</div>}
          </div>
        )}
        <Fld label="Nome / Razão Social" value={form.name} onChange={v=>setF("name",v)} required/>
        {form.docType==="cnpj"&&<Fld label="Nome Fantasia" value={form.tradeName} onChange={v=>setF("tradeName",v)}/>}
        {form.docType==="cnpj"&&<Fld label="Inscrição Estadual (IE)" value={form.ie} onChange={v=>setF("ie",v)} placeholder="Somente números"/>}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Fld label="Telefone" value={form.phone} onChange={v=>setF("phone",v)} placeholder="(24) 99999-9999"/>
          <Fld label="E-mail" value={form.email} onChange={v=>setF("email",v)} type="email"/>
        </div>
        <HR/>
        <div style={{fontSize:11,color:C.inkMd,marginBottom:10,fontWeight:600,letterSpacing:.6,textTransform:"uppercase"}}>Endereço</div>
        <div style={{display:"flex",gap:8,marginBottom:4}}>
          <Fld label="CEP" value={form.cep} onChange={v=>{setF("cep",v);if(v.replace(/\D/g,"").length===8)fetchCEP(v);}} placeholder="00000-000" style={{marginBottom:0,flex:1}}/>
          {cepLoading&&<div style={{fontSize:11,color:C.inkLt,paddingTop:28}}>Buscando...</div>}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 80px",gap:10}}>
          <Fld label="Rua / Logradouro" value={form.address} onChange={v=>setF("address",v)}/>
          <Fld label="Número" value={form.number} onChange={v=>setF("number",v)} placeholder="123"/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 60px",gap:10}}>
          <Fld label="Cidade" value={form.city} onChange={v=>setF("city",v)}/>
          <Fld label="UF" value={form.state} onChange={v=>setF("state",v)} placeholder="MG"/>
        </div>
        {form.docType==="cnpj"
          ?<div style={{padding:"9px 13px",background:C.purpleLt,borderRadius:7,fontSize:13,color:C.purple,fontWeight:500,marginBottom:14}}>🏢 CNPJ — classificado automaticamente como <strong>Atacado</strong></div>
          :<Fld label="Tipo cliente" value={form.type} onChange={v=>setF("type",v)} options={[{value:"retail",label:"Varejo"},{value:"wholesale",label:"Atacado"}]}/>
        }
        <Btn onClick={save} full sz="lg">Salvar Cliente</Btn>
      </Card>
    </div>
  );

  // LIST
  return(
    <div className="fu">
      <PageHeader title="Clientes" sub={`${varejo.length} varejo · ${atacado.length} atacado`}
        actions={[<Btn key="new" onClick={()=>setView("new")}>+ Novo Cliente</Btn>]}/>
      <InlineTabs tabs={[{id:"varejo",label:`🛒 Varejo (${varejo.length})`},{id:"atacado",label:`🏢 Atacado (${atacado.length})`}]} active={clientTab} onChange={setClientTab}/>
      <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:16,flexWrap:"wrap"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar por nome, CPF/CNPJ ou telefone..."
          style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:7,color:C.ink,padding:"9px 14px",fontSize:13.5,outline:"none",flex:1,minWidth:220}}/>
        <div style={{display:"flex",gap:6}}>
          {[["alpha","🔤 A–Z"],["recent","🕐 Recentes"]].map(([m,l])=>(
            <button key={m} onClick={()=>setSortMode(m)} style={{padding:"8px 14px",borderRadius:7,border:`1.5px solid ${sortMode===m?C.gold:C.border}`,background:sortMode===m?C.goldLt:"transparent",color:sortMode===m?C.gold:C.inkMd,cursor:"pointer",fontSize:13,fontWeight:sortMode===m?600:400,whiteSpace:"nowrap"}}>{l}</button>
          ))}
        </div>
      </div>
      {listToShow.length===0&&<Card style={{textAlign:"center",color:C.inkFt,padding:36}}>Nenhum cliente nesta categoria.</Card>}
      <div style={{display:"grid",gap:8}}>
        {listToShow.map(c=>(
          <div key={c.id} onClick={()=>{setSelId(c.id);setView("detail");}}
            style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"13px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10,cursor:"pointer",transition:"border-color .15s"}}
            onMouseEnter={e=>e.currentTarget.style.borderColor=C.gold}
            onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:38,height:38,borderRadius:"50%",background:c.type==="wholesale"?C.purpleLt:C.goldLt,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,color:c.type==="wholesale"?C.purple:C.gold,fontSize:15,flexShrink:0}}>{(c.name.replace(/^[\d.\s]+/,""))[0]}</div>
              <div>
                <div style={{fontWeight:500,fontSize:13.5}}>{c.name.replace(/^[\d.\s]+/,"")}</div>
                <div style={{fontSize:12,color:C.inkLt}}>{c.doc_type?.toUpperCase()}: {c.cpf_cnpj}{c.phone&&` · 📱 ${c.phone}`}{c.city&&` · ${c.city}`}</div>
              </div>
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              {(c.cashback_balance||0)>0&&<Badge color={C.gold}>💰 {fmt(c.cashback_balance)}</Badge>}

      </div>

}


// ── PRODUCTS ───────────────────────────────────────────────────────────────
function Products({products,setProducts,setStkG,setStkL,sales,showToast,logActivity}){
  const [view,setView]=useState("list");
  const [selId,setSelId]=useState(null);
  const [activeTab,setActiveTab]=useState("dados");
  const [search,setSearch]=useState("");
  const [saving,setSaving]=useState(false);
  const [printed,setPrinted]=useState(false);
  const [payStep,setPayStep]=useState(0);   // payment wizard step
  const [payments,setPayments]=useState([]); // [{method, amount}]
  const [payAmt,setPayAmt]=useState("");     // current payment amount input
  const blank={name:"",sku:"",cat:"",color:"",sizes:[]};
  const [form,setForm]=useState(blank);
  // variants: [{sz, retailPrice, wholesalePrice}]
  const [variants,setVariants]=useState([]);
  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));

  const genSKU=(name,cat)=>{
    // Build prefix from first letter of each word (max 3 letters)
    const src=name||cat||"OUT";
    const words=src.trim().split(/\s+/).filter(Boolean);
    let prefix;
    if(words.length>=2){
      prefix=words.slice(0,3).map(w=>w[0].toUpperCase()).join("");
    }else{
      prefix=src.replace(/\s+/g,"").toUpperCase().slice(0,3);
    }
    prefix=prefix.slice(0,3);
    const existing=products.filter(p=>p.sku&&p.sku.startsWith(prefix+"-"));
    const nums=existing.map(p=>parseInt((p.sku||"").split("-")[1])||0);
    const next=(nums.length?Math.max(...nums):0)+1;
    return prefix+"-"+String(next).padStart(3,"0");
  };

  const startNew=(cat)=>{
    const sku=genSKU("",cat);
    setForm({...blank,cat,sku});
    setVariants([]);
    setView("new");
  };

  // When sizes string changes, sync variant rows
  const syncVariants=(sizesStr)=>{
    const szArr=sizesStr.split(",").map(s=>s.trim()).filter(Boolean);
    setVariants(prev=>{
      return szArr.map(sz=>{
        const existing=prev.find(v=>v.sz===sz);
        return existing||{sz,retailPrice:"",wholesalePrice:"",qty:0};
      });
    });
    setF("sizes",sizesStr);
  };

  const setVariant=(sz,key,val)=>{
    setVariants(prev=>prev.map(v=>v.sz===sz?{...v,[key]:val}:v));
  };

  const applyPriceToAll=(key,val)=>{
    setVariants(prev=>prev.map(v=>({...v,[key]:val})));
  };

  const save=async()=>{
    if(!form.name.trim()){showToast("Nome obrigatório","error");return;}
    if(variants.length===0){showToast("Adicione ao menos um tamanho","error");return;}
    setSaving(true);
    try{
      const sizes=variants.map(v=>v.sz);
      const sku=form.sku||genSKU(form.name,form.cat);
      // Use first variant price as default product price
      const parsePR=v=>parseFloat(String(v||"0").replace(",","."))||0;
      const retail=parsePR(variants[0]?.retailPrice);
      const wholesale=parsePR(variants[0]?.wholesalePrice);
      const row={sku,name:form.name.trim(),cat:form.cat,color:form.color,sizes,
        retail_price:retail,wholesale_price:wholesale,cost_price:0,image_url:"",promo:false};
      const{data,error}=await sb.from("products").insert(row).select().single();
      if(error){showToast("Erro: "+error.message,"error");setSaving(false);return;}
      if(data){
        const np={...data,imageUrl:"",retailPrice:data.retail_price,wholesalePrice:data.wholesale_price,costPrice:0};
        setProducts(p=>[...p,np]);
        for(const v of variants){
          await sb.from("stock_galpao").insert({product_id:data.id,size:v.sz,qty:Number(v.qty)||0});
          await sb.from("stock_loja").insert({product_id:data.id,size:v.sz,qty:0});
          setStkG(p=>[...p,{pId:data.id,sz:v.sz,qty:Number(v.qty)||0}]);
          setStkL(p=>[...p,{pId:data.id,sz:v.sz,qty:0}]);
        }
        await logActivity("produto_cadastrado",`${sku} — ${form.name}`);
        showToast("Produto cadastrado!");
        setView("list");setForm(blank);setVariants([]);
      }
    }catch(e){showToast("Erro: "+e.message,"error");}
    setSaving(false);
  };

  const duplicate=(p)=>{
    const sku=genSKU(p.name,p.cat);
    setForm({name:p.name+" (cópia)",sku,cat:p.cat,color:p.color,sizes:[]});
    const vs=p.sizes?.map(sz=>({sz,retailPrice:p.retailPrice,wholesalePrice:p.wholesalePrice,qty:0}))||[];
    setVariants(vs);
    setView("new");
    showToast("Produto duplicado — ajuste e salve.","info");
  };

  const startEdit=(p)=>{
    setForm({name:p.name,sku:p.sku,cat:p.cat,color:p.color||"",sizes:p.sizes||[]});
    const vs=(p.sizes||[]).map(sz=>({sz,retailPrice:String(p.retailPrice||""),wholesalePrice:String(p.wholesalePrice||""),qty:0}));
    setVariants(vs);
    setSelId(p.id);
    setView("edit");
  };

  const saveEdit=async()=>{
    if(!form.name.trim()){showToast("Nome obrigatório","error");return;}
    if(variants.length===0){showToast("Adicione ao menos um tamanho","error");return;}
    setSaving(true);
    try{
      const parsePR=v=>parseFloat(String(v||"0").replace(",","."))||0;
      const sizes=variants.map(v=>v.sz);
      const retail=parsePR(variants[0]?.retailPrice);
      const wholesale=parsePR(variants[0]?.wholesalePrice);
      const row={name:form.name.trim(),cat:form.cat,color:form.color||"",sizes,
        retail_price:retail,wholesale_price:wholesale,cost_price:0,promo:false};
      const{data:updData,error}=await sb.from("products").update(row).eq("id",selId).select().single();
      if(error){showToast("Erro ao editar: "+error.message,"error");setSaving(false);return;}
      setProducts(prev=>prev.map(p=>p.id===selId?{...p,...row,retailPrice:retail,wholesalePrice:wholesale,sizes}:p));
      await logActivity("produto_editado",`${form.sku} — ${form.name}`);
      showToast("Produto atualizado!");
      setView("detail");setForm(blank);setVariants([]);
    }catch(e){showToast("Erro: "+e.message,"error");console.error(e);}
    setSaving(false);
  };

  const selProd=products.find(p=>p.id===selId);
  const prodSales=sales.filter(s=>s.items?.some(i=>i.pId===selId));
  const filtered=products.filter(p=>
    p.name.toLowerCase().includes(search.toLowerCase())||
    (p.sku||"").toLowerCase().includes(search.toLowerCase())
  );

  // ── PICK CATEGORY ──
  if(view==="pickCat")return(
    <div className="fu">
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:28}}>
        <button onClick={()=>setView("list")} style={{background:"none",border:"none",color:C.inkMd,cursor:"pointer",fontSize:22}}>←</button>
        <div>
          <div className="cor" style={{fontSize:28,fontWeight:400}}>Novo Produto</div>
          <div style={{fontSize:13,color:C.inkLt}}>Selecione a categoria para começar</div>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:12,maxWidth:600}}>
        {CATS.map(cat=>{const cc=CAT_COLOR[cat]||"#C8C0B4";return(
          <button key={cat} onClick={()=>startNew(cat)} style={{padding:"22px 12px",borderRadius:12,border:`1.5px solid ${C.border}`,background:C.surface,cursor:"pointer",textAlign:"center",transition:"all .15s"}}
            onMouseEnter={e=>{e.currentTarget.style.borderColor=cc;e.currentTarget.style.background=`${cc}12`;}}

            <div style={{fontSize:34,marginBottom:8}}>{CAT_ICON[cat]||"📦"}</div>
            <div style={{fontWeight:600,fontSize:13,color:C.ink}}>{cat}</div>
          </button>
        );})}
      </div>
    </div>
  );

  // ── NEW/EDIT FORM — SHOPIFY STYLE ──
  if(view==="new"||view==="edit")return(
    <div className="fu">
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
        <button onClick={()=>view==="new"?setView("pickCat"):setView("detail")} style={{background:"none",border:"none",color:C.inkMd,cursor:"pointer",fontSize:22}}>←</button>
        <div>
          <div className="cor" style={{fontSize:28,fontWeight:400}}>{view==="edit"?"Editar Produto":"Novo Produto"}</div>
          {form.cat&&<div style={{fontSize:12,color:C.inkLt,marginTop:2}}>{CAT_ICON[form.cat]} {form.cat}</div>}

      </div>

          {/* VARIANTS TABLE */}

                <button onClick={()=>{

                  setVariants(szs.map(sz=>({sz,retailPrice:r,wholesalePrice:w,qty:0})));

            {variants.length>0&&(
              <>

                    <span style={{fontSize:10.5,color:C.inkLt,fontWeight:700,letterSpacing:.5}}>ATACADO R$</span>
                    <button title="Aplicar a todos" onClick={()=>{const v=prompt("Preço atacado para todos (ex: 120,00):");if(v!=null){const n=parseFloat(v.replace(",","."));if(!isNaN(n))applyPriceToAll("wholesalePrice",n.toFixed(2));}}} style={{fontSize:10,background:"none",border:"none",cursor:"pointer",color:C.purple}}>↓ todos</button>
                  </div>
                  <div style={{fontSize:10.5,color:C.inkLt,fontWeight:700,letterSpacing:.5}}>GALPÃO</div>
                  <div/>
                </div>

                {sortSizes(variants.map(v=>v.sz)).map(sz=>{const v=variants.find(x=>x.sz===sz);if(!v)return null;const i=variants.indexOf(v);return(
                  <div key={v.sz} style={{display:"grid",gridTemplateColumns:"80px 1fr 1fr 90px 32px",gap:8,alignItems:"center",padding:"4px 10px",borderBottom:`1px solid ${C.border}`}}>
                    <div style={{fontWeight:600,fontSize:14,color:C.ink}}>{v.sz}</div>
                    <input type="text" inputMode="decimal" value={v.retailPrice} onChange={e=>setVariant(v.sz,"retailPrice",e.target.value)}
                      onBlur={e=>{const n=parseFloat(e.target.value.replace(",","."));if(!isNaN(n))setVariant(v.sz,"retailPrice",n.toFixed(2));}}
                      placeholder="0,00" style={{width:"100%",background:C.surface,border:`1px solid ${C.border}`,borderRadius:5,color:C.ink,padding:"7px 9px",fontSize:13.5,outline:"none"}}/>
                    <input type="text" inputMode="decimal" value={v.wholesalePrice} onChange={e=>setVariant(v.sz,"wholesalePrice",e.target.value)}
                      onBlur={e=>{const n=parseFloat(e.target.value.replace(",","."));if(!isNaN(n))setVariant(v.sz,"wholesalePrice",n.toFixed(2));}}
                      placeholder="0,00" style={{width:"100%",background:C.surface,border:`1px solid ${C.border}`,borderRadius:5,color:C.purple,padding:"7px 9px",fontSize:13.5,outline:"none"}}/>
                    <input type="number" value={v.qty} onChange={e=>setVariant(v.sz,"qty",e.target.value)}

                    <button onClick={()=>setVariants(prev=>prev.filter((_,j)=>j!==i))} style={{background:C.redLt,border:"none",color:C.red,width:28,height:28,borderRadius:5,cursor:"pointer",fontSize:14}}>×</button>

                <button onClick={e=>{e.stopPropagation();duplicate(p);}} style={{background:C.hover,border:`1px solid ${C.border}`,borderRadius:6,padding:"5px 10px",cursor:"pointer",fontSize:11.5,color:C.inkMd}}>⧉ Duplicar</button>
              </div>
            </div>
          </div>
        );})}
      </div>
    </div>
  );
}


function StockPage({title,loc,stock,setStock,products,addMov,showToast,table,logActivity}){
  const [selProd,setSelProd]=useState(null);
  const [type,setType]=useState("entrada");
  const [qtys,setQtys]=useState({});
  const [obs,setObs]=useState("");
  const [saving,setSaving]=useState(false);
  const [search,setSearch]=useState("");
  const [importing,setImporting]=useState(false);
  const [importPreview,setImportPreview]=useState(null); // [{sku,name,sz,qty,pId,stk_id}]
  const importRef=useRef();
  const getQty=(pId,sz)=>stock.find(s=>s.pId===pId&&s.sz===sz)?.qty||0;

  const handleSubmit=async()=>{
    if(!selProd){showToast("Selecione um produto","error");return;}
    const entries=Object.entries(qtys).filter(([sz,q])=>Number(q)>0);
    if(entries.length===0){showToast("Informe ao menos uma quantidade","error");return;}
    setSaving(true);
    try{
      for(const [sz,q] of entries){
        const qty=Number(q);
        const pId=selProd.id;
        const cur=getQty(pId,sz);
        if(type==="saida"&&qty>cur){showToast(`Estoque insuficiente: ${sz}`,"error");continue;}
        const newQty=cur+(type==="entrada"?qty:-qty);
        const existing=stock.find(s=>s.pId===pId&&s.sz===sz);
        if(existing?._id){await sb.from(table).update({qty:newQty}).eq("id",existing._id);}
        else{const{data}=await sb.from(table).insert({product_id:pId,size:sz,qty:newQty}).select().single();
          if(data)setStock(prev=>[...prev,{pId,sz,qty:newQty,_id:data.id}]);}
        setStock(prev=>{const idx=prev.findIndex(s=>s.pId===pId&&s.sz===sz);
          if(idx>=0){const u=[...prev];u[idx]={...u[idx],qty:newQty};return u;}return prev;});
        await addMov({type,loc,desc:`${selProd.name} – Tam ${sz} – ${qty} un.`,obs});
      }
      const total=entries.reduce((a,[,q])=>a+Number(q),0);
      await logActivity(type==="entrada"?"entrada_estoque":"saida_estoque",`${selProd.name} · ${total} un. · ${title}`);
      showToast(`${type==="entrada"?"Entrada":"Saída"} registrada! (${total} peças)`);
      setSelProd(null);setQtys({});setObs("");
    }catch(e){showToast("Erro: "+e.message,"error");}
    setSaving(false);
  };

  // ── IMPORT FROM EXCEL ──
  const handleImportFile=async(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    e.target.value="";
    setImporting(true);
    try{
      // Read file as ArrayBuffer
      const buf=await file.arrayBuffer();
      const bytes=new Uint8Array(buf);

      // Parse XLSX manually (basic) — find the correct sheet tab
      // We'll use a simpler approach: read as text and parse CSV if .csv, or use SheetJS CDN
      // Since SheetJS isn't loaded, parse using a fetch trick
      // Actually we'll inject SheetJS dynamically
      if(!window.XLSX){
        await new Promise((res,rej)=>{
          const s=document.createElement("script");
          s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
          s.onload=res; s.onerror=rej;
          document.head.appendChild(s);
        });
      }
      const wb=window.XLSX.read(bytes,{type:"array"});

      // Determine which sheet to use based on loc (galpao or loja)
      const sheetName=wb.SheetNames.find(n=>
        (loc==="loja"&&n.toLowerCase().includes("loja"))||
        (loc==="galpao"&&(n.toLowerCase().includes("galp")||n.toLowerCase().includes("galpão")))
      )||wb.SheetNames[0];

      const ws=wb.Sheets[sheetName];
      const rows=window.XLSX.utils.sheet_to_json(ws,{defval:""});

      // Expected columns: SKU, PRODUTO, TAMANHO, QTD CONTADA
      const preview=[];
      for(const row of rows){
        const sku=String(row["SKU"]||row["sku"]||"").trim();
        const sz=String(row["TAMANHO"]||row["Tamanho"]||row["TAM"]||"").trim();
        const rawQty=row["QTD CONTADA"]||row["QTD"]||row["QUANTIDADE"]||row["Quantidade"]||"";
        if(!sku||!sz||rawQty==="")continue;
        const qty=parseInt(String(rawQty),10);
        if(isNaN(qty))continue;

        // Match product
        const prod=products.find(p=>(p.sku||"").toLowerCase()===sku.toLowerCase());
        if(!prod){preview.push({sku,sz,qty,name:"❓ Produto não encontrado",pId:null,warn:true});continue;}

        const existingStk=stock.find(s=>s.pId===prod.id&&s.sz===sz);
        preview.push({
          sku,sz,qty,
          name:prod.name,
          pId:prod.id,
          stk_id:existingStk?._id||null,
          cur:existingStk?.qty||0,
          warn:false,
        });
      }
      if(preview.length===0){showToast("Nenhuma linha válida encontrada na planilha","error");setImporting(false);return;}
      setImportPreview(preview);
    }catch(err){showToast("Erro ao ler arquivo: "+err.message,"error");}
    setImporting(false);
  };

  const confirmImport=async()=>{
    const valid=importPreview.filter(r=>!r.warn);
    if(valid.length===0){showToast("Nenhum item válido para importar","error");return;}
    setSaving(true);
    let count=0;
    try{
      for(const row of valid){
        const{pId,sz,qty,stk_id,name}=row;
        if(stk_id){
          await sb.from(table).update({qty}).eq("id",stk_id);
        }else{
          const{data}=await sb.from(table).insert({product_id:pId,size:sz,qty}).select().single();
          if(data)setStock(prev=>[...prev,{pId,sz,qty,_id:data.id}]);
        }
        setStock(prev=>{
          const idx=prev.findIndex(s=>s.pId===pId&&s.sz===sz);
          if(idx>=0){const u=[...prev];u[idx]={...u[idx],qty};return u;}
          return prev;
        });
        count++;
      }
      await addMov({type:"contagem",loc,desc:`Contagem importada — ${count} registros`});
      await logActivity("contagem",`Importação de contagem — ${count} itens — ${title}`);
      showToast(`✅ ${count} registros atualizados com sucesso!`);
      setImportPreview(null);
    }catch(err){showToast("Erro na importação: "+err.message,"error");}
    setSaving(false);
  };

  const filtered=[...products].sort((a,b)=>a.name.localeCompare(b.name))
    .filter(p=>p.name.toLowerCase().includes(search.toLowerCase())||p.sku?.toLowerCase().includes(search.toLowerCase()));

  return(
    <div className="fu">
      <PageHeader title={"Estoque — "+title} sub={stock.reduce((a,b)=>a+b.qty,0)+" peças total"}
        actions={[
          <Btn key="imp" v="secondary" onClick={()=>importRef.current?.click()} disabled={importing}>
            {importing?"Lendo...":"📥 Importar Contagem"}
          </Btn>
        ]}/>
      <input ref={importRef} type="file" accept=".xlsx,.xls,.csv" style={{display:"none"}} onChange={handleImportFile}/>

      {/* ── IMPORT PREVIEW MODAL ── */}
      {importPreview&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div style={{background:C.surface,borderRadius:16,width:"min(780px,95vw)",maxHeight:"85vh",display:"flex",flexDirection:"column",boxShadow:"0 20px 60px rgba(0,0,0,.25)"}}>
            {/* Header */}
            <div style={{padding:"20px 24px",borderBottom:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontWeight:700,fontSize:16}}>Prévia da Importação</div>
                <div style={{fontSize:12,color:C.inkLt,marginTop:2}}>
                  {importPreview.filter(r=>!r.warn).length} válidos &nbsp;·&nbsp;
                  <span style={{color:C.red}}>{importPreview.filter(r=>r.warn).length} com problema</span>
                </div>
              </div>
              <button onClick={()=>setImportPreview(null)} style={{background:"none",border:"none",fontSize:22,cursor:"pointer",color:C.inkLt}}>×</button>
            </div>

            {/* Table */}
            <div style={{overflowY:"auto",flex:1,padding:"0 24px"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                <thead style={{position:"sticky",top:0,background:C.surface}}>
                  <tr style={{borderBottom:`2px solid ${C.border}`}}>
                    {["SKU","Produto","Tam","Atual","→ Novo","Status"].map(h=>(
                      <th key={h} style={{padding:"10px 8px",textAlign:"left",fontSize:11,fontWeight:700,color:C.inkLt,letterSpacing:.5,textTransform:"uppercase"}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {importPreview.map((r,i)=>(
                    <tr key={i} style={{borderBottom:`1px solid ${C.border}`,background:r.warn?"#FFF5F5":"transparent"}}>
                      <td style={{padding:"8px",fontWeight:600,color:C.inkMd,fontSize:12}}>{r.sku}</td>
                      <td style={{padding:"8px",fontSize:13}}>{r.name}</td>
                      <td style={{padding:"8px",textAlign:"center",fontWeight:700}}>{r.sz}</td>
                      <td style={{padding:"8px",textAlign:"center",color:C.inkMd}}>{r.warn?"—":r.cur}</td>
                      <td style={{padding:"8px",textAlign:"center",fontWeight:700,color:r.warn?C.red:r.qty!==(r.cur||0)?C.green:C.inkMd}}>{r.warn?"—":r.qty}</td>
                      <td style={{padding:"8px"}}>
                        {r.warn
                          ?<span style={{fontSize:11,color:C.red,fontWeight:600}}>⚠️ Não encontrado</span>
                          :r.qty===(r.cur||0)
                            ?<span style={{fontSize:11,color:C.inkFt}}>Sem alteração</span>
                            :<span style={{fontSize:11,color:C.green,fontWeight:600}}>✓ Atualizar</span>
                        }
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {/* Footer */}
            <div style={{padding:"16px 24px",borderTop:`1px solid ${C.border}`,display:"flex",justifyContent:"flex-end",gap:10}}>
              <Btn v="ghost" onClick={()=>setImportPreview(null)}>Cancelar</Btn>
              <Btn v="success" onClick={confirmImport} disabled={saving||importPreview.filter(r=>!r.warn).length===0}>
                {saving?"Salvando...":"✅ Confirmar e Atualizar Estoque"}
              </Btn>
            </div>
          </div>
        </div>
      )}

      <div style={{display:"grid",gridTemplateColumns:"1fr 380px",gap:16,alignItems:"start"}}>

        {/* LEFT — product list */}
        <div>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar produto..."
            style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:7,color:C.ink,padding:"9px 14px",fontSize:13.5,outline:"none",width:"100%",marginBottom:14,boxSizing:"border-box"}}/>
          <div style={{display:"grid",gap:8}}>
            {filtered.map(p=>{
              const ps=stock.filter(s=>s.pId===p.id);
              const total=ps.reduce((a,b)=>a+b.qty,0);
              const sel=selProd?.id===p.id;
              return(
                <div key={p.id} onClick={()=>{setSelProd(p);setQtys({});}}
                  style={{background:sel?C.goldLt:C.surface,border:`1.5px solid ${sel?C.gold:C.border}`,borderRadius:10,padding:"12px 16px",cursor:"pointer",transition:"all .12s"}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:sel?10:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <Thumb p={p} size={38}/>
                      <div>
                        <div style={{fontWeight:600,fontSize:14}}>{p.name}</div>
                        <div style={{fontSize:11.5,color:C.inkLt}}>{p.sku}{p.color?" · "+p.color:""}</div>
                      </div>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div className="cor" style={{fontSize:20,color:total<=5?C.red:C.gold,fontWeight:700}}>{total}</div>
                      <div style={{fontSize:10,color:C.inkFt}}>peças</div>
                    </div>
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:6}}>
                    {ps.sort((a,b)=>a.sz.localeCompare(b.sz,undefined,{numeric:true})).map(s=>(
                      <div key={s.sz} style={{textAlign:"center",background:s.qty<=3?"#FFF0F0":C.hover,border:`1px solid ${s.qty<=3?C.red:C.border}`,borderRadius:6,padding:"3px 9px",minWidth:44}}>
                        <div style={{fontSize:9,color:C.inkFt,letterSpacing:.3}}>{s.sz}</div>
                        <div style={{fontWeight:700,color:s.qty<=3?C.red:C.ink,fontSize:15}}>{s.qty}</div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* RIGHT — entry/exit panel */}
        <div style={{position:"sticky",top:20}}>
          {!selProd?(
            <Card style={{textAlign:"center",padding:40,color:C.inkFt}}>
              <div style={{fontSize:32,marginBottom:10}}>👆</div>
              <div style={{fontSize:14}}>Selecione um produto ao lado para registrar entrada ou saída</div>
            </Card>
          ):(
            <Card>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,padding:"10px 14px",background:C.hover,borderRadius:8}}>
                <Thumb p={selProd} size={36}/>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:14}}>{selProd.name}</div>
                  <div style={{fontSize:11.5,color:C.inkLt}}>{selProd.sku}</div>
                </div>
                <button onClick={()=>{setSelProd(null);setQtys({});}} style={{background:"none",border:"none",cursor:"pointer",color:C.inkLt,fontSize:18}}>×</button>
              </div>

              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
                {[["entrada","✅ Entrada","green"],["saida","📤 Saída","red"]].map(([val,lbl,col])=>(
                  <button key={val} onClick={()=>setType(val)} style={{padding:"10px",borderRadius:8,border:`1.5px solid ${type===val?C[col]:C.border}`,background:type===val?C[col+"Lt"]:"transparent",color:type===val?C[col]:C.inkMd,cursor:"pointer",fontWeight:600,fontSize:13.5}}>

              <div style={{marginBottom:12}}>

                  <div style={{fontSize:10.5,fontWeight:700,color:C.inkLt,letterSpacing:.5}}>ATUAL</div>
                  <div style={{fontSize:10.5,fontWeight:700,color:C.inkLt,letterSpacing:.5}}>{type==="entrada"?"ENTRADA":"SAÍDA"}</div>
                </div>
                {sortSizes(selProd.sizes||[]).map(sz=>{
                  const cur=getQty(selProd.id,sz);
                  const q=Number(qtys[sz]||0);
                  const after=type==="entrada"?cur+q:cur-q;
                  return(
                    <div key={sz} style={{display:"grid",gridTemplateColumns:"1fr 1fr 80px",gap:6,alignItems:"center",padding:"5px 8px",borderBottom:`1px solid ${C.border}`}}>
                      <div style={{fontWeight:700,fontSize:15,color:C.ink}}>{sz}</div>
                      <div style={{fontSize:13,color:cur<=3?C.red:C.inkMd}}>
                        {cur}
                        {q>0&&<span style={{marginLeft:6,fontSize:11,color:type==="entrada"?C.green:C.red,fontWeight:600}}>→ {after}</span>}
                      </div>
                      <input type="number" min="0" value={qtys[sz]||""} placeholder="0"
                        onChange={e=>setQtys(prev=>({...prev,[sz]:e.target.value}))}
                        onFocus={e=>e.target.select()}
                        style={{width:"100%",background:C.surface,border:`1px solid ${q>0?(type==="entrada"?C.green:C.red):C.border}`,borderRadius:5,color:C.ink,padding:"6px 8px",fontSize:14,fontWeight:q>0?700:400,outline:"none",textAlign:"center"}}/>
                    </div>
                  );
                })}
                <div style={{marginTop:8,padding:"6px 8px",background:C.hover,borderRadius:6,display:"flex",justifyContent:"space-between",fontSize:12.5,color:C.inkMd}}>
